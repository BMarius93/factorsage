name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intrinsic_ci
          POSTGRES_PASSWORD: intrinsic_ci_password
          POSTGRES_DB: intrinsic_value_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U intrinsic_ci -d intrinsic_value_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://intrinsic_ci:intrinsic_ci_password@localhost:5432/intrinsic_value_ci
      # PostgreSQL-backed suites resolve their connection through TEST_DATABASE_URL. The CI
      # database is already dedicated and thrown away with the job, so both point at it.
      # Locally these must differ; the shared test helper enforces that unless CI=true.
      TEST_DATABASE_URL: postgresql://intrinsic_ci:intrinsic_ci_password@localhost:5432/intrinsic_value_ci
      REDIS_URL: redis://localhost:6379
      AUTH_JWT_SECRET: ci-test-only-secret-at-least-32-characters-long
      AUTH_TOKEN_TTL_SECONDS: 3600
      AUTH_COOKIE_NAME: ci_auth
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @intrinsic/stock-data test:redis
      - run: pnpm build

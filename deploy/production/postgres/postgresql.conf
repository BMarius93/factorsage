# PostgreSQL 16 for the reference host (8 vCPU, 32 GB RAM, NVMe): PostgreSQL's share is ~10 GB
# (container limit), sized from docs/production/benchmarks.md. Only non-default settings are listed.

listen_addresses = '*'          # reachable on the internal Docker network only (no published port)
# Connection budget, from the pools every process declares in its DATABASE_URL `connection_limit`:
#   API 20 + worker children 7 x 6 + migrate/backup/psql headroom = well under 100.
max_connections = 100
superuser_reserved_connections = 3

# Memory
shared_buffers = 2560MB
effective_cache_size = 7GB
work_mem = 32MB
maintenance_work_mem = 512MB
huge_pages = try

# WAL and checkpoints: bulk history writes (hydration) are large and bursty.
wal_level = replica             # required for physical backups / point-in-time recovery
wal_compression = lz4
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Planner and I/O, for SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# Parallelism (reads of long histories and result pages)
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Autovacuum: daily-state, price and result tables grow in bulk.
autovacuum_max_workers = 4
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Guard rails: an abandoned transaction or a runaway statement must not hold locks forever.
idle_in_transaction_session_timeout = 5min
lock_timeout = 0                # the application's own advisory locks are transaction-scoped
statement_timeout = 0           # long result writes are legitimate; bounded in application code

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '

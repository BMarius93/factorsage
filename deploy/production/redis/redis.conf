# Redis 7.4 for FactorSage (docs/production/RUNBOOK.md). Redis is disposable infrastructure: every
# stock-cache key is rebuilt from PostgreSQL, so persistence buys a faster restart, never safety.

bind 0.0.0.0                    # the internal Docker network only (no published port)
protected-mode yes              # the password is passed on the command line (docker-compose.yml)
port 6379
tcp-keepalive 60
timeout 0

# Memory. Sized in docs/production/benchmarks.md: protected tier + STOCK_LRU_MAX_SECURITIES=500
# + rate-limit, gate and lock keys, with headroom. The stock cache tiers REQUIRE noeviction
# (docs/decisions/stock-cache-tiers-v1.md §5): an allkeys-* policy would silently evict protected
# securities, and the API's readiness refuses it.
maxmemory 6gb
maxmemory-policy noeviction

# Persistence: RDB snapshots only. A restart reloads both tiers instead of rebuilding the protected
# tier from PostgreSQL (measured in benchmarks.md); losing up to the last interval of cache writes
# costs a rebuild of the securities touched since, nothing else. Less frequent than the stock
# defaults, because each snapshot forks a multi-GB process (copy-on-write memory, latency).
save 900 1
save 300 100000
appendonly no
rdbcompression yes
rdbchecksum yes
# A failed snapshot (disk full) must not turn the cache read-only; it is an alert, not an outage.
stop-writes-on-bgsave-error no

# Diagnosis
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256

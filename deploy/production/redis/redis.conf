# Redis 7.4 for FactorSage (docs/production/RUNBOOK.md). Redis is disposable infrastructure: every
# stock-cache key is rebuilt from PostgreSQL, so persistence buys a faster restart, never safety.

bind 0.0.0.0                    # the internal Docker network only (no published port)
protected-mode yes              # the password is passed on the command line (docker-compose.yml)
port 6379
tcp-keepalive 60
timeout 0

# Memory. Sized in docs/production/architecture.md §3.2: both tiers full (735 protected + 500 LRU
# securities) measured 1.30 GB with 34-year synthetic histories (≈0.95 GB with real ones); 3 GB is
# 2.3x that, room to raise STOCK_LRU_MAX_SECURITIES to ~1,500 without changing this file. The stock
# cache tiers REQUIRE noeviction (docs/decisions/stock-cache-tiers-v1.md §5): an allkeys-* policy
# would silently evict protected securities, and the API's readiness refuses it.
maxmemory 3gb
maxmemory-policy noeviction

# Persistence: RDB snapshots only. A restart reloads both tiers instead of rebuilding the protected
# tier from PostgreSQL (measured: serving again 15.5 s after loading 1.2 GB, 112.7 s from a cold
# disk, against ~15 min to rebuild); losing up to the last interval of cache writes costs a rebuild
# of the securities touched since, nothing else. Less frequent than the stock defaults, because each
# snapshot forks a GB-sized process (measured: 14 s per save, 5 MB copied on write).
save 900 1
save 300 100000
appendonly no
rdbcompression yes
rdbchecksum yes
# A failed snapshot (disk full) must not turn the cache read-only; it is an alert, not an outage.
stop-writes-on-bgsave-error no

# Diagnosis
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256

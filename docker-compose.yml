services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intrinsic_value}
      MYSQL_USER: ${MYSQL_USER:-intrinsic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-intrinsic_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-intrinsic}:${MYSQL_PASSWORD:-intrinsic_dev_password}@mysql:3306/${MYSQL_DATABASE:-intrinsic_value}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-intrinsic}:${MYSQL_PASSWORD:-intrinsic_dev_password}@mysql:3306/${MYSQL_DATABASE:-intrinsic_value}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:

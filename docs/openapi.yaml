# FactorSage HTTP API — OpenAPI 3.1
#
# This document describes the API that `apps/api` actually serves. It is hand-authored, and a test
# checks it rather than trusting it: `apps/api/src/openapi/openapi.contract.test.ts` compiles the
# real Nest application, enumerates every mounted route, and fails when this file documents an
# operation that does not exist, omits one that does, or disagrees with a route's `@RateLimit`
# declaration, its authentication guard, its success status or its path parameters.
# `pnpm openapi:validate` separately validates it against the official OpenAPI 3.1 schema.
#
# What that test does NOT check is worth knowing before trusting a field: request and response
# schemas, validation constraints, examples and prose are hand-maintained and compared with nothing.
# `ai/architecture/rate-limiting.md` section 13 lists the guaranteed and the hand-maintained
# properties side by side.
#
# Conventions used throughout:
#
#   * `x-rate-limit` on an operation names the policy from the rate-limit catalog
#     (`apps/api/src/rate-limit/rate-limit-policies.ts`). `info.x-rate-limit-policies` below
#     carries the catalog itself, and the contract test pins both against the code.
#   * Every rate-limited operation documents `429`, and every response carries the `RateLimit-*`
#     headers. They are written by one interceptor, never per endpoint.
#   * `401` is documented wherever a session is required; `403` wherever an entitlement or a role
#     can refuse an authenticated caller.
#
# Not described here: `apps/web`'s own `/api/logo/{symbol}` route. It belongs to the Next.js
# application, serves image bytes rather than JSON, and is not part of this API.

openapi: 3.1.0

info:
  title: FactorSage API
  version: "1.0.0"
  summary: Stock research, strategy design, backtesting and monitoring.
  description: |
    The HTTP API behind FactorSage.

    **Authentication** is a session cookie issued by `POST /auth/login` or by the Google OAuth
    callback. It is `HttpOnly`, so browser clients send it automatically and never read it; a
    non-browser client must store and resend it. There is no bearer token and no API key.

    **Authorization** has two independent axes, both resolved server-side from persisted state and
    never from anything the client sends: a role (`USER` / `ADMIN`) and a commercial plan
    (`FREE` / `STARTER` / `PRO`). A plan limit is refused with `403` and a stable
    `ENTITLEMENT_*` code. Ownership is not a separate axis — every user-owned collection is scoped
    to the caller, and somebody else's resource answers exactly like one that does not exist.

    **Request bodies are JSON.** A `POST`, `PUT`, `PATCH` or `DELETE` whose `Content-Type` is
    anything but `application/json` (with or without a `charset`) is refused with `415` before it
    is read — form encodings included, which closes cross-site form posts against the cookie session
    (login and sign-out CSRF). A bodyless request without a `Content-Type` is accepted.

    **Rate limiting** is applied per endpoint class from a central policy catalog, keyed by user id
    for authenticated traffic and by client IP otherwise. Exceeding a policy answers `429` with
    `Retry-After`. See `info.x-rate-limit-policies`.

    **Terms acceptance** is a third refusal axis, applied to every authenticated request by one
    global interceptor. A caller whose account has not recorded acceptance of the currently
    required Terms version is refused with `403` and `LEGAL_ACCEPTANCE_REQUIRED`, whose body also
    carries `requiredTermsVersion`. It is `403` rather than `401` on purpose: the session is
    perfectly valid and signing in again changes nothing — the remedy is `POST /legal/acceptance`.
    It never applies to a Guest, and it never applies to the `Authentication`, `Legal`,
    `Entitlements`, health or webhook operations, nor to `GET /billing/status`,
    `POST /billing/refresh` and `POST /billing/portal`: a user who declines must still be able to
    cancel a renewal, exercise statutory rights, reach support and sign out.

    **Errors** share one machine-readable shape: an HTTP `statusCode`, a human `message`, and — for
    every refusal a client may reasonably branch on — a stable `code`. Clients should branch on
    `code`, never on `message`.
  contact:
    name: FactorSage engineering
  license:
    name: UNLICENSED

  # The rate-limit policy catalog, mirrored from `apps/api/src/rate-limit/rate-limit-policies.ts`.
  # The contract test asserts these numbers equal the code's, so a limit change that forgets this
  # document fails the build.
  x-rate-limit-policies:
    auth-sensitive:
      description: Credential, registration, verification and account-recovery endpoints.
      actor: ip
      points: 20
      durationSeconds: 300
      onRedisFailure: deny
    session-probe:
      description: Session, provider-capability and entitlement probes.
      actor: user
      points: 120
      durationSeconds: 60
      onRedisFailure: allow
    stock-search:
      description: Global stock search and recently-viewed resolution.
      actor: user
      points: 60
      durationSeconds: 60
      onRedisFailure: allow
    stock-read:
      description: Stock Details and daily history series; may hydrate from the market-data provider.
      actor: user
      points: 180
      durationSeconds: 60
      onRedisFailure: allow
    standard-read:
      description: Reads of the caller's own resources and system catalogs.
      actor: user
      points: 240
      durationSeconds: 60
      onRedisFailure: allow
    public-share-read:
      description: Unauthenticated reads of a shared backtest report.
      actor: ip
      points: 600
      durationSeconds: 60
      onRedisFailure: allow
    data-export:
      description: Downloads of a complete result set of the caller's own rows.
      actor: user
      points: 20
      durationSeconds: 300
      onRedisFailure: allow
    progress-poll:
      description: Endpoints the client polls on a fixed interval.
      actor: user
      points: 300
      durationSeconds: 60
      onRedisFailure: allow
    mutation:
      description: Writes to the caller's own resources.
      actor: user
      points: 60
      durationSeconds: 60
      onRedisFailure: allow
    monitor-mutation:
      description: Monitor creation, rebinding and deletion.
      actor: user
      points: 30
      durationSeconds: 60
      onRedisFailure: allow
    backtest-execution:
      description: Backtest submission; queues durable worker execution.
      actor: user
      points: 60
      durationSeconds: 3600
      onRedisFailure: allow
      secondary:
        actor: ip
        points: 180
        durationSeconds: 3600
    billing-mutation:
      description: Billing operations that move money through the payment provider.
      actor: user
      points: 20
      durationSeconds: 300
      onRedisFailure: deny
      secondary:
        actor: ip
        points: 60
        durationSeconds: 300
    billing-refresh:
      description: Polled reconciliation of billing state after a hosted payment round trip.
      actor: user
      points: 60
      durationSeconds: 300
      onRedisFailure: deny
      secondary:
        actor: ip
        points: 180
        durationSeconds: 300
    admin-operation:
      description: Privileged administrative operations.
      actor: user
      points: 10
      durationSeconds: 3600
      onRedisFailure: deny

# The four `RateLimit-*` headers every rate-limited response carries. Defined once as a YAML anchor
# and aliased at each response below: OpenAPI's `headers` is a map of header name to Header Object,
# so there is no `$ref` that can stand in for a *set* of them. The alias is resolved at parse time,
# so every consumer sees the four headers written out.
x-rate-limit-response-headers: &rateLimitHeaders
  RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
  RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
  RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
  RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }

servers:
  - url: http://localhost:3001
    description: Local development (`pnpm dev:api`).
  - url: "{scheme}://{host}"
    description: Any deployment. The API is served at the root; there is no path prefix.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.factorsage.example

tags:
  - name: Authentication
    description: |
      Sessions, registration, email verification and password recovery. Every route here carries the
      `auth-sensitive` policy: counted per client IP, and refused rather than allowed when the
      limiter's store is unreachable. `info.x-rate-limit-policies` holds its exact allowance — the
      numbers live there once, checked against the server's catalog, and are deliberately not
      restated in prose.

      The counter is keyed by origin, never by the submitted email address: keying it by account
      would let anybody lock a known victim out by spending the victim's allowance for them.
  - name: Session
    description: Cheap probes the client issues on navigation — who am I, what may I do.
  - name: Stocks
    description: |
      The supported securities catalog and its market data. Readable without a session.
      These are the only public routes that can reach the market-data provider; provider traffic is
      throttled separately by a shared Redis gate that every API and worker process passes through.
  - name: Stock lists
    description: |
      Universes of catalog securities, each with its buy-eligibility windows: the caller's own, and
      the platform's built-in (`SYSTEM`) lists, which everyone may read and only administrators may
      change.
  - name: Alternative data
    description: |
      Insider activity and congressional trading: the canonical actor catalog these domains identify,
      and the reusable groups a strategy scopes a rule to. The product presents the groups inside the
      Lists area rather than as a new top-level section.
  - name: Strategies
    description: |
      Strategy definitions — ordered BUY/SELL levels and an optional final exit: the caller's own,
      and the built-in (`SYSTEM`) strategies, which everyone may read and only administrators may
      change.
  - name: Backtests
    description: |
      Asynchronous historical execution. Submission answers `202` with a queued run; a worker
      process executes it and the client polls `/backtests/{runId}/progress`.
  - name: Shared backtests
    description: |
      The public, read-only report of a backtest its owner chose to share. No session is read and
      no plan applies: the unguessable token in the link is the whole authorization, and a revoked
      link stops answering immediately. Only an allowlisted projection crosses these routes — never
      the strategy, the stock list, its securities, the trades or the owner.
  - name: Monitors
    description: |
      Live evaluation of a strategy against a stock list. Cadence is an application decision and is
      not configurable, so there is deliberately no "scan now" route.
  - name: Dashboard
    description: |
      The current matches and setups of every monitor the caller can see, including the published
      built-in monitors a Guest sees by default.
  - name: Benchmarks
    description: The system-owned benchmark catalog a backtest may compare against.
  - name: Market
    description: |
      What the broad market did, as end-of-day closes. Readable without a session and identical for
      every caller: nothing here depends on who is asking.
  - name: Entitlements
    description: What the current caller's plan allows. Advisory — every limit is enforced again server-side.
  - name: Billing
    description: Subscription status and the hosted payment surfaces.
  - name: Admin
    description: Operator routes. `ADMIN` role required; there is no plan that grants them.
  - name: Legal
    description: |
      Terms acceptance, and the request channels a user keeps whether or not they accept:
      statutory withdrawal, data-protection requests, nonconformity reports and support. Every
      operation here is deliberately outside the acceptance gate described in `info.description`,
      because accepting cannot require having accepted and a user who declines must not be
      trapped.
  - name: Operations
    description: Probes and integration endpoints that are not called by a user.

paths:
  # ---------------------------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Ask for an account — email first, no password.
      description: |
        Email-first registration (AUTH-003). The body is the address and nothing else; any other
        field, including a `password`, is ignored. For every well-formed address the answer is the
        same `202 { "status": "accepted" }` with no cookie — whether the address is new, has a
        pending registration, belongs to a verified password account, a Google-only account or
        both, or was submitted a moment ago — so this cannot be used to discover who has an
        account. Only a malformed address is refused (`400`).

        What happens next is decided by the account and is never reported. A new address becomes
        a pending account with no password and is mailed an activation link; a pending account is
        mailed a fresh link; a verified account is left untouched and its owner is mailed a
        neutral notice with no link that changes anything. At most one such email goes to an
        address per cooldown window (`REGISTRATION_EMAIL_COOLDOWN_SECONDS` in the API), however
        many requests arrive; requests inside the window change nothing, so a link already
        delivered stays valid. Email is sent after the
        response, so a slow or failing mail provider does not change it either.

        The first usable password is set only by the holder of the activation link, through
        `POST /auth/verify-email`. Registration never signs anybody in.
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            examples:
              default:
                value: { email: "trader@example.com" }
      responses:
        "202":
          description: |
            Accepted. Identical for every account state; says nothing about whether an account
            exists or whether an email was sent.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Redeem an email-verification token and set the account's password.
      description: |
        The token is single-use. Redeeming it installs the password in the request body as the
        account's password, marks the address verified, records the submitted Terms acceptance
        for the account, and ends every earlier session of the account, in one transaction
        (AUTH-002). Acceptance and activation therefore commit or roll back together: an
        activated account without its acceptance is not a reachable state. A password given at registration is never activated
        by verification: only the holder of the emailed link has proven control of the mailbox. The
        new password must satisfy the current registration policy. No session is issued; the owner
        signs in with the new password afterwards.
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: The address is verified, the password is set, and the account may sign in.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyEmailResponse" }
        "400":
          description: |
            The request is malformed — the token is missing or out of bounds, or the password is
            missing or fails the policy. Nothing is redeemed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            The token is unknown, expired, already used, or superseded by a newer link. One answer
            for all of them; nothing changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/resend-verification:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Send another verification email.
      description: |
        Always `202`, for any address. An unknown address, an already-verified account and a real
        pending one are indistinguishable from the response, so this cannot be used to enumerate
        accounts. Only a pending account is mailed, and it shares registration's per-address
        cooldown (AUTH-003): a request inside the window neither sends nor invalidates the link
        already delivered.
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "202":
          description: Accepted. Nothing is revealed about whether an email was actually sent.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      summary: Request a password-reset link.
      description: |
        Always `202`. An unknown address, a Google-only account with no local password and a real
        local account all answer identically, so the endpoint reveals neither who has an account nor
        how they sign in.
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "202":
          description: Accepted.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Redeem a reset token and set a new password.
      description: The token is single-use. The new password must satisfy the current registration policy.
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: The password was replaced.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "400":
          description: The token is invalid or expired, or the password fails the policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in and receive the session cookie.
      description: |
        On success the response carries `Set-Cookie` with the session. The cookie is `HttpOnly` and
        `SameSite=Lax`, and `Secure` in production.

        A `429` here refuses the attempt whether or not the credentials were correct, so a client
        must present it as throttling and never as "wrong password".
      x-rate-limit: { policy: auth-sensitive }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie. Its name is deployment configuration; the default is `intrinsic_auth`.
              schema: { type: string }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining:
              { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            The credentials were rejected. One generic answer for an unknown address, a wrong
            password, an account without a local password, and an account whose address has never
            been verified (AUTH-003) — a pending account has no credential anybody proved, so it
            is indistinguishable from no account at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Clear the session cookie.
      description: |
        Succeeds whether or not a session existed; there is nothing to discover from it. Signs out
        this browser only: the session is not revoked, so the account's other sessions stay signed
        in. `POST /auth/logout-all` ends every session.
      x-rate-limit: { policy: session-probe }
      responses:
        "204":
          description: The cookie has been cleared.
          headers: *rateLimitHeaders
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout-all:
    post:
      tags: [Session]
      operationId: logoutEverywhere
      summary: Sign out everywhere.
      description: |
        Revokes every session of the signed-in account — every device, and any captured copy of a
        session cookie — and clears this browser's cookie. Each revoked session receives the same
        generic `401` as an expired one on its next request. Takes no request body.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Every session of the account has been revoked and this browser's cookie cleared.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Session]
      operationId: getCurrentUser
      summary: The signed-in user.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: session-probe }
      responses:
        "200":
          description: The caller's identity, role and persisted plan.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/providers:
    get:
      tags: [Session]
      operationId: getAuthProviders
      summary: Which external sign-in providers this deployment has configured.
      description: Non-secret capability probe, so the sign-in UI only offers what will work.
      x-rate-limit: { policy: session-probe }
      responses:
        "200":
          description: Provider availability.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProvidersResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleSignIn
      summary: Begin Google sign-in.
      description: |
        Browser redirect, not a JSON endpoint. Mints a state/PKCE/nonce transaction bound to one
        short-lived `HttpOnly` cookie and redirects to Google. When Google sign-in is not configured
        it redirects back to the web app's login page with `error=oauth_unavailable`.

        An optional `next` names the web-app page to return to after a successful sign-in. It is
        validated server-side (an app-relative path: a single leading `/`, no `//`, no backslash,
        no scheme or host, no control characters at any level of percent-decoding, at most 2048
        characters), kept in the transaction cookie, and validated again at the callback because
        that cookie is not signed. An absent or invalid value means `/dashboard`. The callback only
        ever redirects to `WEB_BASE_URL` followed by that path.
      x-rate-limit: { policy: auth-sensitive }
      parameters:
        - name: next
          in: query
          required: false
          description: |
            App-relative path (with its query string) to land on after sign-in, for example
            `/backtests/new?strategyId=…`. Anything that is not a safe app-relative path is ignored
            and the sign-in lands on `/dashboard`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Google, or back to the login page when the provider is unavailable.
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie:
              description: The single-use OAuth transaction cookie.
              schema: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleSignIn
      summary: Google's redirect back from the authorization page.
      description: |
        Browser redirect, not a JSON endpoint, and not called directly by any client. Always
        redirects: on success, with the session cookie set, to the return path recorded by
        `GET /auth/google` after re-validating it (or to the dashboard when there is none or it is
        invalid), always on `WEB_BASE_URL`; on failure, to the login page with a stable `error`
        code. Failure detail from the provider never reaches the browser.
      x-rate-limit: { policy: auth-sensitive }
      parameters:
        - name: code
          in: query
          description: Google's authorization code.
          schema: { type: string }
        - name: state
          in: query
          description: Must match the value bound to the transaction cookie.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the web app, signed in or carrying an `error` code.
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie:
              description: The session cookie on success; the cleared transaction cookie either way.
              schema: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  # ---------------------------------------------------------------------------------------------
  # Entitlements
  # ---------------------------------------------------------------------------------------------
  /entitlements:
    get:
      tags: [Entitlements]
      operationId: getEntitlements
      summary: What the current caller is allowed to do.
      description: |
        Readable without a session: a guest is an access state rather than an account, and asking
        this creates nothing.

        The response is **advisory**. Every limit in it is enforced again server-side from the
        persisted plan and role, so a client that ignores it — or forges a better-looking copy —
        still cannot exceed anything.
      x-rate-limit: { policy: session-probe }
      responses:
        "200":
          description: The resolved entitlements for the caller, guest or authenticated.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementsResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Stocks
  # ---------------------------------------------------------------------------------------------
  /stocks/search:
    get:
      tags: [Stocks]
      operationId: searchStocks
      summary: Search the supported securities catalog.
      description: |
        Matches symbol and name against the locally persisted catalog. No session required; a guest
        is counted against their client IP.
      x-rate-limit: { policy: stock-search }
      parameters:
        - name: q
          in: query
          required: true
          description: Search term. Must be non-blank after trimming.
          schema: { type: string, minLength: 1 }
          example: AAPL
      responses:
        "200":
          description: Matching securities, best match first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockSearchResult" }
        "400":
          description: "`q` was missing or blank."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}:
    get:
      tags: [Stocks]
      operationId: getStockDetails
      summary: The composite Stock Details payload for one security.
      description: |
        Identity, profile, and one bounded window of prices, technicals, intrinsic values and
        blends. The requested range is clamped to the product history horizon before any security is
        resolved, so an unbounded `from` cannot turn into an unbounded backend read. Omitting the
        range returns the surface's default window.

        A cold security is hydrated from the market-data provider on demand, which is why this class
        of route carries a tighter policy than a read of the caller's own rows.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200":
          description: The security, its profile when one has been hydrated, and the bounded series.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/summary:
    get:
      tags: [Stocks]
      operationId: getStockSummary
      summary: The latest state of one security, for every Stock Details section but the chart.
      description: |
        Identity and profile, the newest finalized end-of-day bar with the session before it and
        the trailing 52-week range, the newest intrinsic value of each model and blend, all five
        valuation ratios, all fifteen Fundamental Metrics, EMA 50D, EMA 200D and RSI 14D, and the
        newest quarterly reporting period public by that session. No history is returned: the chart
        loads its own window from `GET /stocks/{symbol}` independently.

        It waits for the same canonical readiness as every Stock Details read — hydration of the
        retained history and the end-of-day freshness check, behind the per-security load lock — so
        a summary and a chart request for a cold security share one hydration. The readings are then
        selected from one trailing window (`window`, one year ending at the newest finalized
        session): each is the newest session of the window on which the series has a value, with
        that session's `date`. Nothing is recalculated for this read: ratios come from the one
        valuation-ratio calculation, Fundamental Metrics and technicals from the persisted
        point-in-time derived state, and intrinsic values from the materialized models and blends.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
      responses:
        "200":
          description: The security's latest state.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/prices:
    get:
      tags: [Stocks]
      operationId: getDailyPrices
      summary: Daily OHLCV history.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/FromRequired" }
        - { $ref: "#/components/parameters/ToRequired" }
      responses:
        "200":
          description: One row per trading day in the clamped range, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyPrice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/technicals/daily:
    get:
      tags: [Stocks]
      operationId: getDailyTechnicals
      summary: Daily technical series — moving averages, oscillators and Relative Volume.
      description: |
        Weekly moving averages are carried forward onto each trading day. A value that does not
        exist for a day — warm-up, or data the point-in-time rules make unavailable — is **omitted**
        rather than zeroed.

        Relative Volume rides on the same row. It is not a catalog series, so it has no `series`
        identifier: an unnarrowed read carries it, and a read narrowed with `series` returns
        exactly the catalog series named.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/FromRequired" }
        - { $ref: "#/components/parameters/ToRequired" }
        - name: series
          in: query
          description: |
            Narrows the response to these catalog series. Repeat the parameter or comma-separate the
            values. Omitting it returns every technical series. An identifier that is not a
            moving average or an oscillator is rejected rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/TechnicalSeriesField" }
          style: form
          explode: true
          example: [sma50d, rsi14d]
      responses:
        "200":
          description: One row per trading day, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyTechnical" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/fundamentals/daily:
    get:
      tags: [Stocks]
      operationId: getDailyFundamentalMetric
      summary: One Fundamental Metric's daily history, from the persisted derived state.
      description: |
        The chosen metric's value on every trading day of the clamped range, read from the same
        point-in-time daily derived state a Strategy Condition and a backtest read — never
        recalculated from statements, and never taken from a provider's ratio endpoint. A value
        changes only on the first trading session after a new or revised statement became public
        and is carried forward unchanged between those events.

        Only the named metric is returned. A session on which the metric is unavailable keeps its
        row with `value` **omitted**: never `null`, never zero, and never an earlier value carried
        through the interval. Sessions are completed end-of-day trading sessions; nothing here is a
        realtime reading.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/FromRequired" }
        - { $ref: "#/components/parameters/ToRequired" }
        - name: metric
          in: query
          required: true
          description: |
            Exactly one Fundamental Metric, by its stable identity. Matched exactly: a label
            (`ROIC TTM`), a lowercase or storage spelling (`roic_ttm`, `roicTtm`), a repeated or
            comma-separated value, or anything outside the list is rejected with `400`.
          schema: { $ref: "#/components/schemas/FundamentalMetricId" }
          example: ROIC_TTM
      responses:
        "200":
          description: One row per trading day in the clamped range, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyFundamentalMetric" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/valuation-ratios/daily:
    get:
      tags: [Stocks]
      operationId: getDailyValuationRatio
      summary: One valuation ratio's daily history, computed when it is read.
      description: |
        The chosen ratio on every trading day of the clamped range, computed when it is read by
        the one calculation a Strategy Condition, a backtest and a Monitor read: the session's
        stored close against the statements public by that session, under the price-basis rules
        of the Valuation Ratios V1 design. Nothing is stored per session, and nothing is taken
        from a provider's ratio endpoint.

        Only the named ratio is returned. A session on which the ratio is unavailable keeps its
        row with `value` **omitted**: never `null`, never zero, and never an earlier value carried
        through the interval. The sessions are the daily price history's own; the newest is the
        newest stored daily bar, read at its own close, and nothing is a realtime reading.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/FromRequired" }
        - { $ref: "#/components/parameters/ToRequired" }
        - name: ratio
          in: query
          required: true
          description: |
            Exactly one valuation ratio, by its stable identity. Matched exactly: a label (`P/E`), a
            lowercase or other spelling (`price_to_earnings_ttm`, `priceToEarningsTtm`), a repeated
            or comma-separated value, or anything outside the list is rejected with `400`.
          schema: { $ref: "#/components/schemas/ValuationRatioId" }
          example: PRICE_TO_EARNINGS_TTM
      responses:
        "200":
          description: One row per trading day in the clamped range, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyValuationRatio" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/intrinsic-values:
    get:
      tags: [Stocks]
      operationId: getIntrinsicValues
      summary: Modelled intrinsic value per share, by valuation date.
      description: |
        Point-in-time correct: every value is derived only from data that was available on its
        `sourceDataAsOf`, never from later filings.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/AsOf" }
        - name: models
          in: query
          description: Restricts the response to these valuation models. Repeat or comma-separate.
          schema:
            type: array
            items: { $ref: "#/components/schemas/IntrinsicValueModel" }
          style: form
          explode: true
      responses:
        "200":
          description: Valuation points, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntrinsicValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  /stocks/{symbol}/intrinsic-value-blends:
    get:
      tags: [Stocks]
      operationId: getIntrinsicValueBlends
      summary: Blended intrinsic value per share, by valuation date.
      x-rate-limit: { policy: stock-read }
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/AsOf" }
        - name: blendIds
          in: query
          description: Restricts the response to these blends. Repeat or comma-separate.
          schema:
            type: array
            items: { $ref: "#/components/schemas/IntrinsicValueBlendId" }
          style: form
          explode: true
      responses:
        "200":
          description: Blend points, oldest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntrinsicValueBlend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/StockDataUnavailable" }

  # ---------------------------------------------------------------------------------------------
  # Recently viewed
  # ---------------------------------------------------------------------------------------------
  /recent-searches:
    get:
      tags: [Stocks]
      operationId: listRecentSearches
      summary: The securities the caller viewed most recently.
      description: |
        Readable without a session. A guest keeps its own recents in the browser and sends them as
        `ids` for resolution against the live catalog; for an authenticated caller the set comes
        from the database and `ids` is ignored entirely, so nothing a client sends can add to or
        reorder it.
      x-rate-limit: { policy: stock-search }
      parameters:
        - name: ids
          in: query
          description: Guest-supplied catalog security ids to resolve. Ignored when a session is present.
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
      responses:
        "200":
          description: At most five securities, newest first.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/StockSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Stocks]
      operationId: recordSecurityView
      summary: Record that the caller opened one security's details.
      description: |
        Authenticated only. A guest's recents never reach the server, so a silent `204` for one
        would be a write that pretends to have happened; guests get `401`, which clients treat like
        any other failure of this call — nothing on the page depends on it.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordSecurityViewRequest" }
      responses:
        "204":
          description: Recorded.
          headers: *rateLimitHeaders
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such security in the supported catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Stock lists
  # ---------------------------------------------------------------------------------------------
  /lists:
    get:
      tags: [Stock lists]
      operationId: listStockLists
      summary: The built-in stock lists, then the caller's own.
      description: |
        Readable without a session: a Guest receives the built-in (`SYSTEM`) lists only. A signed-in
        caller receives the built-ins first, in operator order, then their own lists. Each summary
        carries a `compliance` block reporting a customer list against the plan's symbol limit — a
        list that grew under a higher plan stays readable and is reported as non-compliant rather
        than truncated. Built-ins are platform content and always compliant.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The lists the caller can use.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockListSummary" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Stock lists]
      operationId: createStockList
      summary: Create a stock list.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStockListRequest" }
            examples:
              withMembers:
                value:
                  name: "Dividend watchlist"
                  description: "Large-cap payers"
                  securityIds: ["6f1b0a1e-8a6c-4c1a-9f0e-2b6c4d8e1a33"]
      responses:
        "201":
          description: The created list.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/{listId}:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
    get:
      tags: [Stock lists]
      operationId: getStockList
      summary: One stock list with its members and buy windows.
      description: Readable without a session for a built-in list; a customer list needs its owner.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The list.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListDetail" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    patch:
      tags: [Stock lists]
      operationId: updateStockList
      summary: Rename a list or change its description.
      description: |
        At least one of `name` or `description` must be present. `description: null` clears it.
        A built-in list may be changed by an administrator only.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStockListRequest" }
      responses:
        "200":
          description: The updated summary.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    delete:
      tags: [Stock lists]
      operationId: deleteStockList
      summary: Delete a list.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Deleted.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: |
            A monitor still references this list (delete or rebind the monitor first), or the list
            is built-in content, which is never deleted (`SYSTEM_CONTENT_PROTECTED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/universes:
    get:
      tags: [Stock lists]
      operationId: listHistoricalUniverses
      summary: The historical universe catalog, grouped as the Lists page shows it.
      description: |
        Every customer-facing historical universe — the index memberships, the sectors, the market
        cap, style and Dow strategy universes — grouped by category, with whether it is available
        and whether the caller's plan unlocks it. Readable without a session. Metadata only: no
        membership is read and nothing reaches the market-data provider.

        `availability` is `UNAVAILABLE` ("Historical data unavailable") for a universe whose
        point-in-time data does not exist or has not been validated, whatever the plan; `locked` is
        true ("Requires Pro") when the caller's plan does not include premium content. Internal
        research universes are never listed.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The catalog.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalUniverseCatalog" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/{listId}/duplicate:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
    post:
      tags: [Stock lists]
      operationId: duplicateStockList
      summary: Copy a list into a new list the caller owns.
      description: |
        The source may be the caller's own list or a built-in one; a list that belongs to another
        customer answers `404`, exactly like one that does not exist. Only the name comes from the
        request: the server copies the source's description, its members in their order and every
        member's buy-window mode and canonical ranges, under new identities. Nothing that records
        past activity is copied — backtest runs and monitors keep referencing the source — and the
        source is never changed.

        The copy is an ordinary list owned by the caller, whatever the source's ownership: no
        `systemKey` or built-in status carries over, and the caller may edit and delete it like any
        list they created. It is a new custom list, so the plan's symbol limit applies to it exactly
        as it does to `POST /lists`; a built-in's exemption from that limit does not travel with a
        copy.

        A maintained historical universe (a List whose detail carries `universe`) cannot be copied
        and answers `409`, whatever the caller's plan: a copy would stop being maintained, and so
        point-in-time, and would outlive the plan that unlocks the universe.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateStockListRequest" }
            examples:
              copy:
                value:
                  name: "Dividend watchlist — Copy"
      responses:
        "201":
          description: The copy, with its members and buy windows.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: The source is a maintained historical universe, which is never copied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/{listId}/items:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
    post:
      tags: [Stock lists]
      operationId: addStockListItems
      summary: Add securities to a list.
      description: |
        Idempotent and therefore `200`, not `201`: already-member securities are skipped and the
        whole updated list is returned. At most 100 ids per request, deduplicated.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddStockListItemsRequest" }
      responses:
        "200":
          description: The updated list.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListDetail" }
        "400":
          description: Malformed ids, too many in one request, or a security outside the supported catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementOrContentForbidden" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/{listId}/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
      - { $ref: "#/components/parameters/ItemId" }
    delete:
      tags: [Stock lists]
      operationId: removeStockListItem
      summary: Remove one security from a list.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Removed.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /lists/{listId}/items/{itemId}/buy-windows:
    parameters:
      - { $ref: "#/components/parameters/ListId" }
      - { $ref: "#/components/parameters/ItemId" }
    put:
      tags: [Stock lists]
      operationId: replaceBuyWindows
      summary: Replace a member's complete buy-eligibility configuration.
      description: |
        A whole-configuration replace, never a merge. `FULL` persists no ranges. `CUSTOM` is stored
        in canonical normalized form — sorted, non-overlapping, non-adjacent, at most one
        open-ended — so the response may legitimately contain fewer ranges than the request.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceBuyWindowsRequest" }
            examples:
              custom:
                value:
                  mode: CUSTOM
                  ranges:
                    - { startDate: "2020-01-01", endDate: "2021-12-31" }
                    - { startDate: "2023-06-01", endDate: null }
      responses:
        "200":
          description: The member, with its canonical normalized windows.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Strategies
  # ---------------------------------------------------------------------------------------------
  /strategies:
    get:
      tags: [Strategies]
      operationId: listStrategies
      summary: The built-in strategies, then the caller's own.
      description: |
        Readable without a session: a Guest receives the built-in (`SYSTEM`) strategies only.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: Summaries, without the definitions.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrategySummary" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Strategies]
      operationId: createStrategy
      summary: Create a strategy.
      description: |
        The definition is validated by the same canonical validator the Strategy Builder runs, so a
        rejection carries path-addressed `issues` the UI attaches to the exact row that produced
        them rather than showing a banner.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStrategyRequest" }
      responses:
        "201":
          description: The created strategy, with its canonical normalized definition.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDetail" }
        "400": { $ref: "#/components/responses/StrategyInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /strategies/{strategyId}:
    parameters:
      - { $ref: "#/components/parameters/StrategyId" }
    get:
      tags: [Strategies]
      operationId: getStrategy
      summary: One strategy with its full definition.
      description: Readable without a session for a built-in strategy; a customer strategy needs its owner.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The strategy.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDetail" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    patch:
      tags: [Strategies]
      operationId: updateStrategy
      summary: Rename a strategy or change its description.
      description: |
        Metadata only. The definition is replaced through its own endpoint. A built-in strategy may
        be changed by an administrator only.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStrategyRequest" }
      responses:
        "200":
          description: The updated summary.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategySummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    delete:
      tags: [Strategies]
      operationId: deleteStrategy
      summary: Delete a strategy.
      description: |
        Completed backtest runs are unaffected: a run holds an immutable snapshot of the strategy it
        executed, so deleting the live strategy never deletes or reinterprets a result.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Deleted.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: |
            A monitor still references this strategy (delete or rebind the monitor first), or the
            strategy is built-in content, which is never deleted (`SYSTEM_CONTENT_PROTECTED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /strategies/{strategyId}/duplicate:
    parameters:
      - { $ref: "#/components/parameters/StrategyId" }
    post:
      tags: [Strategies]
      operationId: duplicateStrategy
      summary: Copy a strategy into a new strategy the caller owns.
      description: |
        The source may be the caller's own strategy or a built-in one; a strategy that belongs to
        another customer answers `404`, exactly like one that does not exist. Only the name comes
        from the request, and any other property is refused: the server copies the source's
        description and its **current** definition, which becomes version 1 of the copy. Earlier
        versions, backtest runs, monitors and their signals stay with the source, which is never
        changed.

        Every level, FINAL EXIT, exit rule, condition and trigger id in the copy is new, so no
        monitor state keyed by the source's level ids can ever apply to it; the logic is otherwise
        identical, rule for rule and in the same order. The copy is an ordinary strategy owned by
        the caller, whatever the source's ownership, and is edited and deleted like any other.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateStrategyRequest" }
            examples:
              copy:
                value:
                  name: "Value & Trend — Copy"
      responses:
        "201":
          description: The copy, with its re-keyed canonical definition at version 1.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /strategies/{strategyId}/definition:
    parameters:
      - { $ref: "#/components/parameters/StrategyId" }
    put:
      tags: [Strategies]
      operationId: replaceStrategyDefinition
      summary: Replace the complete strategy definition.
      description: |
        Atomic whole-document replace; it creates a new strategy version when the logic changed.
        Partial edits are not supported — send the entire definition. A built-in strategy may be
        changed by an administrator only, and is versioned exactly like a customer's.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ReplaceStrategyDefinitionRequest" }
      responses:
        "200":
          description: The strategy with its new canonical definition and incremented version.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDetail" }
        "400": { $ref: "#/components/responses/StrategyInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Backtests
  # ---------------------------------------------------------------------------------------------
  /backtests:
    get:
      tags: [Backtests]
      operationId: listBacktestRuns
      summary: The caller's backtest runs, whole or a page at a time.
      description: |
        With `page` or `pageSize` (present at all, however malformed), one page of the caller's runs
        and its counts — the collection's read. Without either, every matching run as a plain array,
        as this route has always answered; the New backtest form reads `?status=ACTIVE` this way to
        show the runs holding a concurrency slot.

        Either way the search, the status filter and the order are applied in the database, and no
        run's snapshot is opened: a row reads the names stored with the run when it was queued, the
        benchmark's code and the pinned series, and its stored result. Every order ends on the queue
        time and the run id, so a page boundary never splits or repeats runs with equal keys.

        Lenient like the trade log: a malformed or unknown value is ignored (no search, every
        status, newest first, the default page size), a page past the end is the last real page,
        and the page response reports what was applied.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based. Asks for the paged answer.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          description: Asks for the paged answer.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive text matched against the strategy, stock list and benchmark names the
            runs were submitted with. `%` and `_` are literal. Ignored above 100 characters. A
            search that names a Run ID (`Run #0012`, `run 12`, `#12`, `12`) also matches that run.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          required: false
          description: |
            `ACTIVE` is every run still queued or executing; `COMPLETED`, `FAILED` and `CANCELLED`
            are the terminal statuses. Case-insensitive.
          schema: { type: string, enum: [ACTIVE, COMPLETED, FAILED, CANCELLED] }
        - name: sort
          in: query
          required: false
          description: |
            `newest` / `oldest` by queue time; `cagr` by the stored annualized return, best first,
            runs without one last; `strategy` by strategy name A–Z, ignoring case.
          schema:
            type: string
            enum: [newest, oldest, cagr, strategy]
            default: newest
      responses:
        "200":
          description: |
            A `BacktestRunPage` when a page was asked for; otherwise every matching run, in the
            requested order (newest first by default).
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/BacktestRunSummary" }
                  - { $ref: "#/components/schemas/BacktestRunPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Backtests]
      operationId: submitBacktestRun
      summary: Submit a backtest for asynchronous execution.
      description: |
        Answers `202` with a queued run rather than blocking: a backtest is durable work a separate
        worker process executes, sometimes for minutes. Poll `/backtests/{runId}/progress`.

        Submission takes an immutable snapshot of the strategy, the list, the securities and their
        buy windows, the benchmark and the engine methodology. Nothing in a submitted run is ever
        re-derived from current rows, so editing or deleting any of them afterwards cannot change or
        invalidate the result.

        This is the most expensive thing a client can ask for, so `backtest-execution` is the
        tightest capacity policy in the catalog. It carries two buckets — one per user and a wider
        one per client address, the second being what sees one origin spreading submissions across
        several accounts. See `info.x-rate-limit-policies` for both allowances.

        A request refused by either bucket does not consume usable allowance from the other, so
        retrying after your own allowance is gone cannot drain the shared one for everybody else
        behind your address.

        All of that is separate from `backtests.maxConcurrentRuns`, which is a plan entitlement and
        bounds how many may execute at once rather than how fast they may be submitted.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: backtest-execution }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBacktestRunRequest" }
            examples:
              default:
                value:
                  strategyId: "1f2e3d4c-5b6a-4790-8123-456789abcdef"
                  stockListId: "9a8b7c6d-5e4f-4321-8fed-cba987654321"
                  benchmarkCode: "SP500"
                  startDate: "2015-01-01"
                  endDate: "2024-12-31"
                  initialCapital: 100000
                  monthlyContribution: 1000
                  maximumPositions: 10
      responses:
        "202":
          description: The run was queued. Its status is `QUEUED` and no result exists yet.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRunDetail" }
        "400":
          description: |
            The configuration cannot be executed — an unknown or unowned strategy or list, an empty
            list, an out-of-range period, or a capital/allocation value outside its bounds. Carries
            `code: BACKTEST_INVALID`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid:
                  value:
                    statusCode: 400
                    message: "The selected stock list has no securities."
                    code: BACKTEST_INVALID
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: |
            Not the caller's fault, and the same request will work later. Either the run cannot be
            created under the methodology it would have to record — for example the execution
            calendar is unavailable — or the deployment-wide queue already holds as many waiting
            runs as it accepts (`code: BACKTEST_QUEUE_FULL`, with `Retry-After`). Nothing was
            created.
          headers:
            Retry-After:
              description: Seconds to wait before retrying, on `BACKTEST_QUEUE_FULL`.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backtests/{runId}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: getBacktestRun
      summary: One run — its immutable configuration snapshot, progress and result.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: |
            The run. `result` is populated only for `COMPLETED`; `failure` only for `FAILED`;
            `live` only while a simulation is in flight.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRunDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/progress:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: getBacktestProgress
      summary: Live progress for one run.
      description: |
        Designed to be polled: about once a second while a run is `RUNNING` or `FINALIZING`, and
        every two and a half seconds otherwise. `sequence` is monotonic per run, so a client can
        drop a response that lost a race, and a terminal run never reopens.

        This is the only polled endpoint in the API and it has a policy of its own sized for that
        cadence. A client that receives `429` here should honour `Retry-After` rather than keep its
        timer — the page it is drawing does not need to blank out, and retrying inside the window
        cannot succeed.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: progress-poll }
      responses:
        "200":
          description: The newest checkpoint.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/trades:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: getBacktestTrades
      summary: One page of a run's trade log, newest first unless asked otherwise.
      description: |
        The log is paged in the database rather than in the browser: a thirty-year run can execute
        tens of thousands of trades and the page on screen is fifty of them. Ordering is the
        engine's own execution sequence, descending by default.

        `symbol` and `action` narrow the log and `order` turns it around, in the same queries as the
        paging: `totalCount`, `pageCount` and every page describe the filtered log as a whole, and
        `unfilteredCount` still reports every trade the run executed. `symbols` lists every stock
        the run traded, whatever the filter, so a client can offer the filter without loading the
        log.

        Paging is deliberately forgiving. A page past the end is clamped to the last real page and
        the response reports the `page` actually served, so a stale bookmark lands somewhere real;
        a malformed `page` or `pageSize` falls back to the default rather than answering `400`, and
        an unrecognised filter is ignored — the response's `symbol`, `action` and `order` report
        what was applied.

        Each trade carries the rule that produced it, described from the run's own immutable
        snapshot — never from the strategy as it stands today.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - { $ref: "#/components/parameters/TradeLogSymbol" }
        - { $ref: "#/components/parameters/TradeLogAction" }
        - { $ref: "#/components/parameters/TradeLogOrder" }
      responses:
        "200":
          description: The requested page, with the filtered and the run's true trade counts.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestTradePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/trades/export:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: exportBacktestTrades
      summary: A run's trade log as a CSV download — every trade the filter selects.
      description: |
        The same filter and order as `GET /backtests/{runId}/trades`, read by the same rules, but
        the whole filtered log rather than one page: the file holds exactly the trades the table
        could page through, in the same order. It is streamed in batches, so a long run never sits
        in memory as one document.

        The file is UTF-8 with a byte-order mark (so spreadsheets decode the non-ASCII text in
        strategy descriptions and names correctly), CRLF line endings and RFC 4180 quoting. The
        columns are raw values for a spreadsheet, never localized: `Sequence`, `Date` (ISO),
        `Symbol`, `Name`, `Action`, `Source`, `Level %`, `Shares`, `Price`, `Amount`,
        `Realized P/L`, `Realized P/L %` and `Reason`. Numbers are the stored decimals, unrounded;
        an empty cell is a value that does not exist, such as a buy's realized profit. Any text cell
        that begins with `=`, `+`, `-`, `@`, a tab or a carriage return is prefixed with `'`, so no
        spreadsheet evaluates it as a formula.

        `Content-Disposition` names the file after the run and the filter, from ASCII letters,
        digits and hyphens only. Another user's run answers `404`, exactly as the page does.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: data-export }
      parameters:
        - { $ref: "#/components/parameters/TradeLogSymbol" }
        - { $ref: "#/components/parameters/TradeLogAction" }
        - { $ref: "#/components/parameters/TradeLogOrder" }
      responses:
        "200":
          description: The filtered trade log as a CSV attachment.
          headers:
            Content-Disposition:
              description: '`attachment; filename="factorsage-trades-<run>[-<symbol>][-<action>][-oldest-first].csv"`'
              schema: { type: string }
            Cache-Control:
              description: "`no-store`: the file is the caller's own data."
              schema: { type: string }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining:
              { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            text/csv:
              schema: { type: string }
              example: "Sequence,Date,Symbol,Name,Action,Source,Level %,Shares,Price,Amount,Realized P/L,Realized P/L %,Reason\r\n2,2024-03-01,AAPL,Apple Inc.,SELL,END_OF_BACKTEST,,10,180.5,1805,105,6.17647059,End of backtest\r\n"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/strategy:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: getBacktestRunStrategy
      summary: The exact strategy definition this run executed.
      description: |
        Read from the run's immutable snapshot, never from the live strategy. It stays correct after
        the strategy has been edited or deleted, which is what makes a result reproducible.

        The snapshot is never rewritten, so a run submitted under an older definition schema keeps
        that document on disk; the response projects it to the canonical current one.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The snapshotted strategy name, version number and definition.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRunStrategy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    post:
      tags: [Backtests]
      operationId: cancelBacktestRun
      summary: Stop the caller's run.
      description: |
        A `QUEUED` run is cancelled at once. An executing run keeps its execution slot until the
        worker running it stops at its next checkpoint, usually within seconds; until then the run
        reports `cancellation`, and then `CANCELLED`. A run that reaches its final write before the
        worker sees the request completes normally. Idempotent: cancelling a `CANCELLED` run
        returns it unchanged. Owner only; another user's run answers exactly like one that does not
        exist.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "200":
          description: The run after the request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRunDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "409":
          description: The run already completed or failed; there is nothing to stop.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    required: [code]
                    properties:
                      code: { type: string, const: BACKTEST_NOT_CANCELLABLE }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backtests/{runId}/share:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      tags: [Backtests]
      operationId: getBacktestShare
      summary: Whether the caller's run is shared, and its public link.
      description: |
        Owner only. Another user's run answers exactly like one that does not exist.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The run's sharing state.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      tags: [Backtests]
      operationId: enableBacktestShare
      summary: Share a completed run publicly, or return the link it already has.
      description: |
        Idempotent. A run holds at most one active link: asking again returns the same URL. The
        token is 256 random bits and never contains a database identifier. Only a `COMPLETED` run
        with a stored result can be shared; any other state answers `409`. No entitlement applies.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "200":
          description: The run's active link.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "409":
          description: The run is not completed, so it has no result to share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [Backtests]
      operationId: revokeBacktestShare
      summary: Stop sharing the run.
      description: |
        The link stops working on the next request — the report, its preview data and the preview
        image alike — and can never be revived: sharing again creates a new link. Idempotent.
        Third-party services that already fetched a link preview may keep showing their own copy.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: The run is not shared.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Shared backtests
  # ---------------------------------------------------------------------------------------------
  /shared-backtests/{token}:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    get:
      tags: [Shared backtests]
      operationId: getSharedBacktestReport
      summary: The public report of a shared backtest.
      description: |
        Readable by anyone holding the link, signed in or not, on any plan; nothing about the caller
        changes the answer. Every figure is the owner's own stored result, projected by the same
        code as the owner's page. A malformed, unknown or revoked token, and a run without a result,
        all answer the same `404`. `Cache-Control: no-store`, so no shared cache outlives a
        revocation.
      x-rate-limit: { policy: public-share-read }
      responses:
        "200":
          description: The allowlisted report.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedBacktestReport" }
        "404": { $ref: "#/components/responses/SharedBacktestNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /shared-backtests/{token}/preview:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    get:
      tags: [Shared backtests]
      operationId: getSharedBacktestPreview
      summary: What a shared backtest's link-preview image is drawn from.
      description: |
        The headline figures of the stored result and the two absolute scenario lines — Strategy
        and benchmark — thinned to at most 600 points for drawing, with every bucket's highest and
        lowest value of each line kept so a drawdown is not smoothed away. No figure is computed
        from the thinned series.
      x-rate-limit: { policy: public-share-read }
      responses:
        "200":
          description: The preview card's data.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedBacktestPreview" }
        "404": { $ref: "#/components/responses/SharedBacktestNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /demo-backtests:
    get:
      tags: [Shared backtests]
      operationId: listDemoBacktests
      summary: The operator-featured demonstration backtests.
      description: |
        A curated shelf of at most twelve shared reports, in display order, for anyone — Guests
        included — to read instead of running a backtest. Each entry carries exactly what its shared
        report publishes: the headline figures and the general parameters, never the strategy, the
        list, the securities or the trades. Reading it executes nothing. Revoking a featured run's
        link removes it at once, so the answer is never cached (`Cache-Control: no-store`).
      x-rate-limit: { policy: public-share-read }
      responses:
        "200":
          description: The demonstrations, in display order; empty when none is featured.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoBacktestList" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Benchmarks
  # ---------------------------------------------------------------------------------------------
  /benchmarks:
    get:
      tags: [Benchmarks]
      operationId: listBenchmarks
      summary: The selectable benchmark catalog.
      description: |
        System-owned and read-only. A benchmark is passive comparison data, never a tradable
        security: it is never bought, consumes no cash or position slot, and carries no derived
        series. The provider symbol behind one never crosses this contract.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: Every benchmark this deployment offers.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Benchmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Market
  # ---------------------------------------------------------------------------------------------
  /market-overview:
    get:
      tags: [Market]
      operationId: getMarketOverview
      summary: How the twenty market-overview ETFs have performed.
      description: |
        Readable without a session, and identical for a Guest and a signed-in caller: a fund closed
        where it closed. Exactly twenty exchange-traded funds in three ordered groups — Benchmarks
        (5), Sector Performance (11), Macro & Alternatives (4) — each with six trailing price
        returns and, for each of the same six periods, a short trend line over exactly the window
        that period's return measures. The provider symbol and the storage behind each fund never
        cross this contract; `ticker` is a display field.

        Every number is derived from **end-of-day closes** — `basis` says so explicitly — and nothing
        here is intraday: a session counts only once its close has been published. `returnBasis:
        PRICE_RETURN` means the change in the split-adjusted close, with distributions excluded.
        Each period is measured from the fund's own latest completed session to its most recent
        session on or before the period's anchor (7 calendar days; 1, 3 and 6 calendar months; the
        last session of the previous year; one calendar year). A return the history cannot support
        is `null`, never zero. A fund behind the overview's reference session (`asOf`) is `STALE`
        and keeps its own `sessionDate`; a fund with no data is `UNAVAILABLE`, so one unreadable
        series costs one row instead of the whole response.

        The summary is read from stored history only — it never asks the market-data provider —
        and computed at most once a minute per API process. The response is `Cache-Control:
        private, max-age=60`: the body is everybody's, but the rate-limit headers are the caller's.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: Three groups of funds, in display order.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketOverviewResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Monitors
  # ---------------------------------------------------------------------------------------------
  /monitors:
    get:
      tags: [Monitors]
      operationId: listMonitors
      summary: The built-in monitors, then the caller's own.
      description: |
        Readable without a session: a Guest receives the published built-in (`SYSTEM`) monitors
        only. A signed-in caller also receives their own, and an administrator additionally
        receives unpublished built-ins. Every row carries the one Enabled / Disabled switch,
        `enabled`: a customer's own monitor's lifecycle, or — for a built-in — the caller's own
        choice for their account (absence of a stored choice is the default, enabled, so a Guest
        always reads `true`). A monitor that is being evaluated also carries `synchronization`:
        how far its evaluation covers the rolling 30-day activity window.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The monitors the caller can see.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitorSummary" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Monitors]
      operationId: createMonitor
      summary: Create a monitor.
      description: |
        A monitor is a live strategy reference plus a live stock list reference plus `enabled`, and
        nothing else. There is no pinned version, no execution parameter and no cadence: scan
        frequency is an application decision. Unknown fields are **rejected** rather than ignored,
        so an attempt to set a cadence fails loudly instead of appearing to work.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: monitor-mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMonitorRequest" }
      responses:
        "201":
          description: The created monitor, with the current status of every monitored security.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorDetail" }
        "400":
          description: Malformed body, an unknown field, or a strategy or list the caller does not own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementDenied" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /monitors/{monitorId}:
    parameters:
      - { $ref: "#/components/parameters/MonitorId" }
    get:
      tags: [Monitors]
      operationId: getMonitor
      summary: One monitor, its monitored securities and its newest signals.
      description: |
        Readable without a session for a published built-in monitor. A customer monitor needs its
        owner; an unpublished built-in is visible to administrators only.

        `view=summary` answers the monitor's page as it renders: the same detail without
        `securities` (one row per current member — hundreds for an index universe) and without
        `signals` (the page reads `/monitors/{monitorId}/signals` a page at a time), and with
        `memberCounts` instead. The members are evaluated exactly as for the full detail; they are
        only counted rather than sent. Any other `view` is the full detail.
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [summary] }
      responses:
        "200":
          description: The monitor; `MonitorDetailSummary` with `view=summary`.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/MonitorDetail" }
                  - { $ref: "#/components/schemas/MonitorDetailSummary" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    patch:
      tags: [Monitors]
      operationId: updateMonitor
      summary: Rename, enable/disable, or rebind a monitor.
      description: |
        Changing `strategyId` or `stockListId` **rebinds** the monitor. That is a configuration
        boundary, not an edit: transition state is discarded, active signals are resolved and
        `lastScanAt` is cleared, while signal history is kept. An in-flight scan cycle is fenced off
        so it cannot write state belonging to the old configuration.

        `enabled` switches a customer's own monitor on or off (switching on is a capacity decision).
        On a built-in, any signed-in caller may send `enabled` alone: it is the caller's own choice
        for their account — whether they receive the built-in's Dashboard activity — and it never
        changes whether the shared built-in is evaluated, never another user's choice, and consumes
        no monitor allowance. Everything else about a built-in may be changed by an administrator
        only: its name, its binding (to other built-in content only), `isPublished`,
        `isGloballyEnabled` and `displayOrder`. Those three fields are refused on a customer's
        monitor. A monitor switched on, or rebound, is evaluated by the next pass rather than at the
        next scheduled interval; its missing sessions of the activity window are caught up then.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: monitor-mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMonitorRequest" }
      responses:
        "200":
          description: The updated summary.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSummary" }
        "400":
          description: Malformed body, an unknown field, a field that does not apply to this monitor, or a strategy or list the caller does not own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EntitlementOrContentForbidden" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    delete:
      tags: [Monitors]
      operationId: deleteMonitor
      summary: Delete a monitor.
      description: |
        The monitor's signals and transition history go with it. A built-in monitor is never
        deleted; an administrator unpublishes or pauses it instead.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: monitor-mutation }
      responses:
        "204":
          description: Deleted.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: The monitor is built-in content, which is never deleted (`SYSTEM_CONTENT_PROTECTED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemContentError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------------------------
  /monitors/{monitorId}/signals:
    parameters:
      - { $ref: "#/components/parameters/MonitorId" }
    get:
      tags: [Monitors]
      operationId: listMonitorSignals
      summary: The monitor's signal table, with why each signal is active or ended.
      description: |
        Active occurrences first, most recent activation first, then resolved occurrences, most
        recent resolution first; every occurrence is its own row. `state=PENDING_TRIGGER` lists
        the setups waiting for their trigger instead. Each row explains itself from the decision
        that put it there, under the Strategy version recorded with it: `why.basis` is `EVIDENCE`
        with the values that decision compared, or `RULE_ONLY` for an older row recorded without
        them. Readable without a session for a published built-in monitor, like the monitor itself.

        Keyset-paged: `nextCursor` continues from the last row's sort keys, never from an offset.
        Each page is read in one consistent snapshot beside a count of the monitor's state
        transitions, and the cursor carries that count and the filters it was issued for. When a
        session has been evaluated or the monitor rebound since the first page, the next page is
        refused with 409 rather than mixed with the table the caller saw; the caller starts over
        from the first page. A cursor used with other filters is a 400. The first page also returns
        `counts` for each group under the level filter.
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: state
          in: query
          required: false
          description: Absent lists active then resolved occurrences.
          schema: { type: string, enum: [ACTIVE, RESOLVED, PENDING_TRIGGER] }
        - name: levelKind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StrategyLevelKind" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string }
      responses:
        "200":
          description: One page of the signal table.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSignalPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: >-
            The signal table changed since the cursor's first page was read. Start over without a
            cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /monitors/{monitorId}/activity:
    parameters:
      - { $ref: "#/components/parameters/MonitorId" }
    get:
      tags: [Monitors]
      operationId: getMonitorActivity
      summary: One monitor's observed activity history, newest session first.
      description: |
        The Dashboard's activity feed (`/dashboard/activity`) over this monitor alone: the same
        events, order, pages, cursors, `kind` filter and `through` re-reads — no second event
        model. Visible exactly where the monitor is: a published built-in without a session, a
        customer monitor to its owner, an unpublished built-in to administrators. Unlike the
        Dashboard it does not depend on what the viewer follows there: a built-in hidden from the
        caller's Dashboard, or the caller's own monitor switched off, still has its history here.
        `monitorId` is the path's and is refused as a query parameter.
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [ACTIVATED, RESOLVED] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: through
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of the monitor's activity, or one read of a `through` range.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardActivityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /dashboard/activity:
    get:
      tags: [Dashboard]
      operationId: getDashboardActivity
      summary: Observed monitor activity, newest session first.
      description: |
        The end-of-day activity of the monitors the caller has enabled, over the rolling 30-day
        window (`windowStart`: exactly 30 calendar days ending on the newest finalized session by the
        canonical end-of-day policy — never a weekend or a holiday — and moving as each session
        becomes final). An event belongs to the window by its session, never by when it was
        recorded: one found today for a session older than the window is not activity. The window
        applies in the query to every read — pages, cursors, filters and `through`. An occurrence
        a finalized session activated (`ACTIVATED`), or one a market observation ended
        (`RESOLVED`, conditions no longer hold). An event found after its session became final — a
        window replay, a resumed monitor's catch-up, a member added later — is included with
        `fromHistory: true`, dated by its session, with `recordedAt` saying when it was found.
        Never included: a reconstructed state, administrative endings (an edit, a removal, a
        membership change, a rebind), a trigger day passing, setups waiting for a trigger, any change
        without recorded evidence, and occurrences the earlier live-quote monitor decided on an
        intraday price. Ordered by the exchange session, then by insertion order, and paged by
        `cursor`.

        Readable without a session: a Guest sees the published built-ins, all enabled. A signed-in
        caller also sees their own enabled monitors, and built-ins they have disabled are left out.
        `monitorId` narrows the feed to one of those monitors; any other id yields no events.
        `kind` narrows it to one kind of event, in the database, so every page and its cursor are of
        that kind alone; both filters combine.

        `through=<event id>` reads the range a caller already holds instead of a page: every event
        from the newest down to and including that one, 200 at a time, continued with `cursor` (the
        range's own `nextCursor`). Re-reading it is how a reader refreshes: it returns new events
        above, and events written late for a session inside the range, wherever they sort. When the
        event's session has since left the window, the range is every event the window still holds
        (the aged-out events are no longer in it). An event the caller cannot see in this feed —
        another kind, a disabled or unknown monitor — yields no events, and the caller starts over
        from the first page.
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: monitorId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          required: false
          description: Only events of this kind — activations, or market resolutions.
          schema: { type: string, enum: [ACTIVATED, RESOLVED] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema: { type: string }
        - name: through
          in: query
          required: false
          description: >-
            An event id: read every event from the newest down to and including it, 200 per read.
            `limit` does not apply.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of activity, or one read of a `through` range.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardActivityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Every current monitor match and setup the caller can see.
      description: |
        Readable without a session. A Guest sees the published built-in monitors, all enabled by
        default. A signed-in caller also sees their own monitors, and built-ins they have disabled
        for their account are left out of `rows`. Signing in changes only which monitors are
        enabled for the caller, never what any monitor decided.

        `rows` holds `ACTIVE` signal occurrences and `PENDING_TRIGGER` setups only, one row per
        monitor outcome — the same security under two monitors is two rows — newest state change
        first. A paused, disabled or plan-blocked monitor contributes no rows. `freshness` reports
        each monitor's latest scan honestly, against `staleAfterMs`.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The Dashboard read model.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------
  # Billing
  # ---------------------------------------------------------------------------------------------
  /billing/status:
    get:
      tags: [Billing]
      operationId: getBillingStatus
      summary: The caller's subscription state and the price catalog.
      description: |
        `plan` is the **persisted** plan — the same column every entitlement check reads — and is
        deliberately not recomputed from the payment provider for this response. Showing something
        the guards would refuse is exactly the optimistic display the billing decision forbids.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: Billing status. `subscription` is null when there is none.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /billing/refresh:
    post:
      tags: [Billing]
      operationId: refreshBillingStatus
      summary: Reconcile from the payment provider, then return status.
      description: |
        What the billing page calls after returning from a hosted provider surface. It is a read of
        authoritative provider state run through the same reconciliation a webhook runs — not a
        grant — so a cancelled subscription or a failed card produces the honest answer rather than
        the optimistic one. Its value is latency only; webhooks remain the authority, and a
        reconciliation failure still returns the persisted status rather than failing the page.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: billing-refresh }
      responses:
        "201":
          description: |
            Billing status after reconciliation.

            `201` rather than `200` because the handler declares no explicit status and the
            framework's default for `POST` applies. It creates nothing at this URL, so read it as
            "accepted and applied"; the status is recorded here because it is what the endpoint
            actually sends, and changing it would be a breaking change to a shipped route.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /billing/checkout:
    post:
      tags: [Billing]
      operationId: startCheckout
      summary: Start hosted checkout for one catalog price.
      description: |
        Accepts one of the catalog's **logical** price keys and nothing else. No provider price, customer or
        subscription identifier is accepted from a client, anywhere in this API.

        Returns the URL rather than redirecting, so the browser controls navigation and a refusal
        stays a normal JSON error.

        At most one session per account can be paid: creating one first expires every earlier
        session of the account that is still open, and a session stops accepting payment 35 minutes
        after it is created. A subscription the provider already holds refuses the request even
        before FactorSage has been told of it.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: billing-mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingTargetRequest" }
      responses:
        "201":
          description: A hosted checkout session URL.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckoutResponse" }
        "400":
          description: "Not a known price key. `code: BILLING_INVALID_PRICE_KEY`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Already subscribed, as FactorSage or the provider records it. `code: BILLING_ALREADY_SUBSCRIBED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }

  /billing/portal:
    post:
      tags: [Billing]
      operationId: openBillingPortal
      summary: Open the hosted customer portal.
      description: |
        Bound to the session's user; there is no parameter naming a customer, which is what makes
        "one user cannot open another's portal" a property of the shape rather than of a check.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: billing-mutation }
      responses:
        "201":
          description: A hosted portal session URL.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingPortalResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "No subscription to manage. `code: BILLING_NO_SUBSCRIPTION`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }

  /billing/change:
    post:
      tags: [Billing]
      operationId: changeSubscription
      summary: Move an existing subscription to another catalog price.
      description: |
        Exists because the hosted portal cannot express immediate-for-upgrades and
        period-end-for-downgrades at the same time. The response says which effect was applied and
        when it takes hold. An upgrade whose payment has not succeeded never grants a plan. An
        immediate change replaces a change scheduled for the period end, which then never applies.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: billing-mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingTargetRequest" }
      responses:
        "201":
          description: The transition that was applied or scheduled.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingChangeResponse" }
        "400":
          description: "Not a known price key. `code: BILLING_INVALID_PRICE_KEY`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: "Payment is required before the change can apply. `code: BILLING_PAYMENT_REQUIRED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "409":
          description: |
            The transition is not allowed, there is nothing to change, or no subscription exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }

  # ---------------------------------------------------------------------------------------------
  # Admin
  # ---------------------------------------------------------------------------------------------
  /admin/health:
    get:
      tags: [Admin]
      operationId: getAdminHealth
      summary: Confirms the caller holds the `ADMIN` role.
      description: |
        Not a dependency probe — `/health/ready` is that. This exists so an operator surface can
        verify its own access without attempting a privileged operation.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The caller is an administrator.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RoleForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/built-ins:
    get:
      tags: [Admin]
      operationId: getBuiltInContent
      summary: Every built-in list, strategy and monitor, published or not.
      description: |
        The administrator's overview of built-in content. Built-ins are edited through the ordinary
        list, strategy and monitor routes, which authorize an administrator for built-in content.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The built-in content.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/BuiltInContentAdminResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RoleForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/securities/sync:
    post:
      tags: [Admin]
      operationId: syncSecurityCatalog
      summary: Reconcile the supported securities catalog against the provider universe.
      description: |
        The only path that adds to the catalog. Catalog **identity only**: prices, fundamentals and
        derived state stay lazy and load when a stock is actually opened.

        Expensive, provider-backed and normally run on a schedule, so `admin-operation` is the
        narrowest allowance in the catalog (see `info.x-rate-limit-policies`) and is refused rather
        than allowed when the limiter's store is unreachable. `200`, not `201`: it reconciles an
        existing catalog rather than creating a resource at this URL.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: admin-operation }
      responses:
        "200":
          description: What the synchronization did.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SecurityCatalogSyncResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RoleForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The provider-backed synchronization could not complete. Retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/congress-members/sync:
    post:
      tags: [Admin]
      operationId: syncCongressMemberCatalog
      summary: Synchronize the member catalog with the provider's member directory.
      description: |
        Fills the catalog a Congressional rule selects from with every member the provider's
        directory lists — in office and former — whether or not a disclosure of theirs has ever been
        loaded. **Identity only**, as `securities/sync` is: it adds members and records the
        directory's spelling of their names. It loads no disclosure, changes no coverage, and
        **never removes a member**: one the directory stops listing keeps their row and their id.

        A run reads the whole directory before it writes anything, so it either wrote all of it or
        none of it. Runs are exclusive: while one is in progress any other caller is answered `409`
        and the provider is not asked. Safe to repeat; a run over an unchanged directory writes
        nothing.

        Provider-backed, so it shares `admin-operation` with `securities/sync` and is refused rather
        than allowed when the limiter's store is unreachable. `200`, not `201`: it reconciles a
        catalog rather than creating a resource at this URL.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: admin-operation }
      responses:
        "200":
          description: What the synchronization did.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CongressMemberCatalogSyncResponse",
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RoleForbidden" }
        "409":
          description: Another synchronization is running. The provider was not asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: |
            The directory could not be read whole, so nothing was written and the catalog is exactly
            as it was. The message names why (`PROVIDER_UNAVAILABLE`, `DIRECTORY_EMPTY`, …).
            Retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------------------------
  # Operations — not called by a user, and deliberately not rate limited
  # ---------------------------------------------------------------------------------------------
  /health:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Liveness. Is the process up?
      description: |
        Answers only whether the process is running, so an orchestrator restarts a hung process and
        never a healthy one whose dependency is down.
      x-rate-limit:
        exempt: true
        reason: >-
          Orchestrator probe. A throttled probe reads as a failed one, so limiting it would take a
          healthy instance out of rotation — the opposite of what the endpoint is for.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness. Can this instance serve the product?
      description: |
        Probes the two dependencies every request path needs — PostgreSQL and Redis — each bounded
        by a timeout so a hung dependency reports as failed rather than hanging the probe. The
        market-data provider is deliberately **not** probed: a provider outage or rate limit is
        absorbed by the shared provider gate and must never take an instance out of rotation.

        Redis's `maxmemory-policy` is read too. An `allkeys-*` policy that no operator accepted makes
        the instance unavailable: it may evict any key, which would silently break the residency of
        the benchmark histories and the hydration locks. A policy that cannot be read is reported
        and never fails the probe.
      x-rate-limit:
        exempt: true
        reason: >-
          Orchestrator probe, as for `/health`. Bounded work, and throttling it would cause the
          failure it is meant to detect.
      responses:
        "200":
          description: Every dependency answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: A dependency failed. The body is the same readiness document, naming which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }

  # ---------------------------------------------------------------------------------------------
  # Legal
  # ---------------------------------------------------------------------------------------------
  /legal/acceptance:
    get:
      tags: [Legal]
      operationId: getLegalAcceptance
      summary: What this account has accepted, and whether anything is outstanding.
      description: |
        `outstanding` is the field the acceptance gate acts on, and the server decides it — a
        client renders it and never computes its own answer.

        `records` is the account's own append-only evidence: for each document, the version, the
        SHA-256 digest of the exact text of that version, whether the record is an acceptance or a
        notice that was presented, the surface it was given on, and the server time. The digest is
        what lets a record resolve to the text it was given for after the copy moves on.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: session-probe }
      responses:
        "200":
          description: The caller's acceptance state.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAcceptanceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }
    post:
      tags: [Legal]
      operationId: acceptLegalTerms
      summary: Record acceptance of the current Terms version.
      description: |
        Identity-bound by construction: the body carries no address and the URL carries no token,
        so nothing here can record acceptance on behalf of somebody whose address was merely typed
        into a registration form. The account is the authenticated session's.

        The body is a **version**, not a boolean. A boolean records that a box was ticked; a
        version plus the stored document digest records what was agreed to. A missing, unknown or
        superseded version is `400` with `LEGAL_TERMS_VERSION_MISMATCH` and writes nothing.

        Idempotent: repeated or concurrent submissions for one version produce exactly one record
        per document and the first one keeps its timestamp. The acceptance **surface** is resolved
        server-side from persisted state and is never read from the request.

        One acceptance writes three records: the Terms and the Risk Disclosure as `ACCEPTED` —
        the Terms say the Risk Disclosure forms part of them — and the Privacy Policy as
        `NOTICE_PRESENTED`, because a privacy notice is information rather than a consent.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalAcceptanceRequest" }
      responses:
        "200":
          description: Recorded. The body is the caller's acceptance state after the write.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAcceptanceStatus" }
        "400":
          description: |
            The submitted version is missing, malformed, or not the one currently required
            (`LEGAL_TERMS_VERSION_MISMATCH`). Nothing is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /legal/requests:
    get:
      tags: [Legal]
      operationId: listLegalRequests
      summary: This account's own submitted requests, newest first.
      description: |
        Scoped to the authenticated account, like every other user-owned collection: somebody
        else's request is not visible and not addressable.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The caller's requests and their receipts.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/LegalRequestReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }
    post:
      tags: [Legal]
      operationId: submitLegalRequest
      summary: Submit a withdrawal, privacy, nonconformity or support request.
      description: |
        The response **is** the durable receipt: a reference to quote, the server's submission
        time, and the exact text submitted.

        A receipt acknowledges **receipt** and nothing more. It is not a decision on the request,
        not a statement that money has been returned, and not a confirmation that data has been
        erased. Submitting moves no money, changes no subscription and deletes nothing: the
        operator handles the request, and the rules for doing so are an outstanding owner decision
        recorded in `docs/legal/owner-inputs-and-review.md`.

        No email is sent, because this deployment has no approved monitored mailbox to send from
        (owner input `O2`). A client should therefore make the on-screen receipt savable.

        Repeating a submission creates a second request with its own reference rather than being
        merged: nothing here has a double effect to protect against, and silently swallowing the
        second would lose a request somebody deliberately sent.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalRequestSubmission" }
      responses:
        "201":
          description: Recorded. The body is the durable receipt.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalRequestReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ThrottlingUnavailable" }

  /webhooks/stripe:
    post:
      tags: [Operations]
      operationId: receiveStripeWebhook
      summary: Payment-provider event delivery.
      description: |
        Called by the payment provider, never by a client of this API. Documented because the route
        exists and is publicly reachable, not because anything should call it.

        No session and no CSRF token: the only thing that authenticates the caller is a signature
        over the **raw** body, computed with this endpoint's signing secret. A payload that has been
        parsed and re-serialized cannot verify. Unsigned JSON is never accepted, and nothing —
        including any database write — runs before the signature check passes.

        The status code is a control channel. `200` means "durably handled, do not send again", and
        is also returned for an event this deployment does not act on. `400` is an invalid
        signature, which the provider does not retry. `500` means "try again" and is returned for a
        transient failure, because the provider's retry is the recovery mechanism.
      security: [{ stripeSignature: [] }]
      x-rate-limit:
        exempt: true
        reason: >-
          The caller is the payment provider, not a user. Delivery volume is its retry schedule, and
          a 429 would simply be retried for days while the billing change it carries stays
          unapplied. Abuse protection is the signature check plus event-id idempotency.
      requestBody:
        required: true
        description: A provider event envelope. The raw bytes are what the signature covers.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Durably handled, or acknowledged as an event this deployment ignores.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received: { type: boolean, const: true }
                  outcome:
                    type: string
                    description: What was done with the event.
                    examples: [handled, ignored, duplicate]
        "400":
          description: "Missing or invalid signature. Not retried by the provider."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "500":
          description: Transient failure. The provider should retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Billing is not configured in this deployment. `code: BILLING_NOT_CONFIGURED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }

  # -----------------------------------------------------------------------------------------------
  # Alternative data: the canonical actor catalog, and the legacy groups over it
  # -----------------------------------------------------------------------------------------------
  /alternative-data/actors:
    get:
      tags: [Alternative data]
      operationId: searchAlternativeDataActors
      summary: Search the canonical actor catalog.
      description: |
        Members of Congress, matched on either spelling of their name or on the bioguide id they are
        identified by. Readable without a session: the catalog is platform reference data, not
        anybody's content, and the Strategy Builder needs it to label a saved rule's scope.

        A term shorter than two characters is treated as no term rather than as an error, and returns
        the first page in name order so the picker opens on something.

        A member has up to two spellings, both the provider's own: the one their disclosures use,
        which is `displayName`, and the one the member directory uses. A term is matched against
        both, so "Bill Cassidy" finds the senator returned as "William Cassidy". When a term of
        several words matches nobody whole, the members whose names share some of its words are
        returned instead, those sharing most first — the provider holds no nicknames, so "Ted Cruz"
        is found by the surname. A term that matches anybody whole returns exactly those matches and
        nothing else.

        **What the catalog holds depends on whether it has been synchronized**
        (`GET /alternative-data/actors/catalog`). Synchronized, it holds every member the provider's
        directory listed at that time — in office and former — whether or not a disclosure of theirs
        has been loaded. Not synchronized, it holds only the members some loaded disclosure named,
        and an empty result does not mean the member does not exist. Being in the catalog says
        nothing about a member's trading: it is an identity, not a disclosure history.
      x-rate-limit: { policy: stock-search }
      parameters:
        - name: q
          in: query
          description: Search term. Matched against both spellings of the name and the external identifier.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching actors, in name order.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlternativeDataActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /alternative-data/actors/catalog:
    get:
      tags: [Alternative data]
      operationId: getAlternativeDataActorCatalog
      summary: Whether the actor catalog has been filled from the provider's member directory.
      description: |
        Lets a client read an empty search correctly. With a `SYNCHRONIZED` catalog an empty result
        means nobody matches; otherwise the member may simply not be in the catalog yet.

        It reports what a synchronization did, never what the provider would say now: it is one
        stored row, and neither this route nor opening the Strategy Builder asks the provider
        anything. A catalog that was synchronized once stays `SYNCHRONIZED` through a later failed
        run, because it still holds what the last complete run wrote.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The catalog's state.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorCatalogStatus" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /alternative-data/actors/resolve:
    get:
      tags: [Alternative data]
      operationId: resolveAlternativeDataActors
      summary: Actors by id.
      description: |
        Labels the actors a saved strategy references without searching for them. Ids are opaque, so an
        unknown id is simply absent from the result rather than an error — which is also how a client
        learns that a member a rule selects is no longer in the catalog.

        One request names at most 50 distinct ids; a repeated id counts once. A rule can select up to
        250 members, so a client resolving a larger set asks in batches.
      x-rate-limit: { policy: standard-read }
      parameters:
        - name: ids
          in: query
          description: Comma-separated actor ids, at most 50 distinct.
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: The actors that exist, in name order.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlternativeDataActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /actor-groups:
    get:
      tags: [Alternative data]
      operationId: listActorGroups
      deprecated: true
      summary: The built-in actor groups, then the caller's own.
      description: |
        **Legacy.** Congress groups left the product on 2026-10-11: a rule now selects the members it
        counts (`ActorScope` `ACTORS`), no surface manages groups, and a strategy write naming one is
        refused. The group routes remain for strategies saved before then, which still name a group
        until they are edited or converted — this one supplies the group's name, and the detail route
        its members so the rule can be turned into a selection.

        Readable without a session: a Guest receives the built-in (`SYSTEM`) groups only.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The groups the caller can use.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActorGroupSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    post:
      tags: [Alternative data]
      operationId: createActorGroup
      deprecated: true
      summary: Create an actor group.
      description: |
        **Legacy** — see `listActorGroups`. A group created now can be referenced by no new strategy
        write.

        A group is an explicit list of members of Congress. Membership is never inferred from a
        committee or a ranking, and a backtest freezes it at submission.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActorGroupRequest" }
            examples:
              houseLeadership:
                value:
                  name: "House leadership"
                  description: "Members whose disclosures are worth watching"
                  actorIds: ["6f1b0a1e-8a6c-4c1a-9f0e-2b6c4d8e1a33"]
      responses:
        "201":
          description: The created group, with its members.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorGroupDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /actor-groups/{groupId}:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [Alternative data]
      operationId: getActorGroup
      deprecated: true
      summary: One actor group with its members.
      description: Readable without a session for a built-in group; a customer group needs its owner.
      x-rate-limit: { policy: standard-read }
      responses:
        "200":
          description: The group.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorGroupDetail" }
        "403": { $ref: "#/components/responses/LegalAcceptanceRequired" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    patch:
      tags: [Alternative data]
      operationId: updateActorGroup
      deprecated: true
      summary: Rename a group or change its description.
      description: |
        At least one of `name` or `description` must be present. `description: null` clears it. The
        actor kind is never changed: a group that held the wrong kind would silently make every rule
        scoped to it count nothing.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActorGroupRequest" }
      responses:
        "200":
          description: The updated summary.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorGroupSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

    delete:
      tags: [Alternative data]
      operationId: deleteActorGroup
      deprecated: true
      summary: Delete an actor group.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Deleted.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "409":
          description: |
            A strategy still references this group, or the group is built-in content, which is never
            deleted (`SYSTEM_CONTENT_PROTECTED`). A referencing strategy would silently start counting
            every actor instead of the curated set, so the strategy is changed first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /actor-groups/{groupId}/members:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      tags: [Alternative data]
      operationId: addActorGroupMembers
      deprecated: true
      summary: Add actors to a group.
      description: |
        Idempotent — actors already in the group are skipped — so the handler reconciles state rather
        than creating a resource, and answers `200` with the updated group. Every actor must exist and
        be of the group's own kind.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddActorGroupMembersRequest" }
      responses:
        "200":
          description: The group, with its members.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorGroupDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /actor-groups/{groupId}/members/{actorId}:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
      - { $ref: "#/components/parameters/ActorId" }
    delete:
      tags: [Alternative data]
      operationId: removeActorGroupMember
      deprecated: true
      summary: Remove one actor from a group.
      description: Removing an actor that is not a member is a no-op, so a retry is harmless.
      security: [{ cookieAuth: [] }]
      x-rate-limit: { policy: mutation }
      responses:
        "204":
          description: Removed.
          headers: *rateLimitHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SystemContentReadOnly" }
        "404": { $ref: "#/components/responses/OwnedResourceNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

# =================================================================================================
# Components
# =================================================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: intrinsic_auth
      description: |
        The session cookie issued by `POST /auth/login` or by the Google callback. `HttpOnly`,
        `SameSite=Lax`, and `Secure` in production. Its name is deployment configuration
        (`AUTH_COOKIE_NAME`); `intrinsic_auth` is the default. A browser sends it automatically —
        cross-origin callers must send credentials explicitly, and the deployment's CORS allowlist
        must contain their origin. A session stays valid until it expires or until the account's
        sessions are revoked — by a password reset or `POST /auth/logout-all` — whichever comes
        first.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: |
        Signature over the raw request body, verified with the webhook signing secret. The only
        authentication the webhook endpoint has, and the only one it needs.

  headers:
    RateLimitPolicy:
      description: The rate-limit policy that produced the numbers in the other headers.
      schema: { type: string }
      example: standard-read
    RateLimitLimit:
      description: The policy's allowance for the current window.
      schema: { type: integer, minimum: 1 }
      example: 240
    RateLimitRemaining:
      description: Allowance left after this request.
      schema: { type: integer, minimum: 0 }
      example: 239
    RateLimitReset:
      description: Whole seconds until the allowance refills.
      schema: { type: integer, minimum: 1 }
      example: 57
    RetryAfter:
      description: |
        Whole seconds to wait before retrying. Always at least 1 — a `Retry-After: 0` would invite
        the immediate retry that caused the refusal. On `429` it is measured from the counter's own
        remaining window, so waiting exactly this long is sufficient.
      schema: { type: integer, minimum: 1 }
      example: 42

  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      description: Ticker symbol as it appears in the supported catalog. Case-insensitive.
      schema: { type: string, minLength: 1, maxLength: 32 }
      example: AAPL
    From:
      name: from
      in: query
      description: |
        Inclusive start, `YYYY-MM-DD`. Clamped to the product history horizon (30 years) and to the
        security's own listing date. Optional; omitting it uses the surface's default window.
      schema: { type: string, format: date }
      example: "2023-01-01"
    To:
      name: to
      in: query
      description: Inclusive end, `YYYY-MM-DD`. Must not precede `from`.
      schema: { type: string, format: date }
      example: "2024-12-31"
    FromRequired:
      name: from
      in: query
      required: true
      description: Inclusive start, `YYYY-MM-DD`. Clamped to the product history horizon.
      schema: { type: string, format: date }
    ToRequired:
      name: to
      in: query
      required: true
      description: Inclusive end, `YYYY-MM-DD`. Must not precede `from`.
      schema: { type: string, format: date }
    AsOf:
      name: asOf
      in: query
      description: |
        Point-in-time cutoff, `YYYY-MM-DD`. Values are computed only from data available on or
        before this date, which is what makes a historical valuation free of look-ahead.
      schema: { type: string, format: date }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      description: A stock-list membership id — not a security id.
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActorId:
      name: actorId
      in: path
      required: true
      description: A canonical actor id — not an external identifier such as a CIK.
      schema: { type: string, format: uuid }
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MonitorId:
      name: monitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      description: A shared backtest's link token — 32 random bytes in unpadded base64url.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    TradeLogSymbol:
      name: symbol
      in: query
      required: false
      description: |
        Only the trades of this symbol, exactly as the log prints it — one of the page response's
        `symbols`. A symbol the run never traded matches nothing; a blank, repeated or over-long
        value is ignored.
      schema: { type: string, maxLength: 32 }
    TradeLogAction:
      name: action
      in: query
      required: false
      description: |
        Only the trades of this action. `SELL` includes the end-of-backtest liquidations, which are
        sales (`source: END_OF_BACKTEST`); `FINAL_EXIT` is only the strategy's own FINAL EXIT. Case
        is ignored, and an unrecognised value is ignored rather than refused.
      schema: { type: string, enum: [BUY, SELL, FINAL_EXIT] }
    TradeLogOrder:
      name: order
      in: query
      required: false
      description: |
        By the engine's execution sequence: `desc` is newest first, `asc` oldest first. Either is
        chronological and stable across trades on one date. An unrecognised value means `desc`.
      schema: { type: string, enum: [desc, asc], default: desc }

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No session, or a session that is expired, revoked, forged or otherwise unusable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoleForbidden:
      description: |
        Authenticated, but the caller does not hold the required role — or has not accepted the
        currently required Terms version (`LEGAL_ACCEPTANCE_REQUIRED`). The acceptance gate runs
        for every authenticated request to a route outside the allowlist in `info.description`,
        so it can produce this status on any operation that documents it.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Error" }
              - { $ref: "#/components/schemas/LegalError" }
    LegalAcceptanceRequired:
      description: |
        The caller is signed in but their account has not recorded acceptance of the currently
        required Terms version (`LEGAL_ACCEPTANCE_REQUIRED`). `requiredTermsVersion` names the
        version to submit to `POST /legal/acceptance`.

        Deliberately `403` and not `401`: the session is valid, so a client that signed the user
        out here would trap them in a loop. Never produced for a Guest, and never on the
        allowlisted operations listed in `info.description`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegalError" }
    EntitlementDenied:
      description: |
        The caller's plan does not allow this. The body carries a stable `ENTITLEMENT_*` code plus
        the numbers behind it, so a client can say "your plan allows 10, this change would make 11"
        without parsing the message.

        This is a **product limit**, not a rate limit: retrying identically will fail identically,
        and the remedy is a different plan or a smaller request — never waiting.

        The same status also carries `LEGAL_ACCEPTANCE_REQUIRED` when the account has not accepted
        the currently required Terms version; that refusal is raised before the handler runs, so
        the two are never combined in one body.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/EntitlementError" }
              - { $ref: "#/components/schemas/LegalError" }
    SystemContentReadOnly:
      description: |
        The resource is built-in content and the caller is not an administrator
        (`SYSTEM_CONTENT_READ_ONLY`). Built-ins are readable by everyone and changeable by
        administrators only.

        The same status also carries `LEGAL_ACCEPTANCE_REQUIRED` when the account has not accepted
        the currently required Terms version.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/SystemContentError" }
              - { $ref: "#/components/schemas/LegalError" }
    EntitlementOrContentForbidden:
      description: |
        Either the caller's plan does not allow this (an `ENTITLEMENT_*` code), the resource is
        built-in content the caller may not change (`SYSTEM_CONTENT_READ_ONLY`), or the account
        has not accepted the currently required Terms version (`LEGAL_ACCEPTANCE_REQUIRED`).
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/EntitlementError" }
              - { $ref: "#/components/schemas/SystemContentError" }
              - { $ref: "#/components/schemas/LegalError" }
    OwnedResourceNotFound:
      description: |
        No such resource for this caller. A resource that exists but belongs to somebody else
        answers exactly like one that does not exist, so this response reveals nothing about another
        user's data.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SharedBacktestNotFound:
      description: |
        No shared report behind this token. A malformed, unknown or revoked token, and a run
        without a result, are indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SymbolNotFound:
      description: The symbol is not in the supported securities catalog.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StrategyInvalid:
      description: |
        The strategy definition was rejected. Carries `code: STRATEGY_INVALID` and path-addressed
        `issues`, each naming the level, condition and field that produced it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StrategyValidationError" }
    StockDataUnavailable:
      description: |
        Stock data is temporarily unavailable — the cache, the store or the market-data provider
        could not answer. Retryable, and not the caller's fault.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BillingUnavailable:
      description: |
        The payment provider or this deployment's billing configuration is the problem, not the
        caller. Deliberately not a `500`: the request was fine and a retry after an operator fixes
        configuration will work.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    TooManyRequests:
      description: |
        The caller exceeded this endpoint's rate-limit policy. `Retry-After` is the measured time
        until the allowance refills; waiting exactly that long is sufficient, and retrying sooner is
        refused again without consuming anything further.

        A client should surface this as throttling with the wait, never as a generic failure — and
        on `POST /auth/login` in particular it must not be shown as "wrong credentials", because the
        attempt is refused whether or not the password was correct.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RateLimitError" }
          examples:
            search:
              value:
                statusCode: 429
                message: "Too many requests. Retry in 42 seconds."
                code: RATE_LIMITED
                policy: stock-search
                retryAfterSeconds: 42
    ThrottlingUnavailable:
      description: |
        The rate-limit store could not be reached and this endpoint's policy is fail-closed, so the
        request was refused rather than served unmetered. Documented only on the security- and
        payment-sensitive endpoints, because every other policy fails open.

        The caller's allowance is untouched. A client must not present this as "you are going too
        fast"; it carries its own code for exactly that reason.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RateLimitError" }
          examples:
            unavailable:
              value:
                statusCode: 503
                message: "Request throttling is temporarily unavailable. Please retry shortly."
                code: RATE_LIMIT_UNAVAILABLE
                policy: auth-sensitive
                retryAfterSeconds: 5

  schemas:
    # -------------------------------------------------------------------------------------------
    # Errors — one shape, one place to branch
    # -------------------------------------------------------------------------------------------
    Error:
      type: object
      description: |
        The API's error shape. `code` is present on every refusal a client can reasonably branch on
        and absent on generic framework errors; branch on it, never on `message`.
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, description: Repeats the HTTP status. }
        message:
          {
            type: string,
            description: Human-readable. Never parsed by a client.,
          }
        code:
          {
            type: string,
            description: Stable machine-readable reason,
            when there is one.,
          }
      examples:
        - { statusCode: 404, message: "Stock symbol was not found" }

    LegalError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - LEGAL_ACCEPTANCE_REQUIRED
                - LEGAL_TERMS_VERSION_MISMATCH
                - LEGAL_REQUEST_INVALID
            requiredTermsVersion:
              type: string
              description: |
                The Terms version the server currently requires. Present on the two refusals that
                are about a version, so a client can submit the right one without guessing.
              examples: ["0.1.0-draft"]

    LegalDocumentKind:
      type: string
      enum:
        - TERMS
        - PRIVACY
        - COOKIES
        - RISK_DISCLOSURE
        - CANCELLATION_AND_REFUNDS
        - CONTACT

    LegalAcceptanceRequest:
      type: object
      required: [termsVersion]
      description: |
        Deliberately a version rather than a boolean: a boolean records that a checkbox was
        ticked, while a version — together with the digest the server stores — records what was
        agreed to.
      properties:
        termsVersion:
          type: string
          maxLength: 64
          description: Must equal the version the server currently requires.
      examples:
        - { termsVersion: "0.1.0-draft" }

    LegalAcceptanceRecord:
      type: object
      required:
        [
          documentKind,
          documentVersion,
          documentHash,
          record,
          surface,
          recordedAt,
        ]
      properties:
        documentKind: { $ref: "#/components/schemas/LegalDocumentKind" }
        documentVersion: { type: string }
        documentHash:
          type: string
          description: |
            SHA-256, lowercase hex, of the canonical text of exactly that document version. What
            makes the record resolve to the text that was accepted after the copy moves on.
        record:
          type: string
          description: |
            `ACCEPTED` is contractual acceptance. `NOTICE_PRESENTED` records only that a document
            was shown — a privacy notice is information, not a consent.
          enum: [ACCEPTED, NOTICE_PRESENTED]
        surface:
          type: string
          description: |
            Where the acceptance was given. Resolved server-side from persisted state and never
            submitted by a client: evidence a caller can choose is not evidence.
          enum: [EMAIL_ACTIVATION, GOOGLE_ONBOARDING, EXISTING_ACCOUNT]
        recordedAt: { type: string, format: date-time }

    LegalAcceptanceStatus:
      type: object
      required: [requiredTermsVersion, outstanding, records]
      properties:
        requiredTermsVersion: { type: string }
        outstanding:
          type: boolean
          description: |
            True while the account has no `ACCEPTED` record for the required Terms version. The
            one field the acceptance gate acts on; the server decides it.
        records:
          type: array
          items: { $ref: "#/components/schemas/LegalAcceptanceRecord" }

    LegalRequestKind:
      type: string
      description: |
        Kept apart because the rules differ: statutory withdrawal is a consumer right with its own
        period, a nonconformity claim survives that period, and a data-protection request is a
        different law entirely. Cancelling a renewal is none of these — it is a billing action and
        lives in the hosted customer portal.
      enum: [PRIVACY_REQUEST, WITHDRAWAL, NONCONFORMITY, SUPPORT]

    LegalRequestSubmission:
      type: object
      required: [kind, details]
      properties:
        kind: { $ref: "#/components/schemas/LegalRequestKind" }
        details:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the person is asking for, in their own words.

    LegalRequestReceipt:
      type: object
      required: [reference, kind, status, details, submittedAt]
      description: |
        An acknowledgment of **receipt**, and deliberately nothing more: not a decision, not a
        refund, not a deletion.
      properties:
        reference:
          type: string
          description: Short, human-quotable identifier to use when following up.
          examples: ["WI-7K3QP-2XBHM"]
        kind: { $ref: "#/components/schemas/LegalRequestKind" }
        status:
          type: string
          description: |
            `RECEIVED` is the only value this implementation writes. A status implying an outcome
            would be a statement about a legal decision nobody has made.
          enum: [RECEIVED]
        details: { type: string }
        submittedAt:
          type: string
          format: date-time
          description: Server clock — the submission time the receipt attests to.

    RateLimitError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [code, policy, retryAfterSeconds]
          properties:
            code:
              type: string
              enum: [RATE_LIMITED, RATE_LIMIT_UNAVAILABLE]
              description: |
                `RATE_LIMITED` — the caller exceeded an allowance (`429`).
                `RATE_LIMIT_UNAVAILABLE` — the limiter could not answer and this endpoint's policy
                is fail-closed (`503`). The caller's allowance is untouched.
            policy:
              type: string
              description: |
                Which class of endpoint refused, so a client can tell "your typing is too fast" from
                "you have submitted too many backtests" without matching on the path. Stable
                identifier; the numbers behind it are operational configuration.
              enum:
                - auth-sensitive
                - session-probe
                - stock-search
                - stock-read
                - standard-read
                - public-share-read
                - data-export
                - progress-poll
                - mutation
                - monitor-mutation
                - backtest-execution
                - billing-mutation
                - billing-refresh
                - admin-operation
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Mirrors `Retry-After`. Whole seconds, rounded up, never zero.

    EntitlementError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [code, tier]
          properties:
            code:
              type: string
              enum:
                - ENTITLEMENT_AUTH_REQUIRED
                - ENTITLEMENT_FEATURE_UNAVAILABLE
                - ENTITLEMENT_LIST_SYMBOL_LIMIT
                - ENTITLEMENT_BACKTEST_SYMBOL_LIMIT
                - ENTITLEMENT_BACKTEST_HISTORY_LIMIT
                - ENTITLEMENT_BACKTEST_CONCURRENCY_LIMIT
                - ENTITLEMENT_MONITOR_LIMIT
                - ENTITLEMENT_RESOURCE_OVER_LIMIT
                - ENTITLEMENT_PREMIUM_CONTENT
            tier: { $ref: "#/components/schemas/EntitlementTier" }
            limit:
              { type: integer, description: What the caller's plan allows. }
            current: { type: integer, description: What they already have. }
            requested:
              { type: integer, description: What the request would make it. }

    BillingError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: |
                Stable billing reason. Carries nothing about the payment provider — no provider
                error object, request id, customer or subscription identifier — because the original
                failure is logged server-side before translation.
              enum:
                - BILLING_AUTH_REQUIRED
                - BILLING_INVALID_PRICE_KEY
                - BILLING_PAYMENT_REQUIRED
                - BILLING_ALREADY_SUBSCRIBED
                - BILLING_NO_SUBSCRIPTION
                - BILLING_CHANGE_NOT_ALLOWED
                - BILLING_CUSTOMER_CONFLICT
                - BILLING_SUBSCRIPTION_CONFLICT
                - BILLING_WEBHOOK_INVALID_SIGNATURE
                - BILLING_WEBHOOK_UNSUPPORTED_STATE
                - BILLING_NOT_CONFIGURED
                - BILLING_CATALOG_MISCONFIGURED
                - BILLING_STRIPE_UNAVAILABLE
                - BILLING_PORTAL_UNAVAILABLE
                - BILLING_CHECKOUT_FAILED
                - BILLING_SUBSCRIPTION_UPDATE_FAILED
            priceKey: { $ref: "#/components/schemas/BillingPriceKey" }
            plan: { $ref: "#/components/schemas/UserPlan" }

    StrategyValidationError:
      type: object
      required: [message, code, issues]
      properties:
        message: { type: string }
        code: { type: string, const: STRATEGY_INVALID }
        issues:
          type: array
          items: { $ref: "#/components/schemas/StrategyValidationIssue" }

    StrategyValidationIssue:
      type: object
      required: [code, path, message]
      properties:
        code:
          type: string
          enum:
            [
              SHAPE_INVALID,
              UNKNOWN_FIELD,
              NAME_REQUIRED,
              NAME_TOO_LONG,
              DESCRIPTION_TOO_LONG,
              BUY_LEVEL_REQUIRED,
              TOO_MANY_LEVELS,
              TOO_MANY_CONDITIONS,
              SIGNAL_EMPTY,
              EXIT_RULE_REQUIRED,
              TOO_MANY_EXIT_RULES,
              DUPLICATE_EXIT_RULE,
              PERCENTAGE_INVALID,
              METRIC_NOT_ALLOWED_IN_LEVEL,
              METRIC_SERIES_UNSUPPORTED,
              METRIC_PERIOD_UNSUPPORTED,
              FUNDAMENTAL_METRIC_UNSUPPORTED,
              VALUATION_RATIO_UNSUPPORTED,
              METRIC_NOT_ALLOWED_IN_PART,
              OPERATOR_NOT_SUPPORTED,
              VALUE_KIND_MISMATCH,
              VALUE_OUT_OF_DOMAIN,
              SERIES_UNKNOWN,
              SERIES_NOT_COMPARABLE,
              DUPLICATE_CONDITION,
              DUPLICATE_ID,
              MEASURE_UNSUPPORTED,
              LOOKBACK_UNSUPPORTED,
              SCOPE_INVALID,
              FILTER_INVALID,
              SOURCE_INVALID,
              SOURCE_NOT_ALLOWED_IN_PART,
            ]
        message: { type: string }
        path:
          type: object
          description: Addresses the exact element that failed, so a builder can attach the issue to it.
          required: [part]
          properties:
            levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
            levelIndex: { type: integer, minimum: 0 }
            ruleIndex:
              type: integer
              minimum: 0
              description: |
                Which FINAL EXIT exit rule, 0-based. Present only under `FINAL_EXIT`, and absent on
                an issue that belongs to FINAL EXIT as a whole — an empty or over-long rule list.
            part:
              type: string
              description: "`EXIT_RULE` is one FINAL EXIT exit rule as a whole."
              enum:
                [
                  STRATEGY,
                  NAME,
                  DESCRIPTION,
                  LEVEL,
                  EXIT_RULE,
                  PERCENTAGE,
                  CONDITION,
                  TRIGGER,
                ]
            conditionIndex: { type: integer, minimum: 0 }
            field: { type: string, enum: [METRIC, OPERATOR, VALUE] }

    # -------------------------------------------------------------------------------------------
    # Identity and access
    # -------------------------------------------------------------------------------------------
    UserPlan:
      type: string
      enum: [FREE, STARTER, PRO, PRO_PLUS]
      description: |
        The persisted commercial plan, cheapest first; `PRO_PLUS` is the product's "Pro+".
        Server-resolved and read-only to a client.
    UserRole:
      type: string
      enum: [USER, ADMIN]
      description: |
        Orthogonal to the plan: an administrator may be on any plan, and no plan grants the role.
    EntitlementTier:
      type: string
      enum: [GUEST, FREE, STARTER, PRO, PRO_PLUS, ADMIN]
      description: Which entitlement set was applied. Diagnostics and UI only.

    AuthUser:
      type: object
      required: [id, email, role, plan]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        plan: { $ref: "#/components/schemas/UserPlan" }

    AuthProvidersResponse:
      type: object
      required: [google]
      properties:
        google:
          {
            type: boolean,
            description: Whether Google sign-in is configured here.,
          }

    RegisterRequest:
      type: object
      required: [email]
      description: |
        Email-first registration (AUTH-003). No password: the first password is chosen by the
        holder of the emailed activation link.
      properties:
        email: { type: string, format: email }
    RegisterResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: accepted }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Only bounded here, not policy-checked: a password set before a policy change must still
            authenticate.
    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    AcceptedStatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: accepted }
    VerifyEmailRequest:
      type: object
      required: [token, password, termsVersion]
      properties:
        token: { type: string, minLength: 1, maxLength: 512 }
        password: { type: string, minLength: 12, maxLength: 1024 }
        termsVersion:
          type: string
          maxLength: 64
          description: |
            The Terms version the holder of the link accepted on the activation form. Required,
            and deliberately a version rather than a boolean.

            Activation is the moment the verified mailbox holder becomes the account holder, so
            it is the only point on the email path at which acceptance can be bound to a person
            rather than to whoever typed an address into a registration form. A missing, unknown
            or superseded version is `400` and redeems nothing — the link stays usable and the
            account stays pending. A client built before this field existed therefore cannot
            activate an account without recording an acceptance.
    VerifyEmailResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: verified }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 512 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    ResetPasswordResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: password_reset }

    EntitlementLimit:
      description: A numeric cap, or `null` meaning unlimited.
      oneOf:
        - { type: integer, minimum: 0 }
        - { type: "null" }

    EntitlementsResponse:
      type: object
      required: [principal, entitlements]
      properties:
        principal: { type: string, enum: [GUEST, AUTHENTICATED] }
        plan: { $ref: "#/components/schemas/UserPlan" }
        role: { $ref: "#/components/schemas/UserRole" }
        entitlements: { $ref: "#/components/schemas/Entitlements" }

    Entitlements:
      type: object
      description: |
        Product capacity and feature availability. Deliberately carries **no** request-rate concept:
        rate limiting and entitlements are separate mechanisms, and a plan never buys request rate.
      required:
        [
          tier,
          authenticated,
          stocks,
          builtInContent,
          lists,
          strategies,
          backtests,
          monitors,
          admin,
        ]
      properties:
        tier: { $ref: "#/components/schemas/EntitlementTier" }
        authenticated: { type: boolean }
        stocks:
          type: object
          required: [canSearch, canViewDetails, maxHistoricalYears]
          properties:
            canSearch: { type: boolean }
            canViewDetails: { type: boolean }
            maxHistoricalYears:
              { $ref: "#/components/schemas/EntitlementLimit" }
        builtInContent:
          type: object
          required: [canViewLists, canViewStrategies, canUsePremium]
          properties:
            canViewLists: { type: boolean }
            canViewStrategies: { type: boolean }
            canUsePremium:
              type: boolean
              description: |
                Whether premium built-ins — premium predefined Lists and Strategies and the
                point-in-time index universes — may be read in full, backtested and duplicated.
        lists:
          type: object
          required: [canCreateCustom, maxSaved, maxSymbols]
          properties:
            canCreateCustom: { type: boolean }
            maxSaved: { $ref: "#/components/schemas/EntitlementLimit" }
            maxSymbols: { $ref: "#/components/schemas/EntitlementLimit" }
        strategies:
          type: object
          required: [canCreateCustom, maxSaved, analyticalPrimitives]
          properties:
            canCreateCustom: { type: boolean }
            maxSaved: { $ref: "#/components/schemas/EntitlementLimit" }
            analyticalPrimitives: { type: string, enum: [BUILT_IN_ONLY, ALL] }
        backtests:
          type: object
          required:
            [
              canRunLive,
              canViewDemo,
              maxSymbols,
              maxIndexUniverseConstituents,
              maxHistoricalYears,
              maxConcurrentRuns,
            ]
          properties:
            canRunLive: { type: boolean }
            canViewDemo: { type: boolean }
            maxSymbols: { $ref: "#/components/schemas/EntitlementLimit" }
            maxIndexUniverseConstituents:
              allOf:
                - { $ref: "#/components/schemas/EntitlementLimit" }
              description: >-
                The most simultaneous members a backtest over the built-in point-in-time index
                universe may hold, measured over the run's own period. 0 means the plan does not
                include it.
            maxHistoricalYears:
              { $ref: "#/components/schemas/EntitlementLimit" }
            maxConcurrentRuns: { $ref: "#/components/schemas/EntitlementLimit" }
        monitors:
          type: object
          required: [maxActive]
          properties:
            maxActive: { $ref: "#/components/schemas/EntitlementLimit" }
        admin:
          type: object
          required: [canAccessAdminSurfaces]
          properties:
            canAccessAdminSurfaces: { type: boolean }

    # -------------------------------------------------------------------------------------------
    # Securities and market data
    # -------------------------------------------------------------------------------------------
    Security:
      type: object
      required:
        [
          id,
          symbol,
          name,
          exchangeCode,
          currency,
          type,
          isAdr,
          isActivelyTrading,
        ]
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        exchangeCode: { type: string }
        exchangeName: { type: string }
        currency: { type: string, description: "ISO 4217." }
        cik: { type: string }
        isin: { type: string }
        cusip: { type: string }
        country: { type: string }
        sector: { type: string }
        industry: { type: string }
        ipoDate: { type: string, format: date }
        type: { type: string, enum: [STOCK, ETF, FUND] }
        isAdr: { type: boolean }
        isActivelyTrading: { type: boolean }

    StockSearchResult:
      type: object
      description: |
        The one row shape the global search dropdown renders, shared by search and by recents.
      required: [id, symbol, name, exchangeCode]
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        exchangeCode: { type: string }
        exchangeName: { type: string }
        logoUrl:
          type: string
          format: uri
          description: |
            Present only when this security has been profiled. Its absence never means "this
            security has no logo" — bulk catalog synchronization writes identity only, and a profile
            appears when a stock is first opened.

    SecurityProfile:
      type: object
      properties:
        description: { type: string }
        website: { type: string, format: uri }
        logoUrl: { type: string, format: uri }
        ceo: { type: string }
        employees: { type: integer, minimum: 0 }

    StockHistoryBounds:
      type: object
      description: |
        The window this surface may explore for this security, reported by the canonical loader
        rather than inferred from the rows returned — an empty range is never evidence of where
        history begins.
      required: [start, end, startOrigin]
      properties:
        start: { type: string, format: date }
        end:
          type: string
          format: date
          description: |
            The newest date whose end-of-day bar is final — before the session's close plus the
            publication delay, the previous day. No row after it is ever returned.
        startOrigin:
          type: string
          enum: [HORIZON, LISTING, PROVIDER]
          description: |
            Why history starts there: the 30-year product horizon, the security's listing date, or
            the provider's first day proven by complete coverage.

    DailyPrice:
      type: object
      required: [date, open, high, low, close, volume]
      properties:
        date: { type: string, format: date }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        vwap: { type: number }

    TechnicalSeriesField:
      type: string
      description: A catalog moving-average or oscillator identifier.
      enum:
        [
          sma20d,
          sma50d,
          sma100d,
          sma200d,
          ema20d,
          ema50d,
          ema200d,
          sma20w,
          sma50w,
          sma100w,
          sma200w,
          ema20w,
          ema50w,
          ema200w,
          rsi7d,
          rsi14d,
          rsi21d,
        ]

    DailyTechnical:
      type: object
      description: |
        One trading day. Every series is optional: a value that does not exist for a day — warm-up,
        or unavailable under the point-in-time rules — is omitted rather than zeroed.

        `rvol10` / `rvol20` / `rvol50` are **Relative Volume**: the session's traded volume divided
        by the mean volume of the previous 10, 20 or 50 trading sessions. The session being
        measured is never part of its own baseline, and the full lookback is required, so a value
        is absent until it has accumulated and absent when the baseline is zero. They are unitless
        multiples — `2` means twice the baseline — and are not selectable-series catalog entries,
        so `series` cannot narrow to them.
      required: [date]
      properties:
        date: { type: string, format: date }
        sma20d: { type: number }
        sma50d: { type: number }
        sma100d: { type: number }
        sma200d: { type: number }
        ema20d: { type: number }
        ema50d: { type: number }
        ema200d: { type: number }
        sma20w: { type: number }
        sma50w: { type: number }
        sma100w: { type: number }
        sma200w: { type: number }
        ema20w: { type: number }
        ema50w: { type: number }
        ema200w: { type: number }
        rsi7d: { type: number, minimum: 0, maximum: 100 }
        rsi14d: { type: number, minimum: 0, maximum: 100 }
        rsi21d: { type: number, minimum: 0, maximum: 100 }
        rvol10: { type: number, minimum: 0 }
        rvol20: { type: number, minimum: 0 }
        rvol50: { type: number, minimum: 0 }

    FundamentalMetricId:
      type: string
      description: |
        The stable identity of one of the fifteen Fundamental Metrics. It is the metric's whole
        identity: never a label and never a storage field.

        Measured in percentage points (`15.42` is 15.42%): `REVENUE_GROWTH_TTM_YOY`,
        `EPS_GROWTH_TTM_YOY`, `FCF_GROWTH_TTM_YOY`, `GROSS_MARGIN_TTM`, `OPERATING_MARGIN_TTM`,
        `NET_MARGIN_TTM`, `FCF_MARGIN_TTM`, `ROIC_TTM`, `ROE_TTM`, `ROA_TTM`.

        Raw multiples (`0.75` is 0.75x): `DEBT_TO_EQUITY`, `CURRENT_RATIO`,
        `NET_DEBT_TO_EBITDA_TTM`, `INTEREST_COVERAGE_TTM`, `ASSET_TURNOVER_TTM`.
      enum:
        [
          REVENUE_GROWTH_TTM_YOY,
          EPS_GROWTH_TTM_YOY,
          FCF_GROWTH_TTM_YOY,
          GROSS_MARGIN_TTM,
          OPERATING_MARGIN_TTM,
          NET_MARGIN_TTM,
          FCF_MARGIN_TTM,
          ROIC_TTM,
          ROE_TTM,
          ROA_TTM,
          DEBT_TO_EQUITY,
          CURRENT_RATIO,
          NET_DEBT_TO_EBITDA_TTM,
          INTEREST_COVERAGE_TTM,
          ASSET_TURNOVER_TTM,
        ]

    ValuationRatioId:
      type: string
      description: |
        The stable identity of one of the five Valuation Ratios — P/E, P/S, P/B, P/FCF and
        EV/EBITDA. It is the ratio's whole identity: never a label. Every ratio is a raw multiple
        (`15` is 15x) of the market capitalisation, or for EV/EBITDA of the enterprise value.
      enum:
        [
          PRICE_TO_EARNINGS_TTM,
          PRICE_TO_SALES_TTM,
          PRICE_TO_BOOK,
          PRICE_TO_FCF_TTM,
          EV_TO_EBITDA_TTM,
        ]

    DailyFundamentalMetric:
      type: object
      description: |
        One trading session of one Fundamental Metric, as persisted in the point-in-time daily
        derived state.

        `value` is in the metric's own unit. A percentage metric is in **percentage points**:
        `15.42` is 15.42%, never 0.1542 and never 0.1542%. A multiple is a raw ratio: a Debt /
        Equity of `0.75` is 0.75x. Zero and negative values are real readings — a loss-making margin,
        net cash in Net Debt / EBITDA — and are returned as such.

        `value` is **omitted** on a session the metric is unavailable on: before its statements
        first support it, or after a later statement revision made it unavailable. It is never
        `null`, never zero and never an earlier value standing in for the unavailable interval.
      required: [date]
      properties:
        date: { type: string, format: date }
        value: { type: number }

    DailyValuationRatio:
      type: object
      description: |
        One trading session of one valuation ratio, computed when it is read.

        `value` is a **raw multiple**: `15.2` is 15.2x of the market capitalisation, or of the
        enterprise value for EV/EBITDA. A negative EV/EBITDA — net cash larger than the market
        capitalisation — is a real reading and is returned as such.

        `value` is **omitted** on a session the ratio is unavailable on: a missing, incomplete or
        non-positive input, a statement in another currency than the listing's, a share count the
        rules do not accept, or a price basis the provider's split list or a measured re-base
        leaves unsafe. It is never `null`, never zero and never an earlier value standing in for
        the unavailable interval.
      required: [date]
      properties:
        date: { type: string, format: date }
        value: { type: number }

    IntrinsicValueModel:
      type: string
      enum: [DCF_FCFF, RESIDUAL_INCOME, DDM, GRAHAM]
    IntrinsicValueBlendId:
      type: string
      enum: [BALANCED, CONSERVATIVE, DIVIDEND]

    IntrinsicValue:
      type: object
      required: [valuationDate, sourceDataAsOf, model, valuePerShare, currency]
      properties:
        valuationDate: { type: string, format: date }
        sourceDataAsOf:
          type: string
          format: date
          description: |
            The latest date of the fundamental data this value was computed from. Never later than
            `valuationDate` — that is the no-look-ahead guarantee, expressed in the payload.
        model: { $ref: "#/components/schemas/IntrinsicValueModel" }
        valuePerShare: { type: number }
        currency: { type: string }

    IntrinsicValueBlend:
      type: object
      required:
        [valuationDate, sourceDataAsOf, blendId, valuePerShare, currency]
      properties:
        valuationDate: { type: string, format: date }
        sourceDataAsOf: { type: string, format: date }
        blendId: { $ref: "#/components/schemas/IntrinsicValueBlendId" }
        valuePerShare: { type: number }
        currency: { type: string }

    StockDetails:
      type: object
      required:
        [
          security,
          history,
          prices,
          technicals,
          intrinsicValues,
          intrinsicValueBlends,
        ]
      properties:
        security: { $ref: "#/components/schemas/Security" }
        profile: { $ref: "#/components/schemas/SecurityProfile" }
        history: { $ref: "#/components/schemas/StockHistoryBounds" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/DailyPrice" }
        technicals:
          type: array
          items: { $ref: "#/components/schemas/DailyTechnical" }
        intrinsicValues:
          type: array
          items: { $ref: "#/components/schemas/IntrinsicValue" }
        intrinsicValueBlends:
          type: array
          items: { $ref: "#/components/schemas/IntrinsicValueBlend" }

    StockSummaryTechnicalId:
      type: string
      description: |
        The selectable-series identity of a technical the summary reports: EMA 50D, EMA 200D and
        RSI 14D. Every other moving average and oscillator stays available to the chart.
      enum: [EMA_50D, EMA_200D, RSI_14D]

    StockSummaryReading:
      type: object
      description: |
        One series' newest reading in the summary window. `date` is the newest session of the
        window on which the series has a value and `value` is that session's value, in the series'
        own unit: a valuation ratio is a raw multiple, a Fundamental Metric is in its catalog unit
        (percentage points or a raw multiple), an EMA is a price and RSI is unitless. When the
        newest session has no value, the reading is the newest earlier session that does, with its
        own `date`. Both are **omitted** when no session of the window has a value — never zero and
        never `null`.
      required: [id]
      properties:
        id:
          type: string
          description: A `ValuationRatioId`, `FundamentalMetricId` or `StockSummaryTechnicalId`.
        date: { type: string, format: date }
        value: { type: number }

    StockSummaryQuote:
      type: object
      description: |
        The newest finalized end-of-day bar of the summary window; never a live quote.
        `previousDate`/`previousClose` are the session before it, when the window holds one.
        `rangeHigh`/`rangeLow` are the highest high and lowest low over the window.
      required: [date, open, high, low, close, volume, rangeHigh, rangeLow]
      properties:
        date: { type: string, format: date }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        previousDate: { type: string, format: date }
        previousClose: { type: number }
        rangeHigh: { type: number }
        rangeLow: { type: number }

    StockSummaryQuarter:
      type: object
      description: |
        The newest quarterly reporting period whose statements were public by the quote's session.
        `fiscalDate` is the period end; `availableFrom` is the first session any of the period's
        statements could be read on.
      required: [fiscalYear, period, fiscalDate, availableFrom]
      properties:
        fiscalYear: { type: integer }
        period: { type: string, enum: [Q1, Q2, Q3, Q4] }
        fiscalDate: { type: string, format: date }
        availableFrom: { type: string, format: date }

    StockSummaryValuationRatios:
      type: object
      description: |
        `AVAILABLE` carries all five ratios in catalog order. `FAILED` means the inputs the
        calculation requires — the provider's split list — could not be prepared for this request,
        so no ratio was computed: a failure to retry, never a statement that the ratios are
        unavailable for the company.
      required: [status]
      properties:
        status: { type: string, enum: [AVAILABLE, FAILED] }
        readings:
          type: array
          items: { $ref: "#/components/schemas/StockSummaryReading" }

    StockSummary:
      type: object
      required:
        [
          security,
          window,
          intrinsicValues,
          intrinsicValueBlends,
          valuationRatios,
          fundamentals,
          technicals,
        ]
      properties:
        security: { $ref: "#/components/schemas/Security" }
        profile: { $ref: "#/components/schemas/SecurityProfile" }
        window:
          type: object
          description: The trailing window the readings were selected from.
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        quote: { $ref: "#/components/schemas/StockSummaryQuote" }
        intrinsicValues:
          type: array
          description: The newest point of each model in the window, with its own valuation date.
          items: { $ref: "#/components/schemas/IntrinsicValue" }
        intrinsicValueBlends:
          type: array
          description: The newest point of each blend in the window, with its own valuation date.
          items: { $ref: "#/components/schemas/IntrinsicValueBlend" }
        valuationRatios: { $ref: "#/components/schemas/StockSummaryValuationRatios" }
        fundamentals:
          type: array
          description: All fifteen Fundamental Metrics, in catalog order.
          items: { $ref: "#/components/schemas/StockSummaryReading" }
        technicals:
          type: array
          description: EMA 50D, EMA 200D and RSI 14D, in that order.
          items: { $ref: "#/components/schemas/StockSummaryReading" }
        latestQuarter: { $ref: "#/components/schemas/StockSummaryQuarter" }

    RecordSecurityViewRequest:
      type: object
      required: [securityId]
      properties:
        securityId: { type: string, format: uuid }

    SecurityCatalogSyncResponse:
      type: object
      required:
        [
          received,
          created,
          updated,
          unchanged,
          deactivated,
          skipped,
          failed,
          durationMs,
        ]
      properties:
        received: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        deactivated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }

    # -------------------------------------------------------------------------------------------
    # Stock lists
    # -------------------------------------------------------------------------------------------
    BuyWindowMode:
      type: string
      enum: [FULL, CUSTOM]
      description: |
        `FULL` — eligible for the whole period, and no ranges are persisted.
        `CUSTOM` — eligible only inside the listed ranges.
    BuyWindowRange:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate:
          description: "`null` means open-ended. At most one range may be open-ended."
          oneOf:
            - { type: string, format: date }
            - { type: "null" }

    StockListCompliance:
      type: object
      description: |
        The list measured against the caller's current plan. A list that grew under a higher plan
        stays readable and correctable and is reported here as non-compliant — a downgrade is never
        destructive.
      required: [symbolCount, symbolLimit, compliant]
      properties:
        symbolCount: { type: integer, minimum: 0 }
        symbolLimit: { $ref: "#/components/schemas/EntitlementLimit" }
        compliant: { type: boolean }

    ContentOwnership:
      type: string
      enum: [USER, SYSTEM]
      description: |
        `USER` content belongs to one customer. `SYSTEM` content is built in: changeable by
        administrators only, and readable by everyone, Guests included — except that a **premium**
        built-in's membership or rules are read only on a plan that includes premium content.
    ContentPremium:
      type: boolean
      const: true
      description: Present only on a premium built-in List or Strategy.
    ContentLocked:
      type: boolean
      const: true
      description: |
        Present when the object is premium and the caller's plan does not include premium content:
        its detail answers `403 ENTITLEMENT_PREMIUM_CONTENT`, and it cannot be backtested or
        duplicated. Presentation only.

    SystemContentError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SYSTEM_CONTENT_READ_ONLY, SYSTEM_CONTENT_PROTECTED]

    CongressChamber:
      type: string
      enum: [HOUSE, SENATE]

    AlternativeDataActor:
      type: object
      required: [id, externalId, displayName, chamber]
      description: |
        A member of Congress. Insider persons are deliberately absent from the catalog: V1 has no
        insider groups, and insider metrics count distinct reporting owners straight off the
        disclosures.
      properties:
        id: { type: string, format: uuid }
        externalId:
          type: string
          description: |
            The provider identifier this actor **is**: the member's bioguide id. Identity, not a label
            — two members may share a display name, and a rename never moves a group's membership.
        displayName: { type: string }
        chamber: { $ref: "#/components/schemas/CongressChamber" }
        state:
          {
            type: string,
            maxLength: 8,
            description: Where the provider reports one.,
          }
        district:
          type: string
          maxLength: 16
          description: "`TX17` for a House member; Senate rows carry none."

    ActorCatalogStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [SYNCHRONIZED, NOT_SYNCHRONIZED, SYNCHRONIZATION_FAILED]
          description: |
            `SYNCHRONIZED` — a synchronization has read the provider's whole member directory and
            written it. `NOT_SYNCHRONIZED` — none has run, so the catalog holds only members a loaded
            disclosure named. `SYNCHRONIZATION_FAILED` — one was attempted and none has ever
            completed; the catalog is as incomplete as when none has run.
        synchronizedAt:
          type: string
          format: date-time
          description: When the directory was last read whole and written. Present exactly when `SYNCHRONIZED`.

    CongressMemberCatalogSyncResponse:
      type: object
      description: |
        Every identity the directory held is counted once: `received` is
        `created + updated + unchanged + declined`.
      required:
        [
          runSequence,
          providerRequests,
          received,
          inOffice,
          former,
          created,
          updated,
          relabelled,
          unchanged,
          declined,
          declinedByReason,
          repeatedRows,
          retained,
          durationMs,
        ]
      properties:
        runSequence: { type: integer, minimum: 1 }
        providerRequests:
          type: integer
          minimum: 0
          description: HTTP requests asked of the provider's directory.
        received:
          type: integer
          minimum: 0
          description: Distinct identities the directory held.
        inOffice: { type: integer, minimum: 0 }
        former: { type: integer, minimum: 0 }
        created:
          type: integer
          minimum: 0
          description: Members the catalog did not hold.
        updated:
          type: integer
          minimum: 0
          description: Members the catalog held whose directory spelling or label was written.
        relabelled:
          type: integer
          minimum: 0
          description: |
            Of `updated`, those whose displayed name, chamber or state changed. Only a member no
            loaded disclosure names can be among them; one a disclosure has named keeps the label
            their disclosures gave them.
        unchanged: { type: integer, minimum: 0 }
        declined:
          type: integer
          minimum: 0
          description: Directory rows that were not written; `declinedByReason` says why.
        declinedByReason:
          type: object
          description: |
            `MALFORMED_ID` — the identifier is not a bioguide id. `CONFLICTING_ROWS` — the directory
            listed the identifier more than once and the rows disagree. `UNNAMED` — no name.
            `NO_CHAMBER` — the latest position is not a seat in Congress and no disclosure has named
            them.
          additionalProperties: { type: integer, minimum: 0 }
        repeatedRows: { type: integer, minimum: 0 }
        retained:
          type: integer
          minimum: 0
          description: Catalog members the directory did not hold. Every one of them is kept.
        durationMs: { type: integer, minimum: 0 }

    ActorGroupSummary:
      type: object
      required:
        [id, name, memberCount, createdAt, updatedAt, ownership, canEdit]
      properties:
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        systemKey:
          { type: string, description: The immutable identity of a built-in. }
        canEdit:
          type: boolean
          description: Whether the caller may change it. Presentation only; the API authorizes every change.
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        memberCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ActorGroupDetail:
      allOf:
        - $ref: "#/components/schemas/ActorGroupSummary"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              description: Members in the order they were added.
              items: { $ref: "#/components/schemas/AlternativeDataActor" }

    CreateActorGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        actorIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }

    UpdateActorGroupRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description:
          type: [string, "null"]
          maxLength: 500
          description: "`null` clears the description."

    AddActorGroupMembersRequest:
      type: object
      required: [actorIds]
      additionalProperties: false
      properties:
        actorIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }

    StockListSummary:
      type: object
      required:
        [
          id,
          name,
          itemCount,
          createdAt,
          updatedAt,
          compliance,
          ownership,
          canEdit,
        ]
      properties:
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        systemKey:
          { type: string, description: The immutable identity of a built-in. }
        canEdit:
          type: boolean
          description: Whether the caller may change it. Presentation only; the API authorizes every change.
        premium: { $ref: "#/components/schemas/ContentPremium" }
        locked: { $ref: "#/components/schemas/ContentLocked" }
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        itemCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        compliance: { $ref: "#/components/schemas/StockListCompliance" }
        universe: { $ref: "#/components/schemas/StockListUniverse" }

    HistoricalUniverseCatalog:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [key, label, universes]
            properties:
              key: { type: string, example: MARKET_CAPITALIZATION }
              label: { type: string, example: Market Cap }
              universes:
                type: array
                items: { $ref: "#/components/schemas/HistoricalUniverseCatalogEntry" }

    HistoricalUniverseCatalogEntry:
      type: object
      required:
        [
          key,
          name,
          description,
          premium,
          locked,
          availability,
          listId,
          availableFrom,
          unavailableReason,
        ]
      properties:
        key: { type: string, example: sp500-top100-market-cap }
        name: { type: string, example: S&P 500 Top 100 by Market Cap }
        description: { type: string }
        premium: { type: boolean, enum: [true] }
        locked:
          type: boolean
          description: True when the caller's plan does not include premium content.
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        listId:
          description: The built-in List carrying the universe, once published.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        availableFrom:
          description: The first date its List holds members.
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        unavailableReason:
          oneOf:
            - { type: string }
            - { type: "null" }

    StockListUniverse:
      type: object
      description: >-
        Present only on a built-in maintained historical universe: an index's own point-in-time
        membership (`sp500-historical-pit`, `nasdaq100-historical-pit`, `dow30-historical-pit`) or
        a universe derived from one (`sp500-top100-market-cap`, `dogs-of-the-dow`, ...). Its
        membership is maintained by its generator and cannot be edited through the List routes
        (`canEdit` is false for every caller) or duplicated. A backtest over it is measured by the
        most members it held at once during the run's period, against
        `backtests.maxIndexUniverseConstituents`, not by its distinct stock count.
      required:
        [
          kind,
          indexKey,
          universeKey,
          category,
          derived,
          distinctSecurities,
          peakSimultaneousMembers,
          currentMembers,
          membershipFloor,
          syncedAt,
        ]
      properties:
        kind: { type: string, enum: [POINT_IN_TIME_INDEX] }
        indexKey:
          { type: string, example: SP500, description: The root index the universe is drawn from. }
        universeKey:
          { type: string, example: sp500-top100-market-cap, description: The List's systemKey. }
        category:
          type: string
          enum:
            [
              MARKET_INDICES,
              SP500_SECTORS,
              MARKET_CAPITALIZATION,
              INVESTMENT_STYLES,
              DOW_STRATEGIES,
              RESEARCH,
            ]
        derived:
          type: boolean
          description: False for an index's own membership; true for a ranking drawn from one.
        distinctSecurities:
          type: integer
          minimum: 0
          description: Every tradeable constituent since the floor, current and former.
        peakSimultaneousMembers:
          type: integer
          minimum: 0
          description: The most members eligible on any one date since the floor.
        currentMembers: { type: integer, minimum: 0 }
        membershipFloor: { type: string, format: date }
        syncedAt:
          description: When the canonical membership was last synchronized; null if never.
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    StockListItem:
      type: object
      required: [id, security, buyWindowMode, buyWindows]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: The membership id,
            not the security id.,
          }
        security: { $ref: "#/components/schemas/StockSearchResult" }
        buyWindowMode: { $ref: "#/components/schemas/BuyWindowMode" }
        buyWindows:
          type: array
          description: Canonical normalized form — sorted, non-overlapping, non-adjacent. Empty for `FULL`.
          items: { $ref: "#/components/schemas/BuyWindowRange" }

    StockListDetail:
      type: object
      required:
        [id, name, createdAt, updatedAt, items, compliance, ownership, canEdit]
      properties:
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        systemKey: { type: string }
        canEdit: { type: boolean }
        premium: { $ref: "#/components/schemas/ContentPremium" }
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/StockListItem" }
        compliance: { $ref: "#/components/schemas/StockListCompliance" }
        universe: { $ref: "#/components/schemas/StockListUniverse" }

    CreateStockListRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description:
          maxLength: 500
          oneOf:
            - { type: string }
            - { type: "null" }
        securityIds:
          type: array
          maxItems: 100
          description: Optional initial membership. Deduplicated; each must be a catalog security id.
          items: { type: string, format: uuid }

    UpdateStockListRequest:
      type: object
      minProperties: 1
      description: At least one property must be present.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description:
          description: "`null` clears the description."
          oneOf:
            - { type: string, maxLength: 500 }
            - { type: "null" }

    DuplicateStockListRequest:
      type: object
      required: [name]
      description: Only the copy's name; everything the copy holds is taken from the source.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    AddStockListItemsRequest:
      type: object
      required: [securityIds]
      properties:
        securityIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }

    ReplaceBuyWindowsRequest:
      type: object
      required: [mode, ranges]
      properties:
        mode: { $ref: "#/components/schemas/BuyWindowMode" }
        ranges:
          type: array
          maxItems: 100
          description: Must be empty for `FULL`. Normalized on write, so the response may be shorter.
          items: { $ref: "#/components/schemas/BuyWindowRange" }

    # -------------------------------------------------------------------------------------------
    # Strategies
    # -------------------------------------------------------------------------------------------
    StrategyLevelKind:
      type: string
      enum: [BUY, SELL, FINAL_EXIT]

    SelectableSeriesId:
      type: string
      description: |
        An identifier from the canonical selectable-series catalog — a moving average, an oscillator,
        an intrinsic-value model or a blend. One catalog serves Stock Details and strategy
        conditions alike, so there is no second list of options anywhere. An identifier outside the
        catalog is refused with `SERIES_UNKNOWN`; which catalog entries a metric accepts, as its
        parameter or as its Value, is decided by the metric.
      enum:
        [
          SMA_20D,
          SMA_50D,
          SMA_100D,
          SMA_200D,
          EMA_20D,
          EMA_50D,
          EMA_200D,
          SMA_20W,
          SMA_50W,
          SMA_100W,
          SMA_200W,
          EMA_20W,
          EMA_50W,
          EMA_200W,
          RSI_7D,
          RSI_14D,
          RSI_21D,
          BALANCED,
          CONSERVATIVE,
          DIVIDEND,
          DCF_FCFF,
          RESIDUAL_INCOME,
          DDM,
          GRAHAM,
        ]
      examples: [SMA_50D, RSI_14D, BALANCED]

    StrategyMetric:
      description: |
        The left-hand side of a condition or a trigger. A metric's identity is its kind plus the one
        field that selects it — a series, a valuation source, a Relative Volume period, a fundamental
        metric or an alternative-data measure. A lookback, an actor scope and filters are
        configuration: carried beside the identity, and never part of a metric's name.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, const: PRICE }
            source: { $ref: "#/components/schemas/StrategyMetricSource" }
        - type: object
          required: [kind, seriesId]
          properties:
            kind: { type: string, const: MOVING_AVERAGE }
            seriesId: { $ref: "#/components/schemas/SelectableSeriesId" }
            source: { $ref: "#/components/schemas/StrategyMetricSource" }
        - type: object
          required: [kind, seriesId]
          properties:
            kind: { type: string, const: OSCILLATOR }
            seriesId: { $ref: "#/components/schemas/SelectableSeriesId" }
            source: { $ref: "#/components/schemas/StrategyMetricSource" }
        - type: object
          required: [kind, period]
          description: |
            Relative Volume: the session's volume as a multiple of the mean volume of the previous
            `period` trading sessions. Compared with a `MULTIPLE`. Condition only — it has no
            trigger operators.
          properties:
            kind: { type: string, const: RELATIVE_VOLUME }
            period: { type: integer, enum: [10, 20, 50] }
            source: { $ref: "#/components/schemas/StrategyMetricSource" }
        - type: object
          required: [kind, sourceId]
          description: Margin of safety against one intrinsic-value series. Percent domain, at most 100.
          properties:
            kind: { type: string, const: MARGIN_OF_SAFETY }
            sourceId: { $ref: "#/components/schemas/SelectableSeriesId" }
        - type: object
          required: [kind, metricId]
          description: |
            One of the fifteen Fundamental Metrics, read from the point-in-time daily derived state:
            calculated only from the statements public on each trading day, and unavailable — never
            zero — where the statement history is incomplete. The identity is the whole metric; no
            label or storage field is stored. The growth, margin and return metrics are compared with
            a `PERCENT` in percentage points (`15` is 15%); Debt / Equity, Current Ratio, Net Debt /
            EBITDA, Interest Coverage and Asset Turnover with a raw `MULTIPLE`. Condition only — it has
            no trigger operators. An identity outside this list is refused with
            `FUNDAMENTAL_METRIC_UNSUPPORTED`.
          properties:
            kind: { type: string, const: FUNDAMENTAL }
            metricId: { $ref: "#/components/schemas/FundamentalMetricId" }
        - type: object
          required: [kind, ratioId]
          description: |
            One of the five Valuation Ratios, projected on each trading day from that day's close
            and the statements public by then. Unavailable — never zero — where an input is missing,
            a denominator is not positive, a statement reports another currency than the trading
            one, or the price and the share count cannot be put on one basis around a corporate
            action. Compared with a raw `MULTIPLE`, at least 0 except for EV/EBITDA. Condition only —
            it has no trigger operators. An identity outside this list is refused with
            `VALUATION_RATIO_UNSUPPORTED`.
          properties:
            kind: { type: string, const: VALUATION_RATIO }
            ratioId: { $ref: "#/components/schemas/ValuationRatioId" }
        - type: object
          description: |
            Position-dependent, so it is only meaningful where simulated position state exists;
            allowed in SELL and FINAL_EXIT levels, never in BUY.
          required: [kind]
          properties: { kind: { type: string, const: GAIN } }
        - type: object
          required: [kind]
          properties: { kind: { type: string, const: LOSS } }
        - type: object
          required: [kind, measure, lookback]
          description: |
            Insider activity from Form 4 disclosures over the last `lookback` trading sessions, each
            disclosure placed on the session it became observable, never on its transaction date.
            `BUYERS` and `SELLERS` count distinct insiders and are compared with a whole `NUMBER`;
            `PURCHASE_VALUE` and `SALE_VALUE` sum amounts and are compared with `MONEY`. Condition
            only.
          properties:
            kind: { type: string, const: INSIDER_ACTIVITY }
            measure:
              type: string
              enum: [BUYERS, SELLERS, PURCHASE_VALUE, SALE_VALUE]
            lookback: { $ref: "#/components/schemas/AlternativeDataLookback" }
            roles:
              type: array
              minItems: 1
              description: |
                Counts only insiders reporting one of these roles. Absent when every insider counts,
                never an empty list; duplicates are collapsed and the list is stored in canonical
                order. `OTHER` is accepted and kept, but the Builder never offers it as a filter.
              items:
                type: string
                enum:
                  [
                    CEO,
                    CFO,
                    COO,
                    PRESIDENT,
                    CHAIRMAN,
                    DIRECTOR,
                    OFFICER,
                    TEN_PERCENT_OWNER,
                    OTHER,
                  ]
        - type: object
          required: [kind, measure, lookback, scope, chamber]
          description: |
            Congressional trading from periodic transaction reports over the last `lookback`
            trading sessions, each disclosure placed on the session it became observable, never on
            its transaction date. `PURCHASES` and `SALES` count disclosures and `BUYERS` and
            `SELLERS` count distinct members, all compared with a whole `NUMBER`;
            `MINIMUM_PURCHASE_VALUE` sums each disclosed band's lower bound and is compared with
            `MONEY`. Condition only.
          properties:
            kind: { type: string, const: CONGRESS_ACTIVITY }
            measure:
              type: string
              enum: [PURCHASES, SALES, BUYERS, SELLERS, MINIMUM_PURCHASE_VALUE]
            lookback: { $ref: "#/components/schemas/AlternativeDataLookback" }
            scope: { $ref: "#/components/schemas/ActorScope" }
            chamber:
              type: string
              enum: [ANY, HOUSE, SENATE]
              description: "`ANY` counts both chambers."
            owners:
              type: array
              minItems: 1
              description: |
                Counts only disclosures whose owner is one of these. Absent when every owner counts,
                never an empty list; duplicates are collapsed and the list is stored in canonical
                order. `UNSPECIFIED` is accepted and kept, but the Builder never offers it.
              items:
                type: string
                enum:
                  [SELF, SPOUSE, JOINT, CHILD, DEPENDENT, OTHER, UNSPECIFIED]

    StrategyMetricSource:
      description: |
        The data source of one technical condition metric. Absent means the evaluated stock itself —
        exactly what every document saved before data sources existed says by carrying nothing.
        `ETF` names one of the twenty Dashboard ETFs by its stable benchmark code
        (`docs/decisions/strategy-etf-conditions-v1.md`): the condition is then evaluated against
        that ETF's own completed end-of-day history, identically for every candidate stock on the
        same eligible session. `SP500` is the SPY ETF. `STOCK_SECTOR` (Stock's Sector) names no
        fund: each evaluated stock reads the Select Sector SPDR ETF its current FMP sector maps to
        (Technology reads XLK, Financial Services XLF, …), and a stock whose sector is missing or not
        one of FMP's eleven is not evaluable. Only `PRICE`, `MOVING_AVERAGE`, `OSCILLATOR` and
        `RELATIVE_VOLUME` accept the field — on any other metric kind it is refused with
        `UNKNOWN_FIELD` — an unknown kind or code is refused with `SOURCE_INVALID`, a code beside
        `STOCK_SECTOR` with `UNKNOWN_FIELD`, and a trigger naming any source is refused with
        `SOURCE_NOT_ALLOWED_IN_PART`: sourced triggers are deliberately not part of V1.
      oneOf:
        - $ref: "#/components/schemas/StrategyEtfMetricSource"
        - $ref: "#/components/schemas/StrategyStockSectorMetricSource"
      discriminator:
        propertyName: kind
        mapping:
          ETF: "#/components/schemas/StrategyEtfMetricSource"
          STOCK_SECTOR: "#/components/schemas/StrategyStockSectorMetricSource"

    StrategyEtfMetricSource:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind: { type: string, const: ETF }
        code:
          type: string
          enum:
            [
              SP500,
              ETF_QQQ,
              ETF_DIA,
              ETF_IWM,
              ETF_RSP,
              ETF_XLK,
              ETF_XLF,
              ETF_XLE,
              ETF_XLV,
              ETF_XLI,
              ETF_XLY,
              ETF_XLP,
              ETF_XLU,
              ETF_XLB,
              ETF_XLRE,
              ETF_XLC,
              ETF_GLD,
              ETF_USO,
              ETF_TLT,
              ETF_HYG,
            ]

    StrategyStockSectorMetricSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, const: STOCK_SECTOR }

    StockSectorAssignment:
      type: object
      required: [symbol, sector, code, ticker]
      description: |
        Which sector ETF one stock's Stock's Sector rules read. `code` and `ticker` are null when the
        stock's FMP sector is missing (`sector` null) or not one of the eleven: those rules were not
        evaluable for that stock, never read from another fund.
      properties:
        symbol: { type: string }
        sector: { type: [string, "null"] }
        code: { type: [string, "null"] }
        ticker: { type: [string, "null"] }

    AlternativeDataLookback:
      type: integer
      enum: [5, 10, 20, 30, 60, 90, 120, 180, 250]
      description: |
        How many trading sessions an alternative-data metric looks back over. Configuration, not
        identity: `Insider sellers` is the same metric at 20 sessions or at 180.

    ActorScope:
      description: |
        Whose activity a congressional metric counts. A scope is a **membership filter over one
        metric**, never an OR between separately evaluated rules: the disclosures of every selected
        member are pooled and the measure aggregates the pool, so `Congress purchases is above 1`
        scoped to two members who each disclosed one purchase is true.

        - `ANY` — every member of Congress.
        - `ACTORS` — the members the rule selects, by this product's own canonical actor ids
          (`GET /alternative-data/actors`). Between 1 and 250; duplicates are collapsed and the list
          is stored sorted. An id the catalog does not hold is refused with `SCOPE_INVALID`.
        - `ACTOR` — **legacy**, read only: one member. It means exactly what a one-entry `ACTORS`
          means and is returned as that; a write naming it is stored as that.
        - `GROUP` — **legacy**, read only: a Congress group, by id. A strategy version or a backtest
          run saved before 2026-10-11 may still hold one and is still served and executed — a
          backtest from the membership frozen in its snapshot. A strategy **write** holding one is
          refused with `SCOPE_INVALID`, whether typed, carried over from the version being edited or
          copied by a duplicate.
      oneOf:
        - type: object
          required: [kind]
          properties: { kind: { type: string, const: ANY } }
        - type: object
          required: [kind, actorIds]
          properties:
            kind: { type: string, const: ACTORS }
            actorIds:
              type: array
              minItems: 1
              maxItems: 250
              description: |
                Canonical actor ids. Never empty: every member is `ANY`, and a rule that selects
                nobody is refused rather than read as a rule that never matches.
              items: { type: string, format: uuid }
        - type: object
          required: [kind, actorId]
          properties:
            kind: { type: string, const: ACTOR }
            actorId: { type: string, format: uuid }
        - type: object
          required: [kind, groupId]
          properties:
            kind: { type: string, const: GROUP }
            groupId: { type: string, format: uuid }

    StrategyValue:
      description: |
        The right-hand side. Its kind is decided by the metric: a series for Price and the moving
        averages, a `NUMBER` for an oscillator and for a disclosure count, a `PERCENT` for margin of
        safety, gain, loss and the percentage fundamental metrics, a `MULTIPLE` for Relative Volume
        and the ratio fundamental metrics, and `MONEY` for an alternative-data amount. Domains are
        metric-specific: margin of safety is at most 100, gain is at least -100, loss is 0..100, a
        fundamental growth rate is at least -100, a disclosure count is a whole number 0..1000, an
        amount is at least 0, a multiple is at least 0 except Net Debt / EBITDA and Interest Coverage,
        which are signed, and a series value must be comparable with its metric — same timeframe, and
        never the metric's own series.
      oneOf:
        - type: object
          required: [kind, seriesId]
          properties:
            kind: { type: string, const: SERIES }
            seriesId: { $ref: "#/components/schemas/SelectableSeriesId" }
        - type: object
          required: [kind, value]
          properties:
            kind: { type: string, const: NUMBER }
            value: { type: number }
        - type: object
          required: [kind, value]
          properties:
            kind: { type: string, const: PERCENT }
            value: { type: number }
        - type: object
          required: [kind, value]
          description: |
            A raw multiple — `2` means twice the baseline or denominator. Not negative for Relative
            Volume, Debt / Equity, Current Ratio and Asset Turnover; signed for Net Debt / EBITDA and
            Interest Coverage.
          properties:
            kind: { type: string, const: MULTIPLE }
            value: { type: number }
        - type: object
          required: [kind, value]
          description: An amount of money in the product's reporting currency.
          properties:
            kind: { type: string, const: MONEY }
            value: { type: number, minimum: 0 }

    StrategyCondition:
      type: object
      required: [id, metric, operator, value]
      properties:
        id: { type: string }
        metric: { $ref: "#/components/schemas/StrategyMetric" }
        operator:
          type: string
          enum: [IS_ABOVE, IS_BELOW, IS_CLOSE_TO]
          description: |
            `IS_ABOVE` is strictly greater than (`>`) and `IS_BELOW` strictly less than (`<`). There
            is no inclusive form: on a whole-number count, "at least two" is `IS_ABOVE` 1.
            `IS_CLOSE_TO` is a ±2% proximity state offered only for the price-scaled metrics. An
            operator the metric does not offer is refused with `OPERATOR_NOT_SUPPORTED`.
        value: { $ref: "#/components/schemas/StrategyValue" }

    StrategyTrigger:
      type: object
      description: |
        An event on one observation date rather than a state, which is what makes a trigger level
        fire at most once per date. Relative Volume, the fundamental metrics and the alternative-data
        metrics have no trigger form; a trigger on one is refused with `METRIC_NOT_ALLOWED_IN_PART`.
      required: [id, metric, operator, value]
      properties:
        id: { type: string }
        metric: { $ref: "#/components/schemas/StrategyMetric" }
        operator: { type: string, enum: [CROSSES_ABOVE, CROSSES_BELOW] }
        value: { $ref: "#/components/schemas/StrategyValue" }

    StrategySignal:
      type: object
      description: |
        Zero or more conditions, ANDed, plus at most one optional trigger which is ANDed with them
        for the same date. A signal with neither is empty and is rejected.
      required: [conditions]
      properties:
        conditions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/StrategyCondition" }
        trigger: { $ref: "#/components/schemas/StrategyTrigger" }

    StrategyDefinition:
      type: object
      description: |
        The complete strategy. At least one BUY level is required. A BUY or SELL level owns exactly
        one signal and one percentage — those levels have no OR; there is no stock list, no
        valuation source and no execution parameter here — capital, contributions, period and
        `maximumPositions` all belong to a backtest.
      required: [schemaVersion, buyLevels, sellLevels]
      properties:
        schemaVersion:
          type: integer
          enum: [2]
          description: |
            Definition schema version. This schema is the canonical version 2 document, and every
            response carries it. Requests may also submit the older version 1 shape — see
            `StrategyDefinitionInput`.
        buyLevels:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [id, signal, percentage]
            properties:
              id: { type: string }
              signal: { $ref: "#/components/schemas/StrategySignal" }
              percentage:
                type: integer
                enum: [25, 50, 75, 100]
                description: Fraction of a full position this level buys.
        sellLevels:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, signal, percentage]
            properties:
              id: { type: string }
              signal: { $ref: "#/components/schemas/StrategySignal" }
              percentage: { type: integer, enum: [25, 50, 75] }
        finalExit:
          type: object
          description: |
            Closes the whole remaining position. One action, reached by one or more alternative
            exit rules combined with OR: FINAL EXIT occurs when any rule matches, and however many
            match on one date the position closes once. Conditions AND inside a rule; rules OR
            across the action. There is no nested grouping — `A AND (B OR C)` is written as
            `(A AND B) OR (A AND C)`.
          required: [id, rules]
          properties:
            id: { type: string }
            rules:
              type: array
              minItems: 1
              maxItems: 10
              description: |
                Alternatives, in the order the strategy defines them. Each owns one signal, so each
                carries its own optional trigger and no rule's trigger constrains another's.
              items:
                type: object
                required: [id, signal]
                properties:
                  id: { type: string }
                  signal: { $ref: "#/components/schemas/StrategySignal" }

    LegacyStrategyDefinitionV1:
      type: object
      description: |
        The definition document as schema version 1 wrote it. Its only difference from the canonical
        version 2 document is FINAL EXIT: a single flat `signal` rather than a list of alternative
        exit `rules`.

        Accepted on requests and upgraded on the way in — a version 1 FINAL EXIT becomes exactly one
        exit rule carrying the same signal, keyed by FINAL EXIT's own id — so a client that has not
        been updated is served rather than refused. **Never returned**: responses are always version
        2. New clients should send `StrategyDefinition`.
      required: [schemaVersion, buyLevels, sellLevels]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        buyLevels:
          {
            $ref: "#/components/schemas/StrategyDefinition/properties/buyLevels",
          }
        sellLevels:
          {
            $ref: "#/components/schemas/StrategyDefinition/properties/sellLevels",
          }
        finalExit:
          type: object
          description: Closes the whole remaining position when its single signal matches.
          required: [id, signal]
          properties:
            id: { type: string }
            signal: { $ref: "#/components/schemas/StrategySignal" }

    StrategyDefinitionInput:
      description: |
        A strategy definition as a request may submit it: the canonical version 2 document, or the
        version 1 document a client written before FINAL EXIT gained exit rules still sends. A
        version 1 body is upgraded to the equivalent single-rule version 2 document before
        validation, so both are validated by one set of rules and both are answered with a
        version 2 document.
      oneOf:
        - { $ref: "#/components/schemas/StrategyDefinition" }
        - { $ref: "#/components/schemas/LegacyStrategyDefinitionV1" }

    StrategySummary:
      type: object
      required:
        [
          id,
          name,
          buyLevelCount,
          sellLevelCount,
          hasFinalExit,
          versionNumber,
          createdAt,
          updatedAt,
          ownership,
          canEdit,
        ]
      properties:
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        systemKey: { type: string }
        canEdit: { type: boolean }
        premium: { $ref: "#/components/schemas/ContentPremium" }
        locked: { $ref: "#/components/schemas/ContentLocked" }
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        buyLevelCount: { type: integer, minimum: 0 }
        sellLevelCount: { type: integer, minimum: 0 }
        hasFinalExit: { type: boolean }
        versionNumber:
          {
            type: integer,
            minimum: 1,
            description: Incremented by every definition replace.,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StrategyDetail:
      allOf:
        - { $ref: "#/components/schemas/StrategySummary" }
        - type: object
          required: [definition]
          properties:
            definition: { $ref: "#/components/schemas/StrategyDefinition" }

    CreateStrategyRequest:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        definition: { $ref: "#/components/schemas/StrategyDefinitionInput" }

    UpdateStrategyRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description:
          oneOf:
            - { type: string, maxLength: 500 }
            - { type: "null" }

    ReplaceStrategyDefinitionRequest:
      type: object
      required: [definition]
      properties:
        definition: { $ref: "#/components/schemas/StrategyDefinitionInput" }

    DuplicateStrategyRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: Only the copy's name; everything the copy holds is taken from the source.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    # -------------------------------------------------------------------------------------------
    # Benchmarks
    # -------------------------------------------------------------------------------------------
    Benchmark:
      type: object
      required: [id, code, name, currency]
      properties:
        id: { type: string, format: uuid }
        code:
          {
            type: string,
            description: The stable identifier a backtest request names.,
            examples: [SP500],
          }
        name: { type: string }
        description: { type: string }
        currency: { type: string }

    # -------------------------------------------------------------------------------------------
    # Market
    # -------------------------------------------------------------------------------------------
    MarketOverviewPeriod:
      type: string
      enum: ["1W", "1M", "3M", "6M", "YTD", "1Y"]

    MarketOverviewReturns:
      type: object
      description: |
        One percentage per period, unrounded. `null` when the stored history does not reach the
        period's anchor, or coverage has a gap at it — never zero.
      required: ["1W", "1M", "3M", "6M", "YTD", "1Y"]
      properties:
        "1W": { type: [number, "null"] }
        "1M": { type: [number, "null"] }
        "3M": { type: [number, "null"] }
        "6M": { type: [number, "null"] }
        YTD: { type: [number, "null"] }
        "1Y": { type: [number, "null"] }

    MarketOverviewSparkline:
      type: object
      description: |
        One period's trend line: the fund's stored end-of-day closes from the period's anchor
        session — the session its return is measured from — through its `sessionDate`, rebased to
        100 at the first point, oldest first, so the line carries a shape and never a price. Its
        first-to-last change is the period's return. Every point is a real session's close in
        session order; nothing is interpolated. A window of at most 48 sessions (a week, a month)
        is sent whole; a longer one is thinned deterministically to 48 sessions, keeping both
        endpoints.
      required: [startDate, endDate, values]
      properties:
        startDate:
          {
            type: string,
            format: date,
            description: The period's anchor session.,
          }
        endDate:
          { type: string, format: date, description: The fund's sessionDate. }
        values:
          type: array
          minItems: 2
          maxItems: 48
          items: { type: number }

    MarketOverviewSparklines:
      type: object
      description: |
        One trend line per period. `null` wherever the period's return is `null`, and where the
        stored coverage has a gap inside the period's window.
      required: ["1W", "1M", "3M", "6M", "YTD", "1Y"]
      properties:
        "1W":
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }
        "1M":
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }
        "3M":
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }
        "6M":
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }
        YTD:
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }
        "1Y":
          oneOf:
            - { $ref: "#/components/schemas/MarketOverviewSparkline" }
            - { type: "null" }

    MarketOverviewInstrument:
      type: object
      required: [ticker, name, status, returns, sparklines]
      properties:
        ticker:
          {
            type: string,
            description: The exchange ticker the product displays.,
            examples: [XLK],
          }
        name:
          {
            type: string,
            description: What the product calls it.,
            examples: [Technology],
          }
        note:
          {
            type: string,
            description: A qualification to show beside the instrument,
            such as that USO holds oil futures.,
          }
        status:
          type: string
          enum: [AVAILABLE, STALE, UNAVAILABLE]
          description: |
            `AVAILABLE` at the reference session; `STALE` behind it, measured to its own
            `sessionDate`; `UNAVAILABLE` with no completed session, every return `null`.
        sessionDate:
          {
            type: string,
            format: date,
            description: The latest completed session the returns are measured to.,
          }
        returns: { $ref: "#/components/schemas/MarketOverviewReturns" }
        sparklines: { $ref: "#/components/schemas/MarketOverviewSparklines" }

    MarketOverviewGroup:
      type: object
      required: [id, label, shortLabel, instruments]
      properties:
        id: { type: string, enum: [BENCHMARKS, US_SECTORS, MACRO_ALTERNATIVES] }
        label: { type: string, examples: [Sector Performance] }
        shortLabel: { type: string, examples: [Sectors] }
        instruments:
          type: array
          items: { $ref: "#/components/schemas/MarketOverviewInstrument" }

    MarketOverviewResponse:
      type: object
      required: [generatedAt, basis, returnBasis, status, groups]
      properties:
        generatedAt:
          {
            type: string,
            format: date-time,
            description: When this summary was computed. Not a market time.,
          }
        basis:
          type: string
          enum: [END_OF_DAY]
          description: |
            How current the numbers are. One member today; an intraday source would be a second
            member and a different loading path, never a silent reinterpretation of this one.
        returnBasis:
          type: string
          enum: [PRICE_RETURN]
          description: Split-adjusted close to close, distributions excluded.
        status:
          type: string
          enum: [AVAILABLE, PARTIAL, UNAVAILABLE]
          description: |
            `AVAILABLE` when every fund is; `UNAVAILABLE` when none has data (an environment whose
            histories were never loaded); `PARTIAL` otherwise.
        asOf:
          {
            type: string,
            format: date,
            description: The reference session,
            the newest completed session any fund reached. Absent when nothing is available.,
          }
        groups:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/MarketOverviewGroup" }

    # -------------------------------------------------------------------------------------------
    # Backtests
    # -------------------------------------------------------------------------------------------
    BacktestRunStatus:
      type: string
      enum:
        [QUEUED, PREPARING_DATA, RUNNING, FINALIZING, COMPLETED, FAILED, CANCELLED]
      description: |
        `COMPLETED`, `FAILED` and `CANCELLED` are terminal. A `CANCELLED` run was stopped by its
        owner and holds no result.
    BacktestQueueState:
      type: object
      description: |
        Where a `QUEUED` run stands. `ahead` counts the runs queued before it, deployment-wide — an
        upper bound on how many start first, because waiting runs are started fairly across owners.
      required: [ahead, executing, capacity]
      properties:
        ahead: { type: integer, minimum: 0 }
        executing:
          { type: integer, minimum: 0, description: Backtests executing right now, deployment-wide. }
        capacity:
          { type: integer, minimum: 1, description: How many may execute at once, deployment-wide. }
    BacktestCancellation:
      type: object
      description: |
        Present while the owner's cancellation is pending: requested, and the worker executing the
        run has not stopped yet. The run keeps its execution slot until it does.
      required: [requestedAt]
      properties:
        requestedAt: { type: string, format: date-time }

    CreateBacktestRunRequest:
      type: object
      required:
        [
          strategyId,
          stockListId,
          startDate,
          endDate,
          initialCapital,
          maximumPositions,
        ]
      properties:
        strategyId:
          {
            type: string,
            format: uuid,
            description: Must be owned by the caller.,
          }
        stockListId:
          {
            type: string,
            format: uuid,
            description: Must be owned by the caller and non-empty.,
          }
        benchmarkCode:
          type: string
          description: A catalog benchmark code. Omitting it uses this deployment's default.
          examples: [SP500]
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: |
            Must not precede `startDate`, nor be after today in New York time. The period may not
            exceed 30 years, and a plan may bound it further (`backtests.maxHistoricalYears`), which
            is a `403` rather than a `400`. A date after the newest finalized end-of-day session
            (16:00 New York plus the publication delay) is ended at that session, and the run's
            snapshot records the date it really ends on: a run never simulates an unfinished
            session.
        initialCapital: { type: number, minimum: 1, maximum: 1000000000 }
        monthlyContribution:
          type: number
          minimum: 0
          maximum: 10000000
          description: Defaults to 0.
        maximumPositions:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            A full position is `1 / maximumPositions` of the portfolio. There is deliberately no
            user-entered maximum-allocation percentage; this is the one input.

    BacktestBenchmarkSnapshot:
      type: object
      required: [benchmarkId, code, name, sourceKind, methodologyVersion]
      properties:
        benchmarkId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sourceKind: { type: string, enum: [FMP_SYMBOL] }
        methodologyVersion: { type: integer }

    BacktestMethodology:
      type: object
      description: |
        The versioned engine methodology this run recorded. Execution behaviour the product leaves
        open — candidate ordering, level firing, exits before entries, contribution timing, fees —
        is fixed here at submission, so a result stays reproducible across engine changes.
      required:
        [
          calendar,
          executionCalendar,
          candidateOrdering,
          execution,
          executionCosts,
          cashYield,
          strategyEvaluation,
          contribution,
          returns,
          comparisonScenarios,
          costBasis,
        ]
      properties:
        calendar: { type: string }
        executionCalendar: { type: string }
        candidateOrdering: { type: string }
        execution: { type: string }
        terminalLiquidation:
          type: string
          description: |
            How the run ends. Absent on a run submitted before FactorSage liquidated remaining
            positions at the end of the period — those runs finished holding what they held, and a
            snapshot is never rewritten.
        executionCosts: { type: string }
        cashYield: { type: string }
        strategyEvaluation: { type: string }
        contribution: { type: string }
        returns: { type: string }
        comparisonScenarios: { type: string }
        costBasis: { type: string }

    BacktestRunConfiguration:
      type: object
      description: |
        The immutable snapshot the run executed. `strategyId` and `stockListId` are nullable because
        the live rows may have been deleted since — the snapshot survives them, which is what makes
        deleting a strategy safe.
      required:
        [
          strategyName,
          strategyVersionNumber,
          stockListName,
          securityCount,
          startDate,
          endDate,
          initialCapital,
          monthlyContribution,
          maximumPositions,
          fullPositionPercent,
          benchmark,
          methodology,
        ]
      properties:
        strategyId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        strategyName: { type: string }
        strategyVersionNumber: { type: integer }
        stockListId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        stockListName: { type: string }
        securityCount: { type: integer, minimum: 0 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        initialCapital: { type: number }
        monthlyContribution: { type: number }
        maximumPositions: { type: integer }
        fullPositionPercent:
          { type: number, description: "Derived: 100 / maximumPositions." }
        benchmark: { $ref: "#/components/schemas/BacktestBenchmarkSnapshot" }
        methodology: { $ref: "#/components/schemas/BacktestMethodology" }

    NullableNumber:
      oneOf: [{ type: number }, { type: "null" }]
    NullableDate:
      oneOf: [{ type: string, format: date }, { type: "null" }]
    NullableDateTime:
      oneOf: [{ type: string, format: date-time }, { type: "null" }]
    NullableString:
      oneOf: [{ type: string }, { type: "null" }]

    BacktestRunSummary:
      type: object
      required:
        [
          id,
          runNumber,
          status,
          strategyId,
          strategyName,
          stockListId,
          stockListName,
          benchmarkCode,
          benchmarkName,
          startDate,
          endDate,
          initialCapital,
          maximumPositions,
          queuedAt,
          startedAt,
          completedAt,
          progressPercent,
          progressMessage,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          alphaPercent,
          portfolioCagrPercent,
        ]
      properties:
        id: { type: string, format: uuid }
        runNumber:
          type: integer
          minimum: 1
          description: |
            The run's user-facing identity, displayed as `Run #0001`: sequential per user in
            submission order, unique per user, allocated once and never changed. A deleted run's
            number is never reused. `id` remains the technical identity used by every route.
        status: { $ref: "#/components/schemas/BacktestRunStatus" }
        strategyId:
          description: Null once the strategy has been deleted; the name comes from the run snapshot.
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        strategyName: { type: string }
        stockListId:
          description: Null once the stock list has been deleted; the name comes from the run snapshot.
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        stockListName: { type: string }
        benchmarkCode: { type: string }
        benchmarkName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        initialCapital: { type: number }
        maximumPositions: { type: integer }
        queuedAt: { type: string, format: date-time }
        startedAt: { $ref: "#/components/schemas/NullableDateTime" }
        completedAt: { $ref: "#/components/schemas/NullableDateTime" }
        progressPercent: { type: number, minimum: 0, maximum: 100 }
        progressMessage: { $ref: "#/components/schemas/NullableString" }
        portfolioReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        alphaPercent: { $ref: "#/components/schemas/NullableNumber" }
        portfolioCagrPercent:
          description: The run's stored compound annual growth rate; null until it completes.
          $ref: "#/components/schemas/NullableNumber"

    BacktestCurvePoint:
      type: object
      required:
        [
          date,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          strategyValue,
          benchmarkValue,
          cashBaselineValue,
        ]
      properties:
        date: { type: string, format: date }
        portfolioReturnPercent: { type: number }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        strategyValue: { type: number }
        benchmarkValue: { $ref: "#/components/schemas/NullableNumber" }
        cashBaselineValue:
          type: number
          description: The uninvested-cash comparison scenario, contributions included.

    BacktestTradeReason:
      description: |
        Why one trade happened, in the canonical Strategy description language. Structured rather
        than a rendered sentence: the server owns which rule fired and says so in canonical labels,
        and the browser decides how to draw it. Always derived from the run's immutable snapshot,
        so editing a strategy afterwards never rewrites a run's history.
      oneOf:
        - type: object
          required: [kind, conditions]
          properties:
            kind: { type: string, enum: [STRATEGY] }
            exitRule:
              type: integer
              minimum: 1
              description: The FINAL EXIT Exit Rule's 1-based position, when the level has several.
            conditions: { type: array, items: { type: string } }
            trigger: { type: string }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [END_OF_BACKTEST] }

    BacktestTrade:
      type: object
      required:
        [
          sequence,
          date,
          symbol,
          name,
          action,
          source,
          levelPercentage,
          shares,
          price,
          amount,
          realizedPnl,
          realizedPnlPercent,
          reason,
        ]
      properties:
        sequence: { type: integer, minimum: 0 }
        date: { type: string, format: date }
        symbol: { type: string }
        name: { type: string }
        action: { type: string, enum: [BUY, SELL, FINAL_EXIT] }
        source:
          type: string
          enum: [STRATEGY, END_OF_BACKTEST]
          description: |
            What put the trade in the log: the Strategy's own signal, or the end of the simulated
            period. A terminal liquidation is a sale and keeps `action: SELL`; it is deliberately
            not a fourth action and is never the Strategy's FINAL EXIT.
        levelPercentage:
          description: The strategy level that fired. Null for a final exit.
          oneOf: [{ type: integer }, { type: "null" }]
        shares: { type: number }
        price: { type: number }
        amount: { type: number }
        realizedPnl: { $ref: "#/components/schemas/NullableNumber" }
        realizedPnlPercent: { $ref: "#/components/schemas/NullableNumber" }
        reason:
          description: |
            Null when the run did not record enough to say which rule fired — a FINAL EXIT with
            several Exit Rules, executed before the engine recorded the matching rule's identity.
          oneOf:
            - { $ref: "#/components/schemas/BacktestTradeReason" }
            - { type: "null" }

    BacktestAnnualReturn:
      type: object
      description: |
        What the portfolio returned in one calendar year — that year alone, never cumulative.
        Chained off the run's time-weighted return index, so a year that received monthly
        contributions does not report the deposits as performance.
      required:
        [year, simulatedThrough, returnPercent, benchmarkReturnPercent, partial]
      properties:
        year: { type: string, pattern: "^\\d{4}$" }
        simulatedThrough: { type: string, format: date }
        returnPercent: { type: number }
        benchmarkReturnPercent:
          description: |
            What the run's benchmark returned over the same window as `returnPercent` — from the
            previous year's last simulated date (or the run's first simulated date) to
            `simulatedThrough` — chained off the run's benchmark growth index. A price return. Null
            when the benchmark has no value at one end of that window; never estimated.
          $ref: "#/components/schemas/NullableNumber"
        partial:
          type: boolean
          description: |
            True when only part of the calendar year was simulated — the run's first year when it
            starts after 1 January, its last when it ends before 31 December.

    BacktestRunPage:
      type: object
      description: |
        One page of the caller's backtest runs: searched, filtered, ordered and counted in the
        database, so every count and page describes the whole history.
      required:
        [runs, page, pageSize, totalCount, pageCount, unfilteredCount, q, status, sort]
      properties:
        runs:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/BacktestRunSummary" }
        page:
          type: integer
          minimum: 1
          description: The page actually served, after clamping a page past the end.
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalCount:
          type: integer
          minimum: 0
          description: The runs matching the search and the status filter.
        pageCount: { type: integer, minimum: 1 }
        unfilteredCount:
          type: integer
          minimum: 0
          description: Every run the caller owns, whatever the search and filter.
        q:
          description: The search actually applied, or null.
          oneOf: [{ type: string }, { type: "null" }]
        status:
          description: The status filter actually applied, or null for every status.
          oneOf:
            - { type: string, enum: [ACTIVE, COMPLETED, FAILED] }
            - { type: "null" }
        sort:
          type: string
          enum: [newest, oldest, cagr, strategy]
    BacktestTradePage:
      type: object
      description: |
        One page of a completed run's trade log, newest trade first unless `order` says otherwise.
        Paged in the database: an eighteen-thousand-trade run must not ship eighteen thousand rows
        to display fifty. A filter is applied there too, so the counts describe the filtered log.
      required:
        [
          items,
          page,
          pageSize,
          totalCount,
          pageCount,
          unfilteredCount,
          symbols,
          symbol,
          action,
          order,
        ]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/BacktestTrade" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 200 }
        totalCount:
          type: integer
          minimum: 0
          description: The trades matching the filter; every trade the run executed without one.
        pageCount: { type: integer, minimum: 1 }
        unfilteredCount:
          type: integer
          minimum: 0
          description: Every trade the run executed, terminal liquidations included, whatever the filter.
        symbols:
          type: array
          description: |
            Every distinct symbol the run traded, sorted — the stock filter's options. Independent
            of the filter.
          items: { type: string }
        symbol:
          description: The symbol filter actually applied, or null for every stock.
          oneOf: [{ type: string }, { type: "null" }]
        action:
          description: The action filter actually applied, or null for every action.
          oneOf:
            - { type: string, enum: [BUY, SELL, FINAL_EXIT] }
            - { type: "null" }
        order:
          type: string
          enum: [desc, asc]
          description: The order actually applied, by execution sequence.

    BacktestHolding:
      type: object
      required:
        [
          symbol,
          name,
          shares,
          averageCost,
          lastPrice,
          lastPriceDate,
          marketValue,
          unrealizedPnlPercent,
          allocationPercent,
        ]
      properties:
        symbol: { type: string }
        name: { type: string }
        shares: { type: number }
        averageCost: { type: number }
        lastPrice: { type: number }
        lastPriceDate: { type: string, format: date }
        marketValue: { type: number }
        unrealizedPnlPercent: { type: number }
        allocationPercent: { type: number }

    BacktestLiveSnapshot:
      type: object
      description: |
        The simulation as of the newest checkpoint. Observation only — nothing here is ever read
        back into simulated state, so the checkpoint cadence cannot change a result.
      required:
        [
          simulatedThrough,
          completedDays,
          totalDays,
          cash,
          positionsValue,
          totalValue,
          investedCapital,
          netProfit,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          alphaPercent,
          portfolioCagrPercent,
          maxDrawdownPercent,
          benchmarkValue,
          cashBaselineValue,
          tradeCount,
          openPositions,
          curve,
          holdings,
          recentTrades,
        ]
      properties:
        simulatedThrough: { type: string, format: date }
        completedDays: { type: integer, minimum: 0 }
        totalDays: { type: integer, minimum: 0 }
        cash: { type: number }
        positionsValue: { type: number }
        totalValue: { type: number }
        investedCapital: { type: number }
        netProfit: { type: number }
        portfolioReturnPercent: { type: number }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        alphaPercent: { $ref: "#/components/schemas/NullableNumber" }
        portfolioCagrPercent:
          description: |
            CAGR over the part simulated so far — the same calculation the completed summary
            reports, so the KPI tile carries a number while a run executes.
          $ref: "#/components/schemas/NullableNumber"
        maxDrawdownPercent: { type: number }
        benchmarkValue: { $ref: "#/components/schemas/NullableNumber" }
        cashBaselineValue: { type: number }
        tradeCount: { type: integer, minimum: 0 }
        openPositions: { type: integer, minimum: 0 }
        curve:
          type: array
          maxItems: 1500
          items: { $ref: "#/components/schemas/BacktestCurvePoint" }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/BacktestHolding" }
        recentTrades:
          type: array
          items: { $ref: "#/components/schemas/BacktestTrade" }

    BacktestMilestone:
      type: object
      description: One completed calendar year of simulation, carrying the prefix computed so far.
      required:
        [
          sequence,
          year,
          simulatedThrough,
          percent,
          completedDays,
          totalDays,
          cash,
          totalValue,
          investedCapital,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          alphaPercent,
          maxDrawdownPercent,
          tradeCount,
          openPositions,
        ]
      properties:
        sequence: { type: integer, minimum: 0 }
        year: { type: string }
        simulatedThrough: { type: string, format: date }
        percent: { type: number, minimum: 0, maximum: 100 }
        completedDays: { type: integer, minimum: 0 }
        totalDays: { type: integer, minimum: 0 }
        cash: { type: number }
        totalValue: { type: number }
        investedCapital: { type: number }
        portfolioReturnPercent: { type: number }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        alphaPercent: { $ref: "#/components/schemas/NullableNumber" }
        maxDrawdownPercent: { type: number }
        tradeCount: { type: integer, minimum: 0 }
        openPositions: { type: integer, minimum: 0 }

    BacktestFailure:
      type: object
      required: [code, message, phase]
      properties:
        code:
          type: string
          enum:
            [
              DATA_UNAVAILABLE,
              EXECUTION_CALENDAR_UNAVAILABLE,
              ENGINE_VERSION_MISMATCH,
              NO_TRADING_DAYS,
              EXECUTION_FAILED,
              ABANDONED,
            ]
        message: { type: string }
        phase:
          oneOf:
            - { type: string, enum: [PREPARING_DATA, RUNNING, FINALIZING] }
            - { type: "null" }

    BacktestProgress:
      type: object
      required:
        [
          runId,
          status,
          percent,
          message,
          simulatedThrough,
          sequence,
          updatedAt,
          startedAt,
          completedAt,
          live,
          milestones,
          failure,
        ]
      properties:
        runId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BacktestRunStatus" }
        percent: { type: number, minimum: 0, maximum: 100 }
        message: { $ref: "#/components/schemas/NullableString" }
        simulatedThrough: { $ref: "#/components/schemas/NullableDate" }
        sequence:
          type: integer
          description: |
            Monotonic per run. A client may safely drop a response whose `sequence` is lower than
            one it has already applied — that is how out-of-order polling responses are handled.
        updatedAt: { $ref: "#/components/schemas/NullableDateTime" }
        startedAt: { $ref: "#/components/schemas/NullableDateTime" }
        completedAt: { $ref: "#/components/schemas/NullableDateTime" }
        live:
          description: Present while a simulation is in flight; null otherwise.
          oneOf:
            - { $ref: "#/components/schemas/BacktestLiveSnapshot" }
            - { type: "null" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/BacktestMilestone" }
        failure:
          oneOf:
            - { $ref: "#/components/schemas/BacktestFailure" }
            - { type: "null" }
        cancellation: { $ref: "#/components/schemas/BacktestCancellation" }
        queue:
          allOf: [{ $ref: "#/components/schemas/BacktestQueueState" }]
          description: Present only while the run is `QUEUED`.

    BacktestResultSummary:
      type: object
      required:
        [
          firstSimulatedDate,
          lastSimulatedDate,
          tradingDays,
          investedCapital,
          finalCash,
          finalPositionsValue,
          finalValue,
          netProfit,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          alphaPercent,
          portfolioCagrPercent,
          benchmarkCagrPercent,
          maxDrawdownPercent,
          benchmarkMaxDrawdownPercent,
          realizedPnl,
          unrealizedPnl,
          totalTrades,
          buyTrades,
          sellTrades,
          finalExitTrades,
          winningTrades,
          losingTrades,
          openPositions,
        ]
      properties:
        firstSimulatedDate: { type: string, format: date }
        lastSimulatedDate: { type: string, format: date }
        tradingDays: { type: integer, minimum: 0 }
        investedCapital: { type: number }
        finalCash: { type: number }
        finalPositionsValue: { type: number }
        finalValue: { type: number }
        netProfit: { type: number }
        portfolioReturnPercent: { type: number }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        alphaPercent: { $ref: "#/components/schemas/NullableNumber" }
        portfolioCagrPercent: { $ref: "#/components/schemas/NullableNumber" }
        benchmarkCagrPercent:
          description: >-
            The benchmark's compound annual growth rate over the run's own simulated span, derived
            when read from benchmarkReturnPercent; never stored.
          $ref: "#/components/schemas/NullableNumber"
        maxDrawdownPercent: { type: number }
        benchmarkMaxDrawdownPercent:
          { $ref: "#/components/schemas/NullableNumber" }
        realizedPnl: { type: number }
        unrealizedPnl: { type: number }
        totalTrades: { type: integer, minimum: 0 }
        buyTrades: { type: integer, minimum: 0 }
        sellTrades: { type: integer, minimum: 0 }
        finalExitTrades: { type: integer, minimum: 0 }
        winningTrades: { type: integer, minimum: 0 }
        losingTrades: { type: integer, minimum: 0 }
        openPositions: { type: integer, minimum: 0 }

    BacktestResult:
      type: object
      description: |
        A completed run's result. The trade log is deliberately absent — it is paginated from the
        database through `GET /backtests/{runId}/trades`, because a bounded tail of a long run's
        trades is neither the whole log nor a usable page of one. Final holdings are absent too: a
        run executed under terminal liquidation ends in cash.
      required: [summary, annualReturns, curve]
      properties:
        summary: { $ref: "#/components/schemas/BacktestResultSummary" }
        annualReturns:
          type: array
          description: Per-calendar-year returns, non-cumulative.
          items: { $ref: "#/components/schemas/BacktestAnnualReturn" }
        curve:
          type: array
          maxItems: 1500
          description: Downsampled to a bounded number of points for rendering.
          items: { $ref: "#/components/schemas/BacktestCurvePoint" }
        etfConditions:
          type: array
          description: |
            One row per ETF source the run's strategy read, in the definition's catalog order;
            absent for a run whose strategy reads none. A non-READY row is why the ETF conditions
            could not evaluate.
          items:
            { $ref: "#/components/schemas/BacktestEtfConditionDiagnostics" }
        stockSectors:
          type: array
          description: |
            Which sector ETF each stock's Stock's Sector rules read, exactly as the run's snapshot
            froze it at submission, by symbol; absent unless the strategy reads Stock's Sector.
            Derived at read time from the snapshot: the classification stored when the run was
            submitted, applied to every date of the period — not a historical sector record.
          items: { $ref: "#/components/schemas/StockSectorAssignment" }

    BacktestEtfConditionDiagnostics:
      type: object
      required: [code, ticker, status]
      description: |
        Whether one ETF condition source could be evaluated by a completed run, in the aggregate.
        READY still does not promise every session — dates before `firstSession`, indicator warm-up
        and gaps are per-session absences — but a non-READY status names the operational cause:
        NOT_BOOTSTRAPPED (the series' history was never bootstrapped), NOT_SYNCHRONIZED (no
        completed tail read proves any stored bar final), NO_FINALIZED_SESSIONS, or LOAD_FAILED
        (re-running retries it).
      properties:
        code: { type: string }
        ticker: { type: string }
        status:
          type: string
          enum:
            [
              READY,
              NOT_BOOTSTRAPPED,
              NOT_SYNCHRONIZED,
              NO_FINALIZED_SESSIONS,
              LOAD_FAILED,
            ]
        firstSession: { type: string, format: date }
        latestSession: { type: string, format: date }
        basisGeneration:
          type: integer
          description: The price-basis generation the run read the ETF's history under.
        submittedBasisGeneration:
          type: integer
          description: |
            The generation the run's snapshot recorded at submission, present only when it differs
            from `basisGeneration`: the provider restated the fund's history (a re-base) after the
            run was submitted, and the run computed on the restated history. Derived at read time
            from the immutable snapshot and result; never stored.

    BacktestRunDetail:
      type: object
      required:
        [
          id,
          runNumber,
          status,
          configuration,
          queuedAt,
          startedAt,
          completedAt,
          progress,
          live,
          milestones,
          result,
          failure,
        ]
      properties:
        id: { type: string, format: uuid }
        runNumber:
          type: integer
          minimum: 1
          description: The run's per-user Run ID number, as on `BacktestRunSummary`.
        status: { $ref: "#/components/schemas/BacktestRunStatus" }
        configuration: { $ref: "#/components/schemas/BacktestRunConfiguration" }
        queuedAt: { type: string, format: date-time }
        startedAt: { $ref: "#/components/schemas/NullableDateTime" }
        completedAt: { $ref: "#/components/schemas/NullableDateTime" }
        progress:
          type: object
          description: The last persisted checkpoint, so a page reloaded mid-run resumes from it.
          required: [percent, message, simulatedThrough, sequence, updatedAt]
          properties:
            percent: { type: number, minimum: 0, maximum: 100 }
            message: { $ref: "#/components/schemas/NullableString" }
            simulatedThrough: { $ref: "#/components/schemas/NullableDate" }
            sequence: { type: integer }
            updatedAt: { $ref: "#/components/schemas/NullableDateTime" }
        live:
          oneOf:
            - { $ref: "#/components/schemas/BacktestLiveSnapshot" }
            - { type: "null" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/BacktestMilestone" }
        result:
          description: Present only for `COMPLETED`.
          oneOf:
            - { $ref: "#/components/schemas/BacktestResult" }
            - { type: "null" }
        failure:
          description: Present only for `FAILED`.
          oneOf:
            - { $ref: "#/components/schemas/BacktestFailure" }
            - { type: "null" }
        cancellation: { $ref: "#/components/schemas/BacktestCancellation" }
        queue:
          allOf: [{ $ref: "#/components/schemas/BacktestQueueState" }]
          description: Present only while the run is `QUEUED`.

    BacktestRunStrategy:
      type: object
      required: [strategyName, versionNumber, definition]
      properties:
        strategyName: { type: string }
        versionNumber: { type: integer }
        definition:
          allOf:
            - { $ref: "#/components/schemas/StrategyDefinition" }
          description: |
            The canonical current document. A run submitted before FINAL EXIT gained exit rules
            froze a version 1 definition, and the stored snapshot keeps it that way forever — it is
            the reproducibility authority. The response projects it to version 2, so an old run's
            FINAL EXIT is returned as exactly one exit rule carrying its original signal.

    BacktestShare:
      type: object
      description: The owner's view of a run's public link.
      required: [shared, url, sharedAt]
      properties:
        shared: { type: boolean }
        url:
          description: The absolute public address, on the web origin. Null while not shared.
          oneOf: [{ type: string, format: uri }, { type: "null" }]
        sharedAt:
          description: When the current link was created. Null while not shared.
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    # -------------------------------------------------------------------------------------------
    # Shared backtests
    # -------------------------------------------------------------------------------------------
    SharedBacktestBenchmark:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    SharedBacktestConfiguration:
      type: object
      description: |
        The general simulation parameters the run froze. Deliberately absent: the strategy's name,
        id, version and rules; the stock list's name, id and securities; the methodology record;
        anything about the owner. Both counts come from the run's immutable snapshot.
      required:
        [
          startDate,
          endDate,
          initialCapital,
          monthlyContribution,
          maximumPositions,
          fullPositionPercent,
          benchmark,
          securityCount,
          strategyRuleCount,
        ]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        initialCapital: { type: number }
        monthlyContribution: { type: number }
        maximumPositions: { type: integer, minimum: 1 }
        fullPositionPercent: { type: number }
        benchmark: { $ref: "#/components/schemas/SharedBacktestBenchmark" }
        securityCount:
          type: integer
          minimum: 0
          description: How many securities the run's frozen list resolved to.
        strategyRuleCount:
          type: integer
          minimum: 0
          description: |
            Every Condition and Trigger of the frozen definition, across all BUY and SELL levels
            and every FINAL EXIT Exit Rule.
    SharedBacktestSummary:
      type: object
      description: |
        An allowlist of the stored summary's run-level aggregates. None names a security, a trade
        or a position.
      required:
        [
          firstSimulatedDate,
          lastSimulatedDate,
          finalValue,
          netProfit,
          portfolioReturnPercent,
          benchmarkReturnPercent,
          alphaPercent,
          portfolioCagrPercent,
          benchmarkCagrPercent,
          maxDrawdownPercent,
          benchmarkMaxDrawdownPercent,
          totalTrades,
        ]
      properties:
        firstSimulatedDate: { type: string, format: date }
        lastSimulatedDate: { type: string, format: date }
        finalValue: { type: number }
        netProfit: { type: number }
        portfolioReturnPercent: { type: number }
        benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
        alphaPercent: { $ref: "#/components/schemas/NullableNumber" }
        portfolioCagrPercent: { $ref: "#/components/schemas/NullableNumber" }
        benchmarkCagrPercent: { $ref: "#/components/schemas/NullableNumber" }
        maxDrawdownPercent: { type: number }
        benchmarkMaxDrawdownPercent:
          { $ref: "#/components/schemas/NullableNumber" }
        totalTrades: { type: integer, minimum: 0 }
    SharedBacktestReport:
      type: object
      required: [runNumber, url, completedAt, configuration, result]
      properties:
        runNumber:
          type: integer
          minimum: 1
          description: |
            The run's user-facing Run ID — shown as `Run #0084`, exactly as on its owner's page.
            Never the run's UUID: no database identity crosses the public link.
        url: { type: string, format: uri }
        completedAt: { type: string, format: date-time }
        configuration: { $ref: "#/components/schemas/SharedBacktestConfiguration" }
        result:
          type: object
          required: [summary, annualReturns, curve]
          properties:
            summary: { $ref: "#/components/schemas/SharedBacktestSummary" }
            annualReturns:
              type: array
              items: { $ref: "#/components/schemas/BacktestAnnualReturn" }
            curve:
              type: array
              description: The owner's page's own chart curve, point for point.
              items: { $ref: "#/components/schemas/BacktestCurvePoint" }
    SharedBacktestPreviewPoint:
      type: object
      required: [date, strategyValue, benchmarkValue]
      properties:
        date: { type: string, format: date }
        strategyValue: { type: number }
        benchmarkValue: { $ref: "#/components/schemas/NullableNumber" }
    DemoBacktestList:
      type: object
      required: [demos]
      properties:
        demos:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/DemoBacktest" }
    DemoBacktest:
      type: object
      required: [title, description, path, url, completedAt, configuration, headline]
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        path:
          type: string
          description: The shared report on the web origin, `/share/{token}`.
        url: { type: string, format: uri }
        completedAt: { type: string, format: date-time }
        configuration:
          $ref: "#/components/schemas/SharedBacktestPreview/properties/configuration"
        headline:
          $ref: "#/components/schemas/SharedBacktestPreview/properties/headline"
    SharedBacktestPreview:
      type: object
      required: [configuration, headline, series]
      properties:
        configuration:
          type: object
          required: [startDate, endDate, benchmark, securityCount, strategyRuleCount]
          properties:
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            benchmark: { $ref: "#/components/schemas/SharedBacktestBenchmark" }
            securityCount: { type: integer, minimum: 0 }
            strategyRuleCount: { type: integer, minimum: 0 }
        headline:
          type: object
          required:
            [
              portfolioCagrPercent,
              benchmarkCagrPercent,
              portfolioReturnPercent,
              benchmarkReturnPercent,
              maxDrawdownPercent,
            ]
          properties:
            portfolioCagrPercent: { $ref: "#/components/schemas/NullableNumber" }
            benchmarkCagrPercent: { $ref: "#/components/schemas/NullableNumber" }
            portfolioReturnPercent: { type: number }
            benchmarkReturnPercent: { $ref: "#/components/schemas/NullableNumber" }
            maxDrawdownPercent: { type: number }
        series:
          type: array
          maxItems: 600
          items: { $ref: "#/components/schemas/SharedBacktestPreviewPoint" }

    # -------------------------------------------------------------------------------------------
    # Monitors
    # -------------------------------------------------------------------------------------------
    MonitorOperationalStatus:
      type: string
      enum: [ACTIVE, DISABLED, BLOCKED_BY_ENTITLEMENT]
      description: |
        Derived, never persisted as user intent. `enabled` is what the user set; a monitor may still
        be `BLOCKED_BY_ENTITLEMENT` because the caller's plan no longer covers it, and upgrading
        unblocks it without the user having to re-enable anything. A built-in monitor is `ACTIVE`
        or `DISABLED` according to its global switch alone.
    MonitorBlockedReason:
      type: string
      enum: [MONITOR_CAPACITY, LIST_OVER_LIMIT]

    MonitorSignalKind:
      type: string
      enum: [CONDITION, TRIGGER]
      description: |
        Explanation only: whether the matched Strategy signal carried a Trigger. Both are signals.
    MonitorLifecycleState:
      type: string
      enum: [INACTIVE, PENDING_TRIGGER, ACTIVE, RESOLVED]
    MonitorTransitionReason:
      type: string
      enum:
        [
          CONDITIONS_MET,
          SETUP_STARTED,
          TRIGGER_FIRED,
          CONDITIONS_ENDED,
          EVENT_SESSION_ENDED,
          BUY_WINDOW_CLOSED,
          LOGIC_CHANGED,
          LEVEL_REMOVED,
          MEMBER_REMOVED,
          MONITOR_REBOUND,
          RECONSTRUCTED,
          MEMBERSHIP_CHANGED,
        ]
      description: |
        `MEMBERSHIP_CHANGED` is the administrative ending recorded when a security still in the
        Stock List stops being a current member there (no open-ended membership period that has
        begun). `BUY_WINDOW_CLOSED` appears only on rows the earlier live-quote Monitor recorded.
    MonitorSecurityStatus:
      type: string
      enum: [MATCHED, WAITING_FOR_TRIGGER, NO_MATCH, NOT_EVALUABLE, NOT_CHECKED]
      description: |
        `NOT_EVALUABLE` is a real answer, not an error: missing, warm-up or point-in-time
        unavailable data is never replaced by zero or by future data. `WAITING_FOR_TRIGGER` means a
        triggered level's Conditions hold and its Trigger has not fired yet.

    MonitorMatchedLevel:
      type: object
      required:
        [levelId, levelKind, kind, signalId, observationPrice, detectedAt]
      properties:
        levelId: { type: string }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        kind: { $ref: "#/components/schemas/MonitorSignalKind" }
        signalId: { type: string, format: uuid }
        observationPrice: { type: number }
        detectedAt: { type: string, format: date-time }

    MonitorWaitingLevel:
      type: object
      required: [levelId, levelKind, since]
      properties:
        levelId: { type: string }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        since: { type: string, format: date-time }

    MonitorSecurityEvaluation:
      type: object
      required: [security, status, matchedLevels, waitingLevels]
      properties:
        security: { $ref: "#/components/schemas/StockSearchResult" }
        status: { $ref: "#/components/schemas/MonitorSecurityStatus" }
        matchedLevels:
          type: array
          items: { $ref: "#/components/schemas/MonitorMatchedLevel" }
        waitingLevels:
          type: array
          items: { $ref: "#/components/schemas/MonitorWaitingLevel" }
        statusSince: { type: string, format: date-time }

    MonitorSignal:
      type: object
      description: |
        One signal occurrence: created when a level becomes `ACTIVE`, resolved when it stops, never
        reopened. A later activation is a new signal.
      required:
        [
          id,
          security,
          levelKind,
          levelId,
          kind,
          observationDate,
          observationPrice,
          detectedAt,
          reconstructed,
        ]
      properties:
        id: { type: string, format: uuid }
        security: { $ref: "#/components/schemas/StockSearchResult" }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        levelId: { type: string }
        kind: { $ref: "#/components/schemas/MonitorSignalKind" }
        observationDate:
          {
            type: string,
            format: date,
            description: The session the occurrence became active on.,
          }
        observationPrice: { type: number }
        observationBasis:
          { $ref: "#/components/schemas/MonitorObservationBasis" }
        detectedAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          description: Set when the occurrence ended. Absent while it is still active.
        resolvedObservationDate:
          {
            type: string,
            format: date,
            description: The session that ended it,
            when a session did.,
          }
        resolutionReason:
          { $ref: "#/components/schemas/MonitorTransitionReason" }
        reconstructed:
          type: boolean
          description: True when historical reconstruction, not a live scan, established the activation.

    MonitorObservationBasis:
      type: string
      enum: [LIVE_QUOTE, EOD_CLOSE]
      description: |
        `EOD_CLOSE` is the session's finalized end-of-day close. `LIVE_QUOTE` marks occurrences the
        earlier live-quote monitor decided on an intraday price, kept as recorded.

    MonitorWhyPredicate:
      type: object
      required: [role, description]
      properties:
        role: { type: string, enum: [CONDITION, TRIGGER] }
        description:
          {
            type: string,
            description: The rule in the canonical Strategy description language.,
          }
        result: { type: string, enum: [TRUE, FALSE, NOT_EVALUABLE] }
        metric:
          {
            type: [number, "null"],
            description: The left operand compared; null when it did not resolve.,
          }
        value:
          {
            type: [number, "null"],
            description: The right operand compared; null when it did not resolve.,
          }
        previousMetric: { type: [number, "null"] }
        previousValue: { type: [number, "null"] }

    MonitorWhyRule:
      type: object
      required: [predicates]
      properties:
        exitRule: { type: integer, minimum: 1 }
        predicates:
          type: array
          items: { $ref: "#/components/schemas/MonitorWhyPredicate" }

    MonitorWhy:
      type: object
      required: [basis, rules]
      description: |
        Why a change happened, from the Strategy version that decided it — never from the Strategy
        as it reads today. `EVIDENCE` carries the values recorded on `sessionDate`; `RULE_ONLY` is
        the decided rule's wording alone, for a change recorded before evidence existed.
      properties:
        basis: { type: string, enum: [EVIDENCE, RULE_ONLY] }
        sessionDate: { type: string, format: date }
        rules:
          type: array
          items: { $ref: "#/components/schemas/MonitorWhyRule" }

    MonitorCoverage:
      type: object
      required: [evaluatedMembers, currentMembers, listedMembers]
      properties:
        latestSession:
          {
            type: string,
            format: date,
            description: The newest session any current member was evaluated through.,
          }
        evaluatedMembers: { type: integer, minimum: 0 }
        currentMembers:
          {
            type: integer,
            minimum: 0,
            description: Members currently in the monitor universe.,
          }
        listedMembers: { type: integer, minimum: 0 }

    MonitorSignalRow:
      type: object
      required:
        [
          id,
          state,
          security,
          levelKind,
          levelId,
          kind,
          sessionDate,
          fromHistory,
        ]
      properties:
        id: { type: string }
        state: { type: string, enum: [ACTIVE, RESOLVED, PENDING_TRIGGER] }
        security: { $ref: "#/components/schemas/StockSearchResult" }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        levelId: { type: string }
        levelIndex: { type: integer, minimum: 1 }
        levelPercentage: { type: integer }
        kind: { $ref: "#/components/schemas/MonitorSignalKind" }
        sessionDate:
          {
            type: string,
            format: date,
            description: Its activation,
            or its resolution once resolved.,
          }
        activatedOn: { type: string, format: date }
        activationPrice: { type: number }
        observationBasis:
          { $ref: "#/components/schemas/MonitorObservationBasis" }
        resolvedOn: { type: string, format: date }
        resolutionReason:
          { $ref: "#/components/schemas/MonitorTransitionReason" }
        fromHistory: { type: boolean }
        why: { $ref: "#/components/schemas/MonitorWhy" }

    MonitorSignalPage:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/MonitorSignalRow" }
        nextCursor: { type: string }
        counts:
          type: object
          description: On a first page, how many rows each group holds under the level filter.
          required: [active, ended, waiting]
          properties:
            active: { type: integer, minimum: 0 }
            ended: { type: integer, minimum: 0 }
            waiting: { type: integer, minimum: 0 }

    MonitorSummary:
      type: object
      required:
        [
          id,
          name,
          enabled,
          strategyId,
          strategyName,
          stockListId,
          stockListName,
          securityCount,
          activeSignalCount,
          createdAt,
          updatedAt,
          operationalStatus,
          ownership,
          canEdit,
        ]
      properties:
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        systemKey: { type: string }
        canEdit: { type: boolean }
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        enabled:
          type: boolean
          description: |
            The one Enabled / Disabled switch. For a customer's own monitor, the owner's intent,
            never rewritten by the server (a plan limit is `operationalStatus`). For a built-in, the
            caller's own choice for their account — whether they receive its Dashboard activity —
            default enabled, and never whether the shared monitor is evaluated (`isGloballyEnabled`).
        strategyId: { type: string, format: uuid }
        strategyName: { type: string }
        stockListId: { type: string, format: uuid }
        stockListName: { type: string }
        securityCount: { type: integer, minimum: 0 }
        activeSignalCount: { type: integer, minimum: 0 }
        lastScanAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        operationalStatus:
          { $ref: "#/components/schemas/MonitorOperationalStatus" }
        blockedReason: { $ref: "#/components/schemas/MonitorBlockedReason" }
        isPublished: { type: boolean, description: Built-in monitors only. }
        isGloballyEnabled:
          { type: boolean, description: Built-in monitors only. }
        displayOrder: { type: integer, description: Built-in monitors only. }
        synchronization: { $ref: "#/components/schemas/MonitorSynchronization" }

    MonitorSynchronization:
      type: object
      description: |
        Present while the monitor is evaluated (`operationalStatus` `ACTIVE`): how far its
        evaluation covers the rolling 30-day activity window, read from durable checkpoints.
        `SYNCHRONIZING` — something can still be decided: no evaluation pass has completed since it
        started running, or a member's recorded evaluation begins inside the window and its missing
        sessions are still being decided; `SYNCHRONIZED` — every current member's recorded
        evaluation covers every session the window requires; `PARTIAL` — only history that cannot
        be evaluated: members with no market data after a completed pass (`awaitingMembers`), or
        members whose missing sessions could not be reconciled with decisions already recorded for
        them (`historyFrom`). Nothing recorded is rewritten to complete a window.
      required:
        [state, windowStart, currentMembers, coveredMembers, awaitingMembers]
      properties:
        state: { type: string, enum: [SYNCHRONIZING, SYNCHRONIZED, PARTIAL] }
        windowStart:
          {
            type: string,
            format: date,
            description: The first calendar day of the activity window.,
          }
        currentMembers: { type: integer, minimum: 0 }
        coveredMembers: { type: integer, minimum: 0 }
        awaitingMembers: { type: integer, minimum: 0 }
        historyFrom:
          {
            type: string,
            format: date,
            description: "When a member's missing sessions could not be recorded: the latest day a member's recorded evaluation starts on.",
          }

    MonitorDetail:
      allOf:
        - { $ref: "#/components/schemas/MonitorSummary" }
        - type: object
          required: [securities, signals]
          properties:
            securities:
              type: array
              description: Every security in the current list with its status, ordered by symbol.
              items: { $ref: "#/components/schemas/MonitorSecurityEvaluation" }
            signals:
              type: array
              description: The newest signals, newest first.
              items: { $ref: "#/components/schemas/MonitorSignal" }
            etfSources:
              type: array
              description: |
                One row per ETF source the Monitor's strategy currently reads, in catalog order;
                absent when it reads none. Derived at read time from the series' durable refresh
                state. AWAITING_SESSION means the current session's end-of-day bar is not final
                yet, so ETF conditions are not evaluable for it until the evening refresh lands.
              items: { $ref: "#/components/schemas/MonitorEtfSourceStatus" }
            stockSectors:
              type: array
              description: |
                Which sector ETF each monitored stock's Stock's Sector rules read now, from its
                current FMP sector, by symbol; absent unless the strategy reads Stock's Sector.
                Every sector ETF named here also has its row in `etfSources`.
              items: { $ref: "#/components/schemas/StockSectorAssignment" }
            coverage: { $ref: "#/components/schemas/MonitorCoverage" }

    MonitorDetailSummary:
      description: |
        `GET /monitors/{monitorId}?view=summary`: `MonitorDetail` without `securities` and
        `signals`, with `memberCounts`.
      allOf:
        - { $ref: "#/components/schemas/MonitorSummary" }
        - type: object
          required: [memberCounts]
          properties:
            memberCounts:
              type: object
              required: [total, byStatus]
              properties:
                total:
                  type: integer
                  minimum: 0
                  description: Every current member of the monitor's stock list.
                byStatus:
                  type: object
                  description: How many members are in each status; every status present.
                  additionalProperties: { type: integer, minimum: 0 }
            etfSources:
              type: array
              items: { $ref: "#/components/schemas/MonitorEtfSourceStatus" }
            stockSectors:
              type: array
              items: { $ref: "#/components/schemas/StockSectorAssignment" }
            coverage: { $ref: "#/components/schemas/MonitorCoverage" }

    MonitorEtfSourceStatus:
      type: object
      required: [code, ticker, status]
      properties:
        code: { type: string }
        ticker: { type: string }
        status:
          type: string
          enum: [READY, AWAITING_SESSION, NOT_SYNCHRONIZED, NOT_BOOTSTRAPPED]
        latestSession: { type: string, format: date }

    # -------------------------------------------------------------------------------------------
    # Dashboard and built-in content
    # -------------------------------------------------------------------------------------------
    DashboardEntityReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    DashboardMonitor:
      type: object
      required:
        [
          id,
          name,
          ownership,
          strategy,
          stockList,
          enabled,
          freshness,
          activeCount,
          pendingCount,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ownership: { $ref: "#/components/schemas/ContentOwnership" }
        strategy: { $ref: "#/components/schemas/DashboardEntityReference" }
        stockList: { $ref: "#/components/schemas/DashboardEntityReference" }
        enabled:
          type: boolean
          description: |
            Whether it is enabled for this caller — exactly the monitors whose activity their
            Dashboard shows: a customer's own monitor's `enabled`, or the caller's own choice for a
            built-in (default enabled; always for a Guest). Switched with `PATCH /monitors/{monitorId}`.
        freshness:
          type: string
          enum: [CURRENT, STALE, NOT_SCANNED, PAUSED]
        lastScanAt: { type: string, format: date-time }
        activeCount: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }

    DashboardRowReason:
      type: object
      required: [conditions, waitingForTrigger]
      properties:
        exitRule:
          {
            type: integer,
            minimum: 1,
            description: The FINAL EXIT Exit Rule's position,
            when there are several.,
          }
        conditions: { type: array, items: { type: string } }
        trigger: { type: string }
        waitingForTrigger: { type: boolean }

    DashboardRow:
      type: object
      required:
        [
          id,
          state,
          security,
          levelKind,
          reasons,
          monitor,
          strategy,
          stockList,
          since,
          reconstructed,
        ]
      properties:
        id: { type: string, description: Stable and opaque. }
        state: { type: string, enum: [ACTIVE, PENDING_TRIGGER] }
        security: { $ref: "#/components/schemas/StockSearchResult" }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        levelIndex: { type: integer, minimum: 1 }
        levelPercentage: { type: integer }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/DashboardRowReason" }
        monitor:
          allOf:
            - { $ref: "#/components/schemas/DashboardEntityReference" }
            - type: object
              required: [ownership]
              properties:
                ownership: { $ref: "#/components/schemas/ContentOwnership" }
        strategy: { $ref: "#/components/schemas/DashboardEntityReference" }
        stockList: { $ref: "#/components/schemas/DashboardEntityReference" }
        price:
          {
            type: number,
            description: The price observed when the state began.,
          }
        observationDate: { type: string, format: date }
        since: { type: string, format: date-time }
        reconstructed: { type: boolean }
        signalId: { type: string, format: uuid }

    DashboardResponse:
      type: object
      required: [viewer, generatedAt, staleAfterMs, monitors, rows]
      properties:
        viewer: { type: string, enum: [GUEST, AUTHENTICATED] }
        generatedAt: { type: string, format: date-time }
        staleAfterMs: { type: integer, minimum: 0 }
        monitors:
          type: array
          items: { $ref: "#/components/schemas/DashboardMonitor" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/DashboardRow" }

    DashboardActivityEvent:
      type: object
      required:
        [
          id,
          kind,
          reason,
          sessionDate,
          security,
          levelKind,
          monitor,
          strategy,
          stockList,
          fromHistory,
          recordedAt,
          why,
        ]
      properties:
        id: { type: string, description: Stable and opaque. }
        kind: { type: string, enum: [ACTIVATED, RESOLVED] }
        reason: { $ref: "#/components/schemas/MonitorTransitionReason" }
        sessionDate: { type: string, format: date }
        security: { $ref: "#/components/schemas/StockSearchResult" }
        levelKind: { $ref: "#/components/schemas/StrategyLevelKind" }
        levelIndex: { type: integer, minimum: 1 }
        levelPercentage: { type: integer }
        monitor:
          allOf:
            - { $ref: "#/components/schemas/DashboardEntityReference" }
            - type: object
              required: [ownership]
              properties:
                ownership: { $ref: "#/components/schemas/ContentOwnership" }
        strategy: { $ref: "#/components/schemas/DashboardEntityReference" }
        stockList: { $ref: "#/components/schemas/DashboardEntityReference" }
        signalId: { type: string, format: uuid }
        price:
          {
            type: number,
            description: "The occurrence's activation price: its session's finalized close.",
          }
        fromHistory:
          type: boolean
          description: |
            True when the session was not watched as it became final — a window replay, a resumed
            monitor's catch-up, a member added later — so the event was found afterwards.
            `sessionDate` is still the session the conditions held on.
        recordedAt:
          {
            type: string,
            format: date-time,
            description: When FactorSage evaluated the session and recorded the event.,
          }
        why:
          allOf:
            - { $ref: "#/components/schemas/MonitorWhy" }
          description: "Always `EVIDENCE`: every predicate with the values it compared."

    DashboardActivityResponse:
      type: object
      required: [viewer, generatedAt, events]
      properties:
        viewer: { type: string, enum: [GUEST, AUTHENTICATED] }
        generatedAt: { type: string, format: date-time }
        windowStart:
          {
            type: string,
            format: date,
            description: "The Dashboard feed's rolling window: only sessions on or after this day — 30 calendar days ending on the newest finalized session. Absent on a monitor's own activity history, which is not windowed.",
          }
        events:
          type: array
          items: { $ref: "#/components/schemas/DashboardActivityEvent" }
        nextCursor: { type: string }

    BuiltInContentItem:
      type: object
      required: [id, systemKey, name, updatedAt]
      properties:
        id: { type: string, format: uuid }
        systemKey: { type: string }
        name: { type: string }
        displayOrder: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedByEmail: { type: string, format: email }

    BuiltInContentAdminResponse:
      type: object
      required: [lists, strategies, monitors]
      properties:
        lists:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/BuiltInContentItem" }
              - type: object
                required: [itemCount]
                properties:
                  itemCount: { type: integer, minimum: 0 }
        strategies:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/BuiltInContentItem" }
              - type: object
                required: [versionNumber]
                properties:
                  versionNumber: { type: integer, minimum: 1 }
        monitors:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/BuiltInContentItem" }
              - type: object
                required:
                  [
                    isPublished,
                    isGloballyEnabled,
                    strategyId,
                    strategyName,
                    stockListId,
                    stockListName,
                    activeCount,
                    pendingCount,
                  ]
                properties:
                  isPublished: { type: boolean }
                  isGloballyEnabled: { type: boolean }
                  strategyId: { type: string, format: uuid }
                  strategyName: { type: string }
                  stockListId: { type: string, format: uuid }
                  stockListName: { type: string }
                  lastScanAt: { type: string, format: date-time }
                  activeCount: { type: integer, minimum: 0 }
                  pendingCount: { type: integer, minimum: 0 }

    CreateMonitorRequest:
      type: object
      additionalProperties: false
      description: |
        Unknown properties are rejected rather than ignored — that is what stops an `interval`,
        `cadence` or `schedule` field from ever looking like it was accepted.
      required: [name, strategyId, stockListId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        strategyId: { type: string, format: uuid }
        stockListId: { type: string, format: uuid }
        enabled: { type: boolean, default: true }

    UpdateMonitorRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one property; unknown properties are rejected.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        strategyId:
          { type: string, format: uuid, description: Rebinds the monitor. }
        stockListId:
          { type: string, format: uuid, description: Rebinds the monitor. }
        isPublished:
          {
            type: boolean,
            description: Built-in monitors only; administrators only.,
          }
        isGloballyEnabled:
          {
            type: boolean,
            description: Built-in monitors only; administrators only.,
          }
        displayOrder:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000
          description: Built-in monitors only; administrators only. `null` clears it.

    # -------------------------------------------------------------------------------------------
    # Billing
    # -------------------------------------------------------------------------------------------
    BillingPriceKey:
      type: string
      enum:
        [
          STARTER_MONTHLY,
          STARTER_YEARLY,
          PRO_MONTHLY,
          PRO_YEARLY,
          PRO_PLUS_MONTHLY,
          PRO_PLUS_YEARLY,
        ]
      description: |
        The complete accepted surface for naming a price: Starter, Pro and Pro+, each monthly or
        yearly (a yearly price is charged in full, upfront, every year). A provider price identifier
        is never accepted from a client, and a retired price is never a purchase target.
    BillingInterval: { type: string, enum: [MONTH, YEAR] }
    BillingSubscriptionStatus:
      type: string
      enum:
        [
          ACTIVE,
          TRIALING,
          PAST_DUE,
          UNPAID,
          CANCELED,
          INCOMPLETE,
          INCOMPLETE_EXPIRED,
          PAUSED,
        ]

    BillingCatalogEntry:
      type: object
      required: [key, plan, interval, amountMinorUnits, currency, lookupKey]
      properties:
        key: { $ref: "#/components/schemas/BillingPriceKey" }
        plan: { type: string, enum: [STARTER, PRO, PRO_PLUS] }
        interval: { $ref: "#/components/schemas/BillingInterval" }
        amountMinorUnits: { type: integer, minimum: 0 }
        currency: { type: string, const: usd }
        lookupKey: { type: string }

    BillingPendingChange:
      type: object
      required: [plan, interval, effectiveAt]
      properties:
        plan: { type: string, enum: [STARTER, PRO, PRO_PLUS] }
        interval: { $ref: "#/components/schemas/BillingInterval" }
        effectiveAt: { $ref: "#/components/schemas/NullableDateTime" }

    BillingSubscriptionView:
      type: object
      required:
        [
          plan,
          interval,
          status,
          currentPeriodEnd,
          cancelAtPeriodEnd,
          cancelAt,
          pendingChange,
          legacyPrice,
        ]
      properties:
        plan:
          oneOf: [{ type: string, enum: [STARTER, PRO, PRO_PLUS] }, { type: "null" }]
        interval:
          oneOf:
            [{ $ref: "#/components/schemas/BillingInterval" }, { type: "null" }]
        status: { $ref: "#/components/schemas/BillingSubscriptionStatus" }
        currentPeriodEnd: { $ref: "#/components/schemas/NullableDateTime" }
        cancelAtPeriodEnd: { type: boolean }
        cancelAt: { $ref: "#/components/schemas/NullableDateTime" }
        pendingChange:
          description: A scheduled downgrade or interval change that has not taken effect yet.
          oneOf:
            - { $ref: "#/components/schemas/BillingPendingChange" }
            - { type: "null" }
        legacyPrice:
          type: boolean
          description: |
            True when the subscription is billed on a retired price its subscriber keeps
            (grandfathered). The same plan and cadence is "already on that plan"; any other change
            moves the subscription onto today's catalog price.

    BillingStatus:
      type: object
      required:
        [
          plan,
          billingEnabled,
          subscription,
          canStartCheckout,
          canOpenPortal,
          canChangePlan,
          catalog,
        ]
      properties:
        plan: { $ref: "#/components/schemas/UserPlan" }
        billingEnabled:
          {
            type: boolean,
            description: Whether this deployment has billing configured at all.,
          }
        subscription:
          oneOf:
            - { $ref: "#/components/schemas/BillingSubscriptionView" }
            - { type: "null" }
        canStartCheckout: { type: boolean }
        canOpenPortal: { type: boolean }
        canChangePlan: { type: boolean }
        catalog:
          type: array
          items: { $ref: "#/components/schemas/BillingCatalogEntry" }

    BillingTargetRequest:
      type: object
      required: [priceKey]
      properties:
        priceKey: { $ref: "#/components/schemas/BillingPriceKey" }

    BillingCheckoutResponse:
      type: object
      required: [checkoutUrl]
      properties:
        checkoutUrl: { type: string, format: uri }

    BillingPortalResponse:
      type: object
      required: [portalUrl]
      properties:
        portalUrl: { type: string, format: uri }

    BillingChangeResponse:
      type: object
      required: [effect, kind, effectiveAt, plan]
      properties:
        effect:
          type: string
          enum: [IMMEDIATE, PERIOD_END]
          description: Upgrades apply immediately; downgrades apply at the period end.
        kind: { type: string, enum: [UPGRADE, DOWNGRADE, INTERVAL_CHANGE] }
        effectiveAt: { $ref: "#/components/schemas/NullableDateTime" }
        plan: { $ref: "#/components/schemas/UserPlan" }

    # -------------------------------------------------------------------------------------------
    # Operations
    # -------------------------------------------------------------------------------------------
    AdminHealthResponse:
      type: object
      required: [status, role]
      properties:
        status: { type: string, const: ok }
        role: { type: string, const: ADMIN }

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: api }

    ReadinessCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status: { type: string, enum: [ok, failed] }
        latencyMs: { type: integer, minimum: 0 }
        error:
          { type: string, description: Present only when the probe failed. }

    RedisEvictionPolicyCheck:
      allOf:
        - { $ref: "#/components/schemas/ReadinessCheck" }
        - type: object
          required: [verdict]
          properties:
            verdict:
              type: string
              enum: [SAFE, TOLERATED, ACCEPTED, UNSAFE, UNKNOWN]
              description: |
                How Redis evicts. `UNSAFE` — an `allkeys-*` policy no operator accepted with
                `REDIS_ACCEPTED_EVICTION_POLICY` — fails readiness: it may evict any key, including the
                always-resident benchmark histories and the hydration locks. Every other verdict is
                `ok`; `UNKNOWN` means the policy could not be read.
            policy: { type: string, examples: [noeviction] }
            detail: { type: string }

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          required: [postgres, redis, redisEvictionPolicy]
          properties:
            postgres: { $ref: "#/components/schemas/ReadinessCheck" }
            redis: { $ref: "#/components/schemas/ReadinessCheck" }
            redisEvictionPolicy:
              { $ref: "#/components/schemas/RedisEvictionPolicyCheck" }
